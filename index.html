/* Cadastro completo de Cliente/Fornecedor para fins fiscais, com anexo de documentos. */
function CadastroPessoa({ title, subtitle, items, onChange, filialId }) {
  const isMobile = useIsMobile();
  const blank = { id: null, razaoSocial: "", cpfCnpj: "", inscricaoEstadual: "", endereco: "", numero: "", bairro: "", cidade: "", uf: "", telefone1: "", telefone2: "", email1: "", email2: "", responsavel: "", anexos: [] };
  const [draft, setDraft] = useState(blank);
  const editing = !!draft.id;

  function submit(e) {
    e.preventDefault();
    if (!draft.razaoSocial) return;
    if (editing) onChange(items.map((it) => (it.id === draft.id ? draft : it)));
    else onChange([...items, { ...draft, id: uid(), filialId }]);
    setDraft(blank);
  }
  function edit(row) { setDraft({ ...blank, ...row }); }
  function remove(row) { onChange(items.filter((it) => it.id !== row.id)); if (draft.id === row.id) setDraft(blank); }

  function anexarArquivo(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) { alert("Arquivo muito grande para este protótipo (limite de 1,5 MB por arquivo). Use um arquivo menor."); e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => setDraft((d) => ({ ...d, anexos: [...(d.anexos || []), { id: uid(), nome: file.name, tipo: file.type, dataUrl: reader.result }] }));
    reader.readAsDataURL(file);
    e.target.value = "";
  }
  function removerAnexo(anexoId) {
    setDraft((d) => ({ ...d, anexos: (d.anexos || []).filter((a) => a.id !== anexoId) }));
  }

  return (
    <Card title={title} subtitle={subtitle}>
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr 1fr"), gap: 10 }}>
          <Field label="Razão social / Nome"><TextInput value={draft.razaoSocial} onChange={(e) => setDraft({ ...draft, razaoSocial: e.target.value })} /></Field>
          <Field label="CPF / CNPJ"><TextInput value={draft.cpfCnpj} onChange={(e) => setDraft({ ...draft, cpfCnpj: e.target.value })} /></Field>
          <Field label="Inscrição estadual"><TextInput value={draft.inscricaoEstadual} onChange={(e) => setDraft({ ...draft, inscricaoEstadual: e.target.value })} /></Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr 1fr"), gap: 10 }}>
          <Field label="Endereço"><TextInput value={draft.endereco} onChange={(e) => setDraft({ ...draft, endereco: e.target.value })} /></Field>
          <Field label="Número"><TextInput value={draft.numero} onChange={(e) => setDraft({ ...draft, numero: e.target.value })} /></Field>
          <Field label="Bairro"><TextInput value={draft.bairro} onChange={(e) => setDraft({ ...draft, bairro: e.target.value })} /></Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr"), gap: 10 }}>
          <Field label="Cidade"><TextInput value={draft.cidade} onChange={(e) => setDraft({ ...draft, cidade: e.target.value })} /></Field>
          <Field label="UF"><TextInput maxLength={2} value={draft.uf} onChange={(e) => setDraft({ ...draft, uf: e.target.value.toUpperCase() })} /></Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "1fr 1fr 1fr 1fr"), gap: 10 }}>
          <Field label="Telefone 1"><TextInput value={draft.telefone1} onChange={(e) => setDraft({ ...draft, telefone1: e.target.value })} /></Field>
          <Field label="Telefone 2"><TextInput value={draft.telefone2} onChange={(e) => setDraft({ ...draft, telefone2: e.target.value })} /></Field>
          <Field label="E-mail 1"><TextInput type="email" value={draft.email1} onChange={(e) => setDraft({ ...draft, email1: e.target.value })} /></Field>
          <Field label="E-mail 2"><TextInput type="email" value={draft.email2} onChange={(e) => setDraft({ ...draft, email2: e.target.value })} /></Field>
        </div>
        <Field label="Responsável"><TextInput value={draft.responsavel} onChange={(e) => setDraft({ ...draft, responsavel: e.target.value })} /></Field>
        <div>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: MUTED, marginBottom: 6 }}>Documentos (imagem ou PDF, até 1,5 MB)</div>
          <input type="file" accept="image/*,.pdf" onChange={anexarArquivo} style={{ fontSize: 12.5 }} />
          {!!(draft.anexos || []).length && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8 }}>
              {draft.anexos.map((a) => (
                <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 6, background: BG, border: `1px solid ${BORDER}`, borderRadius: 999, padding: "4px 10px", fontSize: 11.5 }}>
                  <a href={a.dataUrl} download={a.nome} style={{ color: GREEN, textDecoration: "none", fontWeight: 700 }}>{a.nome}</a>
                  <button type="button" onClick={() => removerAnexo(a.id)} style={{ border: "none", background: "none", color: DANGER, cursor: "pointer", fontWeight: 700 }}>×</button>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <Button type="submit">{editing ? "Salvar alteração" : "Adicionar"}</Button>
          {editing && <Button type="button" variant="ghost" onClick={() => setDraft(blank)}>Cancelar</Button>}
        </div>
      </form>
      <div style={{ height: 1, background: BORDER, margin: "16px 0" }} />
      <Table
        columns={[
          { key: "razaoSocial", label: "Razão social / Nome" },
          { key: "cpfCnpj", label: "CPF/CNPJ" },
          { key: "cidade", label: "Cidade/UF", render: (r) => [r.cidade, r.uf].filter(Boolean).join("/") || "—" },
          { key: "telefone1", label: "Telefone" },
          { key: "anexos", label: "Docs", render: (r) => (r.anexos?.length ? `${r.anexos.length} arquivo(s)` : "—") },
        ]}
        rows={items}
        onEdit={edit}
        onDelete={remove}
      />
    </Card>
  );
}

function Vendas({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const vendedores = db.vendedores.filter((v) => v.filialId === filialId);
  const clientes = db.clientes.filter((c) => c.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const empresa = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
  const filial = empresa?.filiais.find((f) => f.id === filialId);
  const [danfeVenda, setDanfeVenda] = useState(null);

  const [form, setForm] = useState({ data: todayISO(), clienteId: "", vendedorId: "", produtoId: "", qtd: "", precoUnit: "", condicaoPagamento: "vista_pix", centroCustoId: "" });

  function precoAoEscolher(produtoId) {
    const p = produtos.find((x) => x.id === produtoId);
    setForm((f) => ({ ...f, produtoId, precoUnit: p ? p.precoVenda : "" }));
  }

  function lancarVenda(e) {
    e.preventDefault();
    const vendedor = vendedores.find((v) => v.id === form.vendedorId);
    const total = Number(form.qtd || 0) * Number(form.precoUnit || 0);
    const comissaoValor = vendedor ? total * (Number(vendedor.percentualComissao || 0) / 100) : 0;
    let comissaoGerenteValor = 0;
    let gerenteComercialId = null;
    if (vendedor && vendedor.gerenteComercialId) {
      const gerente = vendedores.find((v) => v.id === vendedor.gerenteComercialId);
      if (gerente) {
        gerenteComercialId = gerente.id;
        comissaoGerenteValor = total * (Number(gerente.percentualComissaoGerente || 0) / 100);
      }
    }
    const condicao = form.condicaoPagamento || "vista_pix";
    const parcelas = gerarParcelas(condicao, total, form.data);
    const venda = {
      id: uid(), filialId, data: form.data, clienteId: form.clienteId, vendedorId: form.vendedorId,
      itens: [{ produtoId: form.produtoId, qtd: Number(form.qtd), precoUnit: Number(form.precoUnit) }],
      total, comissaoValor, gerenteComercialId, comissaoGerenteValor,
      condicaoPagamento: condicao, centroCustoId: form.centroCustoId || "",
      parcelas, nfe: null,
    };
    update((prev) => ({
      ...prev,
      vendas: [...prev.vendas, venda],
      movimentacoesEstoque: [...prev.movimentacoesEstoque, { id: uid(), filialId, data: form.data, produtoId: form.produtoId, tipo: "saida", qtd: Number(form.qtd), motivo: "Venda", origem: "venda:" + venda.id }],
    }));
    setForm({ data: todayISO(), clienteId: "", vendedorId: "", produtoId: "", qtd: "", precoUnit: "", condicaoPagamento: "vista_pix", centroCustoId: "" });
  }

  function atualizarParcela(vendaId, parcelaId, status) {
    update((prev) => ({
      ...prev,
      vendas: prev.vendas.map((v) => (v.id !== vendaId ? v : { ...v, parcelas: v.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })),
    }));
  }

  function emitirNFe(venda) {
    update((prev) => ({
      ...prev,
      vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { status: "autorizada", chave: gerarChaveAcessoFake(), protocolo: gerarProtocoloFake(), dataEmissao: todayISO(), ambiente: "homologacao" } })),
    }));
  }
  function cancelarNFe(venda) {
    const justificativa = window.prompt("Justificativa do cancelamento (mínimo 15 caracteres — exigência real da SEFAZ):");
    if (!justificativa || justificativa.trim().length < 15) { alert("Cancelamento não realizado: a justificativa precisa ter pelo menos 15 caracteres."); return; }
    update((prev) => ({
      ...prev,
      vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { ...v.nfe, status: "cancelada", dataCancelamento: todayISO(), justificativaCancelamento: justificativa } })),
    }));
  }
  function consultarNFe(venda) {
    if (!venda.nfe) { alert("Esta venda ainda não teve NF-e emitida."); return; }
    alert(`Consulta simulada — ambiente de HOMOLOGAÇÃO, sem conexão real com a SEFAZ.\n\nStatus: ${venda.nfe.status}\nChave de acesso: ${venda.nfe.chave}\nProtocolo: ${venda.nfe.protocolo}`);
  }

  const nomeProduto = (id) => produtos.find((p) => p.id === id)?.nome || "—";
  const nomeCliente = (id) => clientes.find((c) => c.id === id)?.razaoSocial || "—";
  const nomeVendedor = (id) => { const v = vendedores.find((x) => x.id === id); return v ? (v.apelido || v.nomeCompleto) : "—"; };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <CadastroPessoa title="Clientes" subtitle="Cadastro completo para fins fiscais — usado na emissão de NF-e." items={clientes} filialId={filialId}
        onChange={(items) => update((prev) => ({ ...prev, clientes: mergeByFilial(prev.clientes, items, filialId) }))} />

      <CrudBlock
        title="Vendedores & Comissão" subtitle="Cada vendedor pode ter um gerente comercial, que recebe uma comissão adicional sobre as vendas dele."
        filialId={filialId} items={vendedores} onChange={(items) => update((prev) => ({ ...prev, vendedores: mergeByFilial(prev.vendedores, items, filialId) }))}
        fields={[
          { key: "nomeCompleto", label: "Nome completo", required: true },
          { key: "apelido", label: "Apelido" },
          { key: "telefone", label: "Telefone" },
          { key: "percentualComissao", label: "Comissão (%)", type: "number" },
          { key: "gerenteComercialId", label: "Gerente comercial", type: "select", options: vendedores.map((v) => ({ value: v.id, label: v.apelido || v.nomeCompleto })) },
          { key: "percentualComissaoGerente", label: "Comissão do gerente (%)", type: "number" },
        ]}
        columns={[
          { key: "nomeCompleto", label: "Nome" },
          { key: "apelido", label: "Apelido" },
          { key: "percentualComissao", label: "Comissão", render: (r) => `${r.percentualComissao || 0}%` },
          { key: "gerenteComercialId", label: "Gerente", render: (r) => { const g = vendedores.find((x) => x.id === r.gerenteComercialId); return g ? `${g.apelido || g.nomeCompleto} (${r.percentualComissaoGerente || 0}%)` : "—"; } },
        ]}
      />

      <Card title="Lançar venda" subtitle="Gera parcelas conforme a condição de pagamento, alimenta contas a receber, comissões e a DRE.">
        <form onSubmit={lancarVenda} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "repeat(4, 1fr)"), gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Cliente"><Select options={clientes.map((c) => ({ value: c.id, label: c.razaoSocial }))} value={form.clienteId} onChange={(e) => setForm({ ...form, clienteId: e.target.value })} /></Field>
          <Field label="Vendedor"><Select options={vendedores.map((v) => ({ value: v.id, label: v.apelido || v.nomeCompleto }))} value={form.vendedorId} onChange={(e) => setForm({ ...form, vendedorId: e.target.value })} /></Field>
          <Field label="Produto"><Select options={produtos.map((p) => ({ value: p.id, label: p.nome }))} value={form.produtoId} onChange={(e) => precoAoEscolher(e.target.value)} /></Field>
          <Field label="Qtd"><TextInput type="number" step="0.01" value={form.qtd} onChange={(e) => setForm({ ...form, qtd: e.target.value })} /></Field>
          <Field label="Preço unit. (R$)"><TextInput type="number" step="0.01" value={form.precoUnit} onChange={(e) => setForm({ ...form, precoUnit: e.target.value })} /></Field>
          <Field label="Condição de pagamento"><Select options={CONDICOES_PAGAMENTO} value={form.condicaoPagamento} onChange={(e) => setForm({ ...form, condicaoPagamento: e.target.value })} /></Field>
          <Field label="Centro de custo"><Select options={centrosCusto.map((c) => ({ value: c.id, label: c.nome }))} value={form.centroCustoId} onChange={(e) => setForm({ ...form, centroCustoId: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar venda</Button></div>
        </form>
      </Card>

      <Card title={`Vendas lançadas (${vendas.length})`}>
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "clienteId", label: "Cliente", render: (r) => nomeCliente(r.clienteId) },
            { key: "vendedorId", label: "Vendedor", render: (r) => nomeVendedor(r.vendedorId) },
            { key: "produto", label: "Produto", render: (r) => nomeProduto(r.itens[0]?.produtoId) },
            { key: "total", label: "Total", render: (r) => brl(r.total) },
            { key: "comissaoValor", label: "Comissão", render: (r) => <span>{brl(r.comissaoValor)}{r.comissaoGerenteValor > 0 && <><br /><span style={{ fontSize: 10.5, color: MUTED }}>+ gerente: {brl(r.comissaoGerenteValor)}</span></>}</span> },
            { key: "condicaoPagamento", label: "Condição", render: (r) => CONDICOES_PAGAMENTO.find((c) => c.value === r.condicaoPagamento)?.label || "—" },
            { key: "parcelas", label: "Parcelas / recebimento", render: (r) => <ParcelasList parcelas={r.parcelas} onStatusChange={(pid, st) => atualizarParcela(r.id, pid, st)} /> },
            {
              key: "nfe", label: "NF-e", render: (r) => (
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {r.nfe ? (
                    <span style={{ fontSize: 11, fontWeight: 700, color: r.nfe.status === "cancelada" ? DANGER : SUCCESS }}>
                      {r.nfe.status === "cancelada" ? "Cancelada" : "Autorizada"} (homolog.)
                    </span>
                  ) : <span style={{ fontSize: 11, color: MUTED }}>Não emitida</span>}
                  <div style={{ display: "flex", gap: 8 }}>
                    {!r.nfe && <button onClick={() => emitirNFe(r)} style={linkBtnStyle(GREEN)}>emitir</button>}
                    {r.nfe && r.nfe.status !== "cancelada" && <button onClick={() => cancelarNFe(r)} style={linkBtnStyle(DANGER)}>cancelar</button>}
                    {r.nfe && <button onClick={() => consultarNFe(r)} style={linkBtnStyle(MUTED)}>consultar</button>}
                    {r.nfe && <button onClick={() => setDanfeVenda(r)} style={linkBtnStyle(GOLD)}>ver DANFE</button>}
                  </div>
                </div>
              ),
            },
          ]}
          rows={[...vendas].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>

      {danfeVenda && (
        <Modal title="DANFE — Ambiente de Homologação" onClose={() => setDanfeVenda(null)} wide>
          <Danfe venda={danfeVenda} empresa={empresa} filial={filial} cliente={clientes.find((c) => c.id === danfeVenda.clienteId)} produtos={produtos} />
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Button onClick={() => window.print()}>Imprimir / Salvar como PDF</Button>
            <Button variant="ghost" onClick={() => setDanfeVenda(null)}>Fechar</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- Estoque ---------------- */

function Estoque({ db, filialId }) {
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const movimentacoes = db.movimentacoesEstoque.filter((m) => m.filialId === filialId);
  const producoes = db.producoesRacao.filter((p) => p.filialId === filialId);

  const saldoPorProduto = {};
  movimentacoes.forEach((m) => {
    const delta = m.tipo === "entrada" ? Number(m.qtd || 0) : -Number(m.qtd || 0);
    saldoPorProduto[m.produtoId] = (saldoPorProduto[m.produtoId] || 0) + delta;
  });

  const racaoProduzida = producoes.reduce((s, p) => s + Number(p.qtdKg || 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card title="Saldo por produto" subtitle="Entradas (compras e importação de XML) menos saídas (vendas), lançamento a lançamento.">
        <Table
          columns={[
            { key: "nome", label: "Produto" },
            { key: "unidade", label: "Unidade" },
            { key: "lote", label: "Lote", render: (r) => r.lote || "—" },
            { key: "saldo", label: "Saldo atual", render: (r) => (saldoPorProduto[r.id] || 0).toLocaleString("pt-BR") },
            { key: "valorEstoque", label: "Custo unitário", render: (r) => brl(r.custoUnit) },
          ]}
          rows={produtos}
        />
      </Card>
      <Card title="Movimentações recentes">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "produtoId", label: "Produto", render: (r) => produtos.find((p) => p.id === r.produtoId)?.nome || "—" },
            { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "entrada" ? "Entrada" : "Saída") },
            { key: "qtd", label: "Qtd", render: (r) => r.qtd.toLocaleString("pt-BR") },
            { key: "motivo", label: "Motivo" },
          ]}
          rows={[...movimentacoes].sort((a, b) => (a.data < b.data ? 1 : -1)).slice(0, 20)}
          emptyText="Nenhuma movimentação registrada ainda."
        />
      </Card>
      <Card title="Estoque de ração produzida">
        <div style={{ fontSize: 22, fontWeight: 800, color: GREEN }}>{racaoProduzida.toLocaleString("pt-BR")} kg</div>

        <div style={{ fontSize: 12.5, color: MUTED }}>Total produzido registrado no módulo Fábrica de Ração.</div>
      </Card>
    </div>
  );
}

/* ---------------- Fábrica de Ração ---------------- */

function FabricaRacao({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const formulacoes = db.formulacoes.filter((f) => f.filialId === filialId);
  const producoes = db.producoesRacao.filter((p) => p.filialId === filialId);
  const galpoes = db.galpoes.filter((g) => g.filialId === filialId);

  const [ingredientes, setIngredientes] = useState([{ nome: "", percentual: "", custoKg: "" }]);
  const [nomeFormula, setNomeFormula] = useState("");

  function addLinha() { setIngredientes([...ingredientes, { nome: "", percentual: "", custoKg: "" }]); }
  function updLinha(i, patch) { setIngredientes(ingredientes.map((l, idx) => (idx === i ? { ...l, ...patch } : l))); }
  function removeLinha(i) { setIngredientes(ingredientes.filter((_, idx) => idx !== i)); }

  function salvarFormula(e) {
    e.preventDefault();
    update((prev) => ({ ...prev, formulacoes: [...prev.formulacoes, { id: uid(), filialId, nome: nomeFormula, ingredientes }] }));
    setNomeFormula(""); setIngredientes([{ nome: "", percentual: "", custoKg: "" }]);
  }

  const custoKgFormula = (f) => f.ingredientes.reduce((s, i) => s + (Number(i.percentual || 0) / 100) * Number(i.custoKg || 0), 0);

  const [prod, setProd] = useState({ data: todayISO(), formulacaoId: "", qtdKg: "", moega: "", pesoPorSaco: "40", galpaoDestinoId: "" });
  const formulaSelecionada = formulacoes.find((f) => f.id === prod.formulacaoId);
  const custoTotalPreview = formulaSelecionada ? custoKgFormula(formulaSelecionada) * Number(prod.qtdKg || 0) : 0;

  function lancarProducao(e) {
    e.preventDefault();
    const formula = formulacoes.find((f) => f.id === prod.formulacaoId);
    const custoTotal = formula ? custoKgFormula(formula) * Number(prod.qtdKg || 0) : 0;
    const sacos = Number(prod.pesoPorSaco || 0) > 0 ? Number(prod.qtdKg || 0) / Number(prod.pesoPorSaco) : 0;
    update((prev) => ({ ...prev, producoesRacao: [...prev.producoesRacao, { id: uid(), filialId, data: prod.data, formulacaoId: prod.formulacaoId, moega: prod.moega, pesoPorSaco: Number(prod.pesoPorSaco || 0), galpaoDestinoId: prod.galpaoDestinoId, qtdKg: Number(prod.qtdKg), sacos, custoTotal }] }));
    setProd({ data: todayISO(), formulacaoId: "", qtdKg: "", moega: "", pesoPorSaco: "40", galpaoDestinoId: "" });
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card title="Referência de mercado — insumos" subtitle="Cotações consultadas para apoiar a decisão de compra. Preços de commodities agrícolas oscilam diariamente — confirme no fornecedor antes de negociar.">
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
          <StatCard label="Milho — saca 60kg (CEPEA)" value="R$ 67 – 70" accent={GOLD} />
          <StatCard label="Farelo de soja — tonelada" value="R$ 1.900" accent={GREEN} />
        </div>
        <div style={{ fontSize: 10.5, color: MUTED, marginTop: 8 }}>Fonte: CEPEA/Esalq e Portal DBO, cotações de agosto de 2026. Valores de referência — não são atualizados automaticamente pelo sistema.</div>
      </Card>

      <Card title="Nova formulação" subtitle="Cadastre os ingredientes e o percentual de cada um na mistura.">
        <form onSubmit={salvarFormula} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <Field label="Nome da formulação"><TextInput value={nomeFormula} onChange={(e) => setNomeFormula(e.target.value)} /></Field>
          {ingredientes.map((ing, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr 1fr auto"), gap: 10 }}>
              <TextInput placeholder="Ingrediente (ex: milho)" value={ing.nome} onChange={(e) => updLinha(i, { nome: e.target.value })} />
              <TextInput placeholder="% na mistura" type="number" value={ing.percentual} onChange={(e) => updLinha(i, { percentual: e.target.value })} />
              <TextInput placeholder="Custo/kg (R$)" type="number" step="0.01" value={ing.custoKg} onChange={(e) => updLinha(i, { custoKg: e.target.value })} />
              <Button type="button" variant="danger" onClick={() => removeLinha(i)}>×</Button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8 }}>
            <Button type="button" variant="ghost" onClick={addLinha}>+ ingrediente</Button>
            <Button type="submit">Salvar formulação</Button>
          </div>
        </form>
      </Card>

      <Card title={`Formulações cadastradas (${formulacoes.length})`}>
        <Table
          columns={[
            { key: "nome", label: "Formulação" },
            { key: "ingredientes", label: "Ingredientes", render: (r) => r.ingredientes.map((i) => `${i.nome} (${i.percentual}%)`).join(", ") },
            { key: "custoKg", label: "Custo/kg", render: (r) => brl(custoKgFormula(r)) },
          ]}
          rows={formulacoes}
        />
      </Card>

      <Card title="Registrar produção" subtitle="Baixa o custo calculado da formulação, converte em sacos e alimenta o estoque de ração.">
        <form onSubmit={lancarProducao} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "repeat(3, 1fr)"), gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={prod.data} onChange={(e) => setProd({ ...prod, data: e.target.value })} /></Field>
          <Field label="Formulação"><Select options={formulacoes.map((f) => ({ value: f.id, label: f.nome }))} value={prod.formulacaoId} onChange={(e) => setProd({ ...prod, formulacaoId: e.target.value })} /></Field>
          <Field label="Moega / silo de origem"><TextInput value={prod.moega} onChange={(e) => setProd({ ...prod, moega: e.target.value })} /></Field>
          <Field label="Quantidade (kg)"><TextInput type="number" value={prod.qtdKg} onChange={(e) => setProd({ ...prod, qtdKg: e.target.value })} /></Field>
          <Field label="Peso por saco (kg)"><TextInput type="number" value={prod.pesoPorSaco} onChange={(e) => setProd({ ...prod, pesoPorSaco: e.target.value })} /></Field>
          <Field label="Silo/Galpão de destino"><Select options={galpoes.map((g) => ({ value: g.id, label: g.nome }))} value={prod.galpaoDestinoId} onChange={(e) => setProd({ ...prod, galpaoDestinoId: e.target.value })} /></Field>
          <div style={{ fontSize: 12, color: MUTED, paddingBottom: 8 }}>
            {Number(prod.pesoPorSaco) > 0 && Number(prod.qtdKg) > 0 ? `≈ ${(Number(prod.qtdKg) / Number(prod.pesoPorSaco)).toFixed(1)} sacos` : "—"}
          </div>
          <div style={{ gridColumn: "1 / -1" }}>
            <div style={{ background: BG, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "10px 14px", marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12.5, color: MUTED, fontWeight: 700 }}>Custo total gerado neste lote</span>
              <span style={{ fontSize: 18, fontWeight: 800, color: GREEN }}>{brl(custoTotalPreview)}</span>
            </div>
            <Button type="submit">Registrar</Button>
          </div>
        </form>
      </Card>

      <Card title="Produções registradas">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "formulacaoId", label: "Formulação", render: (r) => formulacoes.find((f) => f.id === r.formulacaoId)?.nome || "—" },
            { key: "moega", label: "Moega", render: (r) => r.moega || "—" },
            { key: "galpaoDestinoId", label: "Destino", render: (r) => galpoes.find((g) => g.id === r.galpaoDestinoId)?.nome || "—" },
            { key: "qtdKg", label: "Kg produzidos", render: (r) => r.qtdKg.toLocaleString("pt-BR") },
            { key: "sacos", label: "Sacos", render: (r) => (r.sacos || 0).toFixed(1) },
            { key: "custoTotal", label: "Custo total", render: (r) => brl(r.custoTotal) },
          ]}
          rows={[...producoes].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>
    </div>
  );
}

/* Leitura de XML de NF-e (DANFE eletrônico) no navegador — sem backend. */
function parseNFeXML(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML inválido ou mal formado.");
  const txt = (root, tag) => (root ? root.getElementsByTagName(tag)[0]?.textContent?.trim() || "" : "");

  const infNFe = doc.getElementsByTagName("infNFe")[0];
  if (!infNFe) throw new Error("Não encontrei a tag <infNFe> — este arquivo não parece ser um XML de NF-e.");

  const emit = infNFe.getElementsByTagName("emit")[0];
  const ide = infNFe.getElementsByTagName("ide")[0];
  const total = infNFe.getElementsByTagName("ICMSTot")[0];
  const chaveAcesso = (infNFe.getAttribute("Id") || "").replace(/^NFe/, "");

  const itens = Array.from(infNFe.getElementsByTagName("det")).map((det) => {
    const prod = det.getElementsByTagName("prod")[0];
    return {
      codigo: txt(prod, "cProd"),
      nome: txt(prod, "xProd") || "Item sem descrição",
      ncm: txt(prod, "NCM"),
      cfop: txt(prod, "CFOP"),
      unidade: txt(prod, "uCom"),
      qtd: parseFloat(txt(prod, "qCom")) || 0,
      valorUnit: parseFloat(txt(prod, "vUnCom")) || 0,
      valorTotal: parseFloat(txt(prod, "vProd")) || 0,
    };
  });
  if (!itens.length) throw new Error("O XML não contém itens de produto (<det>/<prod>).");

  return {
    chaveAcesso,
    numero: txt(ide, "nNF"),
    dataEmissao: (txt(ide, "dhEmi") || "").slice(0, 10) || todayISO(),
    fornecedor: { cnpj: txt(emit, "CNPJ"), nome: txt(emit, "xNome") || "Fornecedor do XML" },
    valorTotal: parseFloat(txt(total, "vNF")) || itens.reduce((s, i) => s + i.valorTotal, 0),
    itens,
  };
}

function Compras({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const fornecedores = db.fornecedores.filter((f) => f.filialId === filialId);
  const compras = db.compras.filter((c) => c.filialId === filialId);
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);
  const [form, setForm] = useState({ data: todayISO(), fornecedorId: "", categoria: "insumo", descricao: "", valor: "", condicaoPagamento: "boleto_30", centroCustoId: "", produtoId: "", quantidade: "" });
  const [xmlPreview, setXmlPreview] = useState(null);
  const [xmlError, setXmlError] = useState("");

  function lancar(e) {
    e.preventDefault();
    const parcelas = gerarParcelas(form.condicaoPagamento || "boleto_30", Number(form.valor || 0), form.data);
    const compraId = uid();
    update((prev) => ({
      ...prev,
      compras: [...prev.compras, { id: compraId, filialId, data: form.data, fornecedorId: form.fornecedorId, categoria: form.categoria, descricao: form.descricao, valor: Number(form.valor), condicaoPagamento: form.condicaoPagamento, centroCustoId: form.centroCustoId, parcelas }],
      movimentacoesEstoque: form.produtoId && Number(form.quantidade) > 0
        ? [...prev.movimentacoesEstoque, { id: uid(), filialId, data: form.data, produtoId: form.produtoId, tipo: "entrada", qtd: Number(form.quantidade), motivo: form.descricao || "Compra", origem: "compra:" + compraId }]
        : prev.movimentacoesEstoque,
    }));
    setForm({ data: todayISO(), fornecedorId: "", categoria: "insumo", descricao: "", valor: "", condicaoPagamento: "boleto_30", centroCustoId: "", produtoId: "", quantidade: "" });
  }

  function atualizarParcela(compraId, parcelaId, status) {
    update((prev) => ({ ...prev, compras: prev.compras.map((c) => (c.id !== compraId ? c : { ...c, parcelas: c.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })) }));
  }

  function handleXmlFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setXmlError("");
    const reader = new FileReader();
    reader.onload = () => {
      try { setXmlPreview(parseNFeXML(reader.result)); }
      catch (err) { setXmlError(err.message || "Não foi possível ler este XML."); setXmlPreview(null); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function confirmarImportacaoXML() {
    if (!xmlPreview) return;
    update((prev) => {
      let fornecedoresNext = prev.fornecedores;
      let fornecedor = xmlPreview.fornecedor.cnpj && fornecedoresNext.find((f) => f.filialId === filialId && f.cpfCnpj === xmlPreview.fornecedor.cnpj);
      if (!fornecedor) {
        fornecedor = { id: uid(), filialId, razaoSocial: xmlPreview.fornecedor.nome, cpfCnpj: xmlPreview.fornecedor.cnpj, inscricaoEstadual: "", endereco: "", numero: "", bairro: "", cidade: "", uf: "", telefone1: "", telefone2: "", email1: "", email2: "", responsavel: "", anexos: [] };
        fornecedoresNext = [...fornecedoresNext, fornecedor];
      }
      let produtosNext = prev.produtos;
      const movimentacoes = [];
      xmlPreview.itens.forEach((item) => {
        let produto = produtosNext.find((p) => p.filialId === filialId && p.nome.trim().toLowerCase() === item.nome.trim().toLowerCase());
        if (!produto) {
          produto = { id: uid(), filialId, nome: item.nome, tipo: "outro", unidade: (item.unidade || "un").toLowerCase(), custoUnit: item.valorUnit, precoVenda: "", lote: "", cfop: item.cfop };
          produtosNext = [...produtosNext, produto];
        }
        movimentacoes.push({ id: uid(), filialId, data: xmlPreview.dataEmissao, produtoId: produto.id, tipo: "entrada", qtd: item.qtd, motivo: "Importação XML NF-e nº " + xmlPreview.numero, origem: "xml:" + xmlPreview.chaveAcesso });
      });
      const parcelas = gerarParcelas("boleto_30", xmlPreview.valorTotal, xmlPreview.dataEmissao);
      const compra = {
        id: uid(), filialId, data: xmlPreview.dataEmissao, fornecedorId: fornecedor.id,
        categoria: "insumo", descricao: `Importação XML NF-e nº ${xmlPreview.numero}`, valor: xmlPreview.valorTotal,
        condicaoPagamento: "boleto_30", centroCustoId: "", parcelas, origemXml: true, chaveAcessoOrigem: xmlPreview.chaveAcesso,
      };
      return { ...prev, fornecedores: fornecedoresNext, produtos: produtosNext, compras: [...prev.compras, compra], movimentacoesEstoque: [...prev.movimentacoesEstoque, ...movimentacoes] };
    });
    setXmlPreview(null);
  }

  const nomeFornecedor = (id) => fornecedores.find((f) => f.id === id)?.razaoSocial || "—";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <CadastroPessoa title="Fornecedores" subtitle="Cadastro completo para fins fiscais." items={fornecedores} filialId={filialId}
        onChange={(items) => update((prev) => ({ ...prev, fornecedores: mergeByFilial(prev.fornecedores, items, filialId) }))} />

      <Card title="Importar XML de NF-e de compra" subtitle="Lê o XML no seu navegador, cadastra fornecedor/produtos novos automaticamente e dá entrada no estoque.">
        <input type="file" accept=".xml,text/xml" onChange={handleXmlFile} style={{ fontSize: 12.5 }} />
        {xmlError && <div style={{ color: DANGER, fontSize: 12.5, marginTop: 10 }}>{xmlError}</div>}
        {xmlPreview && (
          <div style={{ marginTop: 14, background: BG, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 800, color: GREEN }}>NF-e nº {xmlPreview.numero} — {xmlPreview.fornecedor.nome}</div>
            <div style={{ fontSize: 11.5, color: MUTED, marginBottom: 8 }}>CNPJ {xmlPreview.fornecedor.cnpj || "não informado"} · Emissão {xmlPreview.dataEmissao} · Total {brl(xmlPreview.valorTotal)}</div>
            <Table
              columns={[
                { key: "nome", label: "Produto" },
                { key: "cfop", label: "CFOP" },
                { key: "qtd", label: "Qtd" },
                { key: "valorUnit", label: "Vlr. unit.", render: (r) => brl(r.valorUnit) },
                { key: "valorTotal", label: "Vlr. total", render: (r) => brl(r.valorTotal) },
              ]}
              rows={xmlPreview.itens}
            />
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <Button onClick={confirmarImportacaoXML}>Confirmar importação</Button>
              <Button variant="ghost" onClick={() => setXmlPreview(null)}>Descartar</Button>
            </div>
          </div>
        )}
      </Card>

      <Card title="Lançar compra manual" subtitle="Gera parcelas conforme a condição de pagamento e alimenta a DRE como despesa.">
        <form onSubmit={lancar} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "repeat(4, 1fr)"), gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Fornecedor"><Select options={fornecedores.map((f) => ({ value: f.id, label: f.razaoSocial }))} value={form.fornecedorId} onChange={(e) => setForm({ ...form, fornecedorId: e.target.value })} /></Field>
          <Field label="Categoria">
            <Select options={[{ value: "insumo", label: "Insumo / Ração" }, { value: "pintinhos", label: "Pintinhos de 1 dia" }, { value: "administrativo", label: "Administrativo" }, { value: "manutencao", label: "Manutenção" }, { value: "outro", label: "Outro" }]} value={form.categoria} onChange={(e) => setForm({ ...form, categoria: e.target.value })} />
          </Field>
          <Field label="Descrição"><TextInput value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })} /></Field>
          <Field label="Valor (R$)"><TextInput type="number" step="0.01" value={form.valor} onChange={(e) => setForm({ ...form, valor: e.target.value })} /></Field>
          <Field label="Condição de pagamento"><Select options={CONDICOES_PAGAMENTO} value={form.condicaoPagamento} onChange={(e) => setForm({ ...form, condicaoPagamento: e.target.value })} /></Field>
          <Field label="Centro de custo"><Select options={centrosCusto.map((c) => ({ value: c.id, label: c.nome }))} value={form.centroCustoId} onChange={(e) => setForm({ ...form, centroCustoId: e.target.value })} /></Field>
          <Field label="Produto (dá entrada no estoque)"><Select options={produtos.map((p) => ({ value: p.id, label: `${p.nome} (${p.unidade})` }))} value={form.produtoId} onChange={(e) => setForm({ ...form, produtoId: e.target.value })} /></Field>
          <Field label="Quantidade recebida"><TextInput type="number" step="0.01" value={form.quantidade} onChange={(e) => setForm({ ...form, quantidade: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar compra</Button></div>
        </form>
      </Card>
      <Card title={`Compras lançadas (${compras.length})`}>
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "fornecedorId", label: "Fornecedor", render: (r) => nomeFornecedor(r.fornecedorId) },
            { key: "categoria", label: "Categoria", render: (r) => <span>{r.categoria}{r.origemXml && <><br /><span style={{ fontSize: 10, color: MUTED }}>via XML</span></>}</span> },
            { key: "descricao", label: "Descrição" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "parcelas", label: "Parcelas / pagamento", render: (r) => <ParcelasList parcelas={r.parcelas} onStatusChange={(pid, st) => atualizarParcela(r.id, pid, st)} /> },
          ]}
          rows={[...compras].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>
    </div>
  );
}

/* ---------------- Financeiro ---------------- */

function Financeiro({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const compras = db.compras.filter((c) => c.filialId === filialId);
  const fretes = db.fretes.filter((f) => f.filialId === filialId);
  const avulsas = db.contasAvulsas.filter((a) => a.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);

  const abertos = (s) => s !== "pago" && s !== "cancelado";

  // parcelas de vendas (a receber) e compras (a pagar), achatadas com referência ao documento de origem
  const parcelasReceber = vendas.flatMap((v) => (v.parcelas || []).map((p) => ({ ...p, origem: "Venda", data: v.data, ref: v.id })));
  const parcelasPagarCompras = compras.flatMap((c) => (c.parcelas || []).map((p) => ({ ...p, origem: c.descricao || "Compra", data: c.data, ref: c.id })));

  const totalReceber = parcelasReceber.filter((p) => abertos(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + avulsas.filter((a) => a.tipo === "receber" && abertos(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);
  const totalPagar = parcelasPagarCompras.filter((p) => abertos(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + fretes.filter((f) => abertos(f.statusPagamento)).reduce((s, f) => s + Number(f.valorFrete || 0), 0)
    + avulsas.filter((a) => a.tipo === "pagar" && abertos(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);

  function atualizarParcelaVenda(vendaId, parcelaId, status) {
    update((prev) => ({ ...prev, vendas: prev.vendas.map((v) => (v.id !== vendaId ? v : { ...v, parcelas: v.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })) }));
  }
  function atualizarParcelaCompra(compraId, parcelaId, status) {
    update((prev) => ({ ...prev, compras: prev.compras.map((c) => (c.id !== compraId ? c : { ...c, parcelas: c.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })) }));
  }
  function atualizarStatusFrete(freteId, status) {
    update((prev) => ({ ...prev, fretes: prev.fretes.map((f) => (f.id === freteId ? { ...f, statusPagamento: status } : f)) }));
  }
  function atualizarStatusAvulsa(id, status) {
    update((prev) => ({ ...prev, contasAvulsas: prev.contasAvulsas.map((a) => (a.id === id ? { ...a, status } : a)) }));
  }

  const [form, setForm] = useState({ tipo: "pagar", descricao: "", valor: "", vencimento: todayISO(), centroCustoId: "" });
  function lancarAvulsa(e) {
    e.preventDefault();
    update((prev) => ({ ...prev, contasAvulsas: [...prev.contasAvulsas, { id: uid(), filialId, ...form, valor: Number(form.valor), status: "pendente" }] }));
    setForm({ tipo: "pagar", descricao: "", valor: "", vencimento: todayISO(), centroCustoId: "" });
  }
  function removerAvulsa(a) {
    update((prev) => ({ ...prev, contasAvulsas: prev.contasAvulsas.filter((x) => x.id !== a.id) }));
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14 }}>
        <StatCard label="Total a receber" value={brl(totalReceber)} accent={GOLD} />
        <StatCard label="Total a pagar" value={brl(totalPagar)} accent={DANGER} />
        <StatCard label="Saldo projetado" value={brl(totalReceber - totalPagar)} accent={GREEN} />
      </div>

      <div style={{ background: "#EDE7F6", border: "1px solid #C9B8E8", borderRadius: 10, padding: "10px 14px", fontSize: 12, color: "#4A3A70" }}>
        Os status "Faturado", "Pago" e "Em reconciliação" são atualizados manualmente aqui ou nos módulos de origem. Uma conciliação bancária automática via API do banco não está incluída neste protótipo — isso exigiria credenciais e integração real com a instituição financeira.
      </div>

      <Card title="Lançar conta avulsa" subtitle="Para lançamentos de contas a pagar ou a receber que não vêm de uma venda ou compra.">
        <form onSubmit={lancarAvulsa} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "1fr 2fr 1fr 1fr 1fr"), gap: 10, alignItems: "end" }}>
          <Field label="Tipo"><Select options={[{ value: "pagar", label: "Conta a pagar" }, { value: "receber", label: "Conta a receber" }]} value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })} /></Field>
          <Field label="Descrição"><TextInput value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })} /></Field>
          <Field label="Valor (R$)"><TextInput type="number" step="0.01" value={form.valor} onChange={(e) => setForm({ ...form, valor: e.target.value })} /></Field>
          <Field label="Vencimento"><TextInput type="date" value={form.vencimento} onChange={(e) => setForm({ ...form, vencimento: e.target.value })} /></Field>
          <Field label="Centro de custo"><Select options={centrosCusto.map((c) => ({ value: c.id, label: c.nome }))} value={form.centroCustoId} onChange={(e) => setForm({ ...form, centroCustoId: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar</Button></div>
        </form>
      </Card>
      <Card title={`Contas avulsas (${avulsas.length})`}>
        <Table
          columns={[
            { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "pagar" ? "A pagar" : "A receber") },
            { key: "descricao", label: "Descrição" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "vencimento", label: "Vencimento" },
            { key: "status", label: "Status", render: (r) => <StatusSelect status={r.status} onChange={(v) => atualizarStatusAvulsa(r.id, v)} /> },
          ]}
          rows={avulsas}
          onDelete={removerAvulsa}
        />
      </Card>

      <Card title="Contas a receber — parcelas de vendas">
        <Table
          columns={[
            { key: "data", label: "Data da venda" },
            { key: "numero", label: "Parcela", render: (r) => `${r.numero}/${r.de}` },
            { key: "vencimento", label: "Vencimento" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "status", label: "Status", render: (r) => <StatusSelect status={r.status} onChange={(v) => atualizarParcelaVenda(r.ref, r.id, v)} /> },
          ]}
          rows={parcelasReceber}
          emptyText="Nenhuma parcela de venda lançada ainda."
        />
      </Card>
      <Card title="Contas a pagar — parcelas de compras">
        <Table
          columns={[
            { key: "origem", label: "Compra" },
            { key: "numero", label: "Parcela", render: (r) => `${r.numero}/${r.de}` },
            { key: "vencimento", label: "Vencimento" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "status", label: "Status", render: (r) => <StatusSelect status={r.status} onChange={(v) => atualizarParcelaCompra(r.ref, r.id, v)} /> },
          ]}
          rows={parcelasPagarCompras}
          emptyText="Nenhuma parcela de compra lançada ainda."
        />
      </Card>
      <Card title="Contas a pagar — fretes">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "destino", label: "Destino" },
            { key: "valorFrete", label: "Valor", render: (r) => brl(r.valorFrete) },
            { key: "statusPagamento", label: "Status", render: (r) => <StatusSelect status={r.statusPagamento} onChange={(v) => atualizarStatusFrete(r.id, v)} /> },
          ]}
          rows={fretes}
          emptyText="Nenhum frete lançado ainda."
        />
      </Card>
    </div>
  );
}

/* ---------------- Contabilidade: DRE + Balanço ---------------- */

function Contabilidade({ db, filialId }) {
  const isMobile = useIsMobile();
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const compras = db.compras.filter((c) => c.filialId === filialId);
  const fretes = db.fretes.filter((f) => f.filialId === filialId);
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const avulsas = db.contasAvulsas.filter((a) => a.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);
  const aberto = (s) => s !== "pago" && s !== "cancelado";

  const receitaBruta = vendas.reduce((s, v) => s + Number(v.total || 0), 0);
  const comissoes = vendas.reduce((s, v) => s + Number(v.comissaoValor || 0) + Number(v.comissaoGerenteValor || 0), 0);
  const custoInsumos = compras.filter((c) => c.categoria === "insumo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const custoPintinhos = compras.filter((c) => c.categoria === "pintinhos").reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasAdm = compras.filter((c) => c.categoria === "administrativo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const manutencao = compras.filter((c) => c.categoria === "manutencao").reduce((s, c) => s + Number(c.valor || 0), 0);
  const outrasCompras = compras.filter((c) => !["insumo", "administrativo", "manutencao", "pintinhos"].includes(c.categoria)).reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasFrete = fretes.reduce((s, f) => s + Number(f.valorFrete || 0), 0);
  const receitasAvulsas = avulsas.filter((a) => a.tipo === "receber").reduce((s, a) => s + Number(a.valor || 0), 0);
  const despesasAvulsas = avulsas.filter((a) => a.tipo === "pagar").reduce((s, a) => s + Number(a.valor || 0), 0);

  const totalReceitas = receitaBruta + receitasAvulsas;
  const totalDespesas = comissoes + custoInsumos + despesasAdm + manutencao + outrasCompras + despesasFrete + despesasAvulsas;
  const resultadoLiquido = totalReceitas - totalDespesas;

  const caixa = totalReceitas - totalDespesas; // simplificado: regime de caixa acumulado
  const contasReceber = vendas.flatMap((v) => v.parcelas || []).filter((p) => aberto(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + avulsas.filter((a) => a.tipo === "receber" && aberto(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);
  const estoqueValor = produtos.reduce((s, p) => s + Number(p.custoUnit || 0) * 0, 0); // sem contagem física neste protótipo
  const ativoTotal = caixa + contasReceber + estoqueValor;
  const contasPagar = compras.flatMap((c) => c.parcelas || []).filter((p) => aberto(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + fretes.filter((f) => aberto(f.statusPagamento)).reduce((s, f) => s + Number(f.valorFrete || 0), 0)
    + avulsas.filter((a) => a.tipo === "pagar" && aberto(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);
  const patrimonioLiquido = ativoTotal - contasPagar;

  const resultadoPorCentro = centrosCusto.map((cc) => {
    const rec = vendas.filter((v) => v.centroCustoId === cc.id).reduce((s, v) => s + Number(v.total || 0), 0);
    const desp = compras.filter((c) => c.centroCustoId === cc.id).reduce((s, c) => s + Number(c.valor || 0), 0)
      + avulsas.filter((a) => a.centroCustoId === cc.id).reduce((s, a) => s + (a.tipo === "pagar" ? Number(a.valor || 0) : -Number(a.valor || 0)), 0);
    return { ...cc, receita: rec, despesa: desp, resultado: rec - desp };
  });

  const linha = (label, valor, bold, indent) => (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${BORDER}`, fontWeight: bold ? 800 : 500, paddingLeft: indent ? 16 : 0, color: bold ? GREEN : INK, fontSize: bold ? 14 : 13 }}>
      <span>{label}</span><span>{brl(valor)}</span>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#FBF3DC", border: `1px solid ${GOLD_LIGHT}`, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, color: "#6B5410" }}>
        Demonstrações calculadas automaticamente a partir dos lançamentos de Vendas, Compras, Logística e Contas Avulsas desta filial — regime de caixa simplificado, para fins gerenciais. Não substitui a escrituração contábil oficial.
      </div>
      <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "1fr 1fr"), gap: 16 }}>
        <Card title="DRE — Demonstrativo de Resultado">

/* Cadastro de motoristas com foto e upload da CNH (imagem ou PDF). */
function CadastroMotoristas({ items, onChange, filialId }) {
  const isMobile = useIsMobile();
  const blank = { id: null, nomeCompleto: "", apelido: "", telefone: "", cnh: "", foto: null, anexos: [] };
  const [draft, setDraft] = useState(blank);
  const editing = !!draft.id;

  function submit(e) {
    e.preventDefault();
    if (!draft.nomeCompleto) return;
    if (editing) onChange(items.map((it) => (it.id === draft.id ? draft : it)));
    else onChange([...items, { ...draft, id: uid(), filialId }]);
    setDraft(blank);
  }
  function edit(row) { setDraft({ ...blank, ...row }); }
  function remove(row) { onChange(items.filter((it) => it.id !== row.id)); if (draft.id === row.id) setDraft(blank); }

  function lerArquivo(e, campo, multiplo) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) { alert("Arquivo muito grande para este protótipo (limite 1,5 MB)."); e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => {
      if (multiplo) setDraft((d) => ({ ...d, [campo]: [...(d[campo] || []), { id: uid(), nome: file.name, tipo: file.type, dataUrl: reader.result }] }));
      else setDraft((d) => ({ ...d, [campo]: { nome: file.name, tipo: file.type, dataUrl: reader.result } }));
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }
  function removerAnexo(id) { setDraft((d) => ({ ...d, anexos: (d.anexos || []).filter((a) => a.id !== id) })); }

  return (
    <Card title="Motoristas" subtitle="Cadastro completo, com foto e a CNH digitalizada.">
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr 1fr 1fr"), gap: 10 }}>
          <Field label="Nome completo"><TextInput value={draft.nomeCompleto} onChange={(e) => setDraft({ ...draft, nomeCompleto: e.target.value })} /></Field>
          <Field label="Apelido"><TextInput value={draft.apelido} onChange={(e) => setDraft({ ...draft, apelido: e.target.value })} /></Field>
          <Field label="Telefone"><TextInput value={draft.telefone} onChange={(e) => setDraft({ ...draft, telefone: e.target.value })} /></Field>
          <Field label="CNH (número)"><TextInput value={draft.cnh} onChange={(e) => setDraft({ ...draft, cnh: e.target.value })} /></Field>
        </div>
        <div style={{ display: "flex", gap: 28, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: MUTED, marginBottom: 6 }}>Foto do motorista</div>
            <input type="file" accept="image/*" onChange={(e) => lerArquivo(e, "foto", false)} style={{ fontSize: 12.5 }} />
            {draft.foto && <img src={draft.foto.dataUrl} alt="Foto do motorista" style={{ width: 60, height: 60, borderRadius: 8, objectFit: "cover", marginTop: 6, display: "block" }} />}
          </div>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: MUTED, marginBottom: 6 }}>Upload da CNH (imagem ou PDF)</div>
            <input type="file" accept="image/*,.pdf" onChange={(e) => lerArquivo(e, "anexos", true)} style={{ fontSize: 12.5 }} />
            {!!(draft.anexos || []).length && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 6 }}>
                {draft.anexos.map((a) => (
                  <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 6, background: BG, border: `1px solid ${BORDER}`, borderRadius: 999, padding: "4px 10px", fontSize: 11.5 }}>
                    <a href={a.dataUrl} download={a.nome} style={{ color: GREEN, textDecoration: "none", fontWeight: 700 }}>{a.nome}</a>
                    <button type="button" onClick={() => removerAnexo(a.id)} style={{ border: "none", background: "none", color: DANGER, cursor: "pointer", fontWeight: 700 }}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <Button type="submit">{editing ? "Salvar alteração" : "Adicionar"}</Button>
          {editing && <Button type="button" variant="ghost" onClick={() => setDraft(blank)}>Cancelar</Button>}
        </div>
      </form>
      <div style={{ height: 1, background: BORDER, margin: "16px 0" }} />
      <Table
        columns={[
          { key: "foto", label: "", render: (r) => (r.foto ? <img src={r.foto.dataUrl} alt="" style={{ width: 32, height: 32, borderRadius: 6, objectFit: "cover" }} /> : "—") },
          { key: "nomeCompleto", label: "Nome" },
          { key: "apelido", label: "Apelido" },
          { key: "telefone", label: "Telefone" },
          { key: "cnh", label: "CNH" },
          { key: "anexos", label: "Docs", render: (r) => (r.anexos?.length ? `${r.anexos.length} arquivo(s)` : "—") },
        ]}
        rows={items}
        onEdit={edit}
        onDelete={remove}
      />
    </Card>
  );
}

/* Controle de frota própria — abertura e fechamento de viagens de entrega. */
function FinalizarViagemBtn({ viagem, onFinalizar }) {
  const [km, setKm] = useState("");
  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
      <TextInput type="number" placeholder="Km final" value={km} onChange={(e) => setKm(e.target.value)} style={{ width: 90, padding: "4px 8px" }} />
      <button onClick={() => km && onFinalizar(viagem, km)} style={linkBtnStyle(GREEN)}>finalizar</button>
    </div>
  );
}

function ViagensEntrega({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const motoristas = db.motoristas.filter((m) => m.filialId === filialId);
  const veiculos = db.veiculos.filter((v) => v.filialId === filialId);
  const fretes = db.fretes.filter((f) => f.filialId === filialId);
  const viagens = db.viagensEntrega.filter((v) => v.filialId === filialId);

  const [form, setForm] = useState({ data: todayISO(), motoristaId: "", veiculoId: "", kmInicial: "", nivelCombustivel: "cheio", rota: "", freteId: "" });
  const [fotos, setFotos] = useState([]);

  function addFoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) { alert("Foto muito grande (limite 1,5 MB)."); e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => setFotos((f) => [...f, { id: uid(), nome: file.name, dataUrl: reader.result }]);
    reader.readAsDataURL(file);
    e.target.value = "";
  }
  function removerFoto(id) { setFotos((f) => f.filter((x) => x.id !== id)); }

  function iniciarViagem(e) {
    e.preventDefault();
    update((prev) => ({ ...prev, viagensEntrega: [...prev.viagensEntrega, { id: uid(), filialId, ...form, kmInicial: Number(form.kmInicial || 0), kmFinal: "", fotosAntes: fotos, status: "em_andamento" }] }));
    setForm({ data: todayISO(), motoristaId: "", veiculoId: "", kmInicial: "", nivelCombustivel: "cheio", rota: "", freteId: "" });
    setFotos([]);
  }

  function finalizarViagem(v, kmFinal) {
    update((prev) => ({ ...prev, viagensEntrega: prev.viagensEntrega.map((x) => (x.id === v.id ? { ...x, kmFinal: Number(kmFinal), status: "concluida" } : x)) }));
  }

  const nomeMot = (id) => { const m = motoristas.find((x) => x.id === id); return m ? (m.apelido || m.nomeCompleto) : "—"; };
  const nomeVei = (id) => veiculos.find((v) => v.id === id)?.placa || "—";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card title="Controle de frota — iniciar viagem de entrega" subtitle="Registre a saída do veículo próprio: motorista, km inicial, combustível, fotos do carro e rota.">
        <form onSubmit={iniciarViagem} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "repeat(3, 1fr)"), gap: 10, alignItems: "end" }}>
          <Field label="Data da saída"><TextInput type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Motorista"><Select options={motoristas.map((m) => ({ value: m.id, label: m.apelido || m.nomeCompleto }))} value={form.motoristaId} onChange={(e) => setForm({ ...form, motoristaId: e.target.value })} /></Field>
          <Field label="Veículo"><Select options={veiculos.map((v) => ({ value: v.id, label: v.placa }))} value={form.veiculoId} onChange={(e) => setForm({ ...form, veiculoId: e.target.value })} /></Field>
          <Field label="Km inicial"><TextInput type="number" value={form.kmInicial} onChange={(e) => setForm({ ...form, kmInicial: e.target.value })} /></Field>
          <Field label="Nível de combustível">
            <Select options={[{ value: "cheio", label: "Cheio" }, { value: "3/4", label: "3/4" }, { value: "1/2", label: "1/2" }, { value: "1/4", label: "1/4" }, { value: "reserva", label: "Reserva" }]} value={form.nivelCombustivel} onChange={(e) => setForm({ ...form, nivelCombustivel: e.target.value })} />
          </Field>
          <Field label="Frete relacionado (opcional)"><Select options={fretes.map((f) => ({ value: f.id, label: `${f.destino || "Sem destino"} — ${brl(f.valorFrete)}` }))} value={form.freteId} onChange={(e) => setForm({ ...form, freteId: e.target.value })} /></Field>
          <Field label="Rota de entrega"><TextInput value={form.rota} onChange={(e) => setForm({ ...form, rota: e.target.value })} /></Field>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: MUTED, marginBottom: 6 }}>Fotos do carro antes de sair</div>
            <input type="file" accept="image/*" onChange={addFoto} style={{ fontSize: 12.5 }} />
          </div>
          {!!fotos.length && (
            <div style={{ gridColumn: "1 / -1", display: "flex", flexWrap: "wrap", gap: 8 }}>
              {fotos.map((f) => (
                <div key={f.id} style={{ position: "relative" }}>
                  <img src={f.dataUrl} alt="" style={{ width: 70, height: 70, objectFit: "cover", borderRadius: 8, border: `1px solid ${BORDER}` }} />
                  <button type="button" onClick={() => removerFoto(f.id)} style={{ position: "absolute", top: -6, right: -6, background: DANGER, color: "#fff", border: "none", borderRadius: "50%", width: 20, height: 20, cursor: "pointer", fontSize: 11 }}>×</button>
                </div>
              ))}
            </div>
          )}
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Registrar saída</Button></div>
        </form>
      </Card>
      <Card title={`Viagens (${viagens.length})`}>
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "motoristaId", label: "Motorista", render: (r) => nomeMot(r.motoristaId) },
            { key: "veiculoId", label: "Veículo", render: (r) => nomeVei(r.veiculoId) },
            { key: "rota", label: "Rota" },
            { key: "kmInicial", label: "Km inicial", render: (r) => Number(r.kmInicial || 0).toLocaleString("pt-BR") },
            { key: "kmFinal", label: "Km final", render: (r) => (r.kmFinal ? Number(r.kmFinal).toLocaleString("pt-BR") : "—") },
            { key: "nivelCombustivel", label: "Combustível" },
            { key: "fotosAntes", label: "Fotos", render: (r) => (r.fotosAntes?.length ? `${r.fotosAntes.length} foto(s)` : "—") },
            { key: "status", label: "Status", render: (r) => (r.status === "concluida" ? <span style={{ color: SUCCESS, fontWeight: 700, fontSize: 12 }}>Concluída</span> : <FinalizarViagemBtn viagem={r} onFinalizar={finalizarViagem} />) },
          ]}
          rows={[...viagens].sort((a, b) => (a.data < b.data ? 1 : -1))}
          emptyText="Nenhuma viagem registrada ainda."
        />
      </Card>
    </div>
  );
}

function Logistica({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const motoristas = db.motoristas.filter((m) => m.filialId === filialId);
  const veiculos = db.veiculos.filter((v) => v.filialId === filialId);
  const fretes = db.fretes.filter((f) => f.filialId === filialId);
  const [form, setForm] = useState({ data: todayISO(), motoristaId: "", veiculoId: "", destino: "", valorFrete: "" });

  function lancar(e) {
    e.preventDefault();
    update((prev) => ({ ...prev, fretes: [...prev.fretes, { id: uid(), filialId, ...form, valorFrete: Number(form.valorFrete), statusPagamento: "pendente" }] }));
    setForm({ data: todayISO(), motoristaId: "", veiculoId: "", destino: "", valorFrete: "" });
  }

  function atualizarStatus(f, status) {
    update((prev) => ({ ...prev, fretes: prev.fretes.map((x) => (x.id === f.id ? { ...x, statusPagamento: status } : x)) }));
  }

  const nomeMotorista = (id) => { const m = motoristas.find((x) => x.id === id); return m ? (m.apelido || m.nomeCompleto) : "—"; };
  const nomeVeiculo = (id) => veiculos.find((v) => v.id === id)?.placa || "—";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "1fr 1fr"), gap: 16 }}>
        <CadastroMotoristas items={motoristas} filialId={filialId} onChange={(items) => update((prev) => ({ ...prev, motoristas: mergeByFilial(prev.motoristas, items, filialId) }))} />
        <CrudBlock title="Veículos" filialId={filialId} items={veiculos} onChange={(items) => update((prev) => ({ ...prev, veiculos: mergeByFilial(prev.veiculos, items, filialId) }))}
          fields={[{ key: "placa", label: "Placa", required: true }, { key: "modelo", label: "Modelo" }]} />
      </div>
      <Card title="Lançar frete" subtitle="Gera uma conta a pagar e entra como despesa de logística na DRE.">
        <form onSubmit={lancar} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "1fr 1fr 1fr 1fr 1fr"), gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Motorista"><Select options={motoristas.map((m) => ({ value: m.id, label: m.apelido || m.nomeCompleto }))} value={form.motoristaId} onChange={(e) => setForm({ ...form, motoristaId: e.target.value })} /></Field>
          <Field label="Veículo"><Select options={veiculos.map((v) => ({ value: v.id, label: v.placa }))} value={form.veiculoId} onChange={(e) => setForm({ ...form, veiculoId: e.target.value })} /></Field>
          <Field label="Destino"><TextInput value={form.destino} onChange={(e) => setForm({ ...form, destino: e.target.value })} /></Field>
          <Field label="Valor (R$)"><TextInput type="number" step="0.01" value={form.valorFrete} onChange={(e) => setForm({ ...form, valorFrete: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar frete</Button></div>
        </form>
      </Card>
      <Card title={`Fretes lançados (${fretes.length})`}>
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "motoristaId", label: "Motorista", render: (r) => nomeMotorista(r.motoristaId) },
            { key: "veiculoId", label: "Veículo", render: (r) => nomeVeiculo(r.veiculoId) },
            { key: "destino", label: "Destino" },
            { key: "valorFrete", label: "Valor", render: (r) => brl(r.valorFrete) },
            { key: "statusPagamento", label: "Pagamento", render: (r) => <StatusSelect status={r.statusPagamento} onChange={(v) => atualizarStatus(r, v)} /> },
          ]}
          rows={[...fretes].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>

      <div style={{ height: 1, background: BORDER, margin: "6px 0" }} />
      <div style={{ fontSize: 15, fontWeight: 800, color: GREEN }}>Controle de Frota Própria</div>
      <ViagensEntrega db={db} update={update} filialId={filialId} />
    </div>
  );
}

/* ---------------- Fiscal (NFe / SPED) — módulo ilustrativo ---------------- */

function Fiscal({ db, update, filialId }) {
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const emitidas = vendas.filter((v) => v.nfe && v.nfe.status === "autorizada");
  const canceladas = vendas.filter((v) => v.nfe && v.nfe.status === "cancelada");
  const naoEmitidas = vendas.filter((v) => !v.nfe);
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const clientes = db.clientes.filter((c) => c.filialId === filialId);
  const empresa = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
  const filial = empresa?.filiais.find((f) => f.id === filialId);
  const [danfeVenda, setDanfeVenda] = useState(null);
  const [spedPreview, setSpedPreview] = useState(null); // { tipo, conteudo }

  function emitirNFe(venda) {
    update((prev) => ({ ...prev, vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { status: "autorizada", chave: gerarChaveAcessoFake(), protocolo: gerarProtocoloFake(), dataEmissao: todayISO(), ambiente: "homologacao" } })) }));
  }
  function cancelarNFe(venda) {
    const justificativa = window.prompt("Justificativa do cancelamento (mínimo 15 caracteres):");
    if (!justificativa || justificativa.trim().length < 15) { alert("Cancelamento não realizado: informe uma justificativa com pelo menos 15 caracteres."); return; }
    update((prev) => ({ ...prev, vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { ...v.nfe, status: "cancelada", dataCancelamento: todayISO(), justificativaCancelamento: justificativa } })) }));
  }
  function consultarNFe(venda) {
    alert(`Consulta simulada — ambiente de HOMOLOGAÇÃO, sem conexão real com a SEFAZ.\n\nStatus: ${venda.nfe.status}\nChave de acesso: ${venda.nfe.chave}\nProtocolo: ${venda.nfe.protocolo}`);
  }

  function verSpedFiscal() {
    setSpedPreview({ tipo: "SPED Fiscal (EFD ICMS/IPI)", conteudo: gerarSpedFiscal(db, filialId, empresa), nomeArquivo: `SPED_FISCAL_HOMOLOGACAO_${filialId.slice(0, 6)}.txt` });
  }
  function verSpedContabil() {
    setSpedPreview({ tipo: "SPED Contábil (ECD)", conteudo: gerarSpedContabil(db, filialId, empresa), nomeArquivo: `SPED_CONTABIL_HOMOLOGACAO_${filialId.slice(0, 6)}.txt` });
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: GOLD, color: GREEN_DARK, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, fontWeight: 800, textAlign: "center" }}>
        AMBIENTE DE HOMOLOGAÇÃO — nenhuma nota fiscal ou arquivo SPED aqui é transmitido à Receita/SEFAZ de verdade
      </div>
      <div style={{ background: "#FBEAE4", border: `1px solid ${DANGER}55`, borderRadius: 10, padding: "12px 14px", fontSize: 12.5, color: "#7A2E1B" }}>
        <b>Importante:</b> a emissão real de NF-e e a entrega válida de SPED exigem certificado digital (A1/A3), credenciamento junto à SEFAZ/Receita e, no caso do SPED, assinatura digital do arquivo. O que este módulo gera são arquivos com a <b>estrutura de blocos e layout reais</b> (registros |0000|, |C100|, |I050| etc.), preenchidos com os seus lançamentos, para você validar o fluxo — não são arquivos assinados nem válidos para entrega oficial.
      </div>

      <div style={{ display: "flex", gap: 14 }}>
        <StatCard label="Autorizadas (homolog.)" value={emitidas.length} accent={SUCCESS} />
        <StatCard label="Canceladas" value={canceladas.length} accent={DANGER} />
        <StatCard label="Aguardando emissão" value={naoEmitidas.length} accent={GOLD} />
      </div>

      <Card title="Notas fiscais por venda" subtitle="Emita, cancele, consulte o status simulado, ou visualize o DANFE de cada venda.">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "total", label: "Valor", render: (r) => brl(r.total) },
            { key: "chave", label: "Chave de acesso", render: (r) => r.nfe ? <span style={{ fontFamily: "monospace", fontSize: 10.5 }}>{r.nfe.chave}</span> : "—" },

        />

      <Card title="SPED Fiscal / Contábil" subtitle="Gera o arquivo com o layout real de blocos, preenchido com os lançamentos desta filial — ambiente de homologação.">

function tempoDeEmpresa(dataContratacaoISO) {
  if (!dataContratacaoISO) return "—";
  const inicio = new Date(dataContratacaoISO + "T00:00:00");
  const hoje = new Date();
  if (inicio > hoje) return "contratação futura";
  let anos = hoje.getFullYear() - inicio.getFullYear();
  let meses = hoje.getMonth() - inicio.getMonth();
  if (hoje.getDate() < inicio.getDate()) meses--;
  if (meses < 0) { anos--; meses += 12; }
  const partes = [];
  if (anos > 0) partes.push(`${anos} ano${anos > 1 ? "s" : ""}`);
  if (meses > 0 || !anos) partes.push(`${meses} ${meses === 1 ? "mês" : "meses"}`);
  return partes.join(" e ") || "menos de 1 mês";
}
