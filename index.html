function FolhaPagamento({ db, update, filialId }) {
  const funcionarios = db.funcionarios.filter((f) => f.filialId === filialId);
  const ativos = funcionarios.filter((f) => f.ativo !== false && f.ativo !== "false");

  const folhaBruta = ativos.reduce((s, f) => s + Number(f.salarioBruto || 0), 0);
  const encargosTotal = ativos.reduce((s, f) => s + (Number(f.salarioBruto || 0) * Number(f.encargosPercentual || 0)) / 100, 0);
  const beneficiosTotal = ativos.reduce((s, f) => s + Number(f.beneficios || 0), 0);
  const folhaTotalMensal = folhaBruta + encargosTotal + beneficiosTotal;

  function onChange(items) { update((prev) => ({ ...prev, funcionarios: mergeByFilial(prev.funcionarios, items, filialId) })); }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Salários brutos" value={brl(folhaBruta)} accent={GREEN} />
        <StatCard label="Encargos" value={brl(encargosTotal)} accent={GOLD} />
        <StatCard label="Benefícios" value={brl(beneficiosTotal)} accent={MUTED} />
        <StatCard label="Folha total / mês" value={brl(folhaTotalMensal)} accent={DANGER} />
      </div>
      <CadastroFuncionario items={funcionarios} onChange={onChange} filialId={filialId} />
    </div>
  );
}

/* ---------------- Relatório Gerencial ---------------- */

function RelatorioGerencial({ db, update, filialId }) {
  const vendasAll = db.vendas.filter((v) => v.filialId === filialId);
  const comprasAll = db.compras.filter((c) => c.filialId === filialId);
  const fretesAll = db.fretes.filter((f) => f.filialId === filialId);
  const avulsasAll = db.contasAvulsas.filter((a) => a.filialId === filialId);
  const funcionarios = db.funcionarios.filter((f) => f.filialId === filialId && f.ativo !== false && f.ativo !== "false");
  const vendedores = db.vendedores.filter((v) => v.filialId === filialId);

  const configSalva = db.configsGerenciais.find((c) => c.filialId === filialId) || { investimentoTotal: 0, aliquotaImposto: 34 };
  const [config, setConfig] = useState({ investimentoTotal: configSalva.investimentoTotal || "", aliquotaImposto: configSalva.aliquotaImposto ?? 34 });
  const [periodo, setPeriodo] = useState({ de: primeiroDiaDoMes(), ate: todayISO() });

  function salvarConfig() {
    update((prev) => ({ ...prev, configsGerenciais: [...prev.configsGerenciais.filter((c) => c.filialId !== filialId), { filialId, investimentoTotal: Number(config.investimentoTotal) || 0, aliquotaImposto: Number(config.aliquotaImposto) || 0 }] }));
  }

  const dentroPeriodo = (dataISO) => !!dataISO && dataISO >= periodo.de && dataISO <= periodo.ate;
  const nMeses = mesesNoPeriodo(periodo.de, periodo.ate);

  const vendas = vendasAll.filter((v) => dentroPeriodo(v.data));
  const compras = comprasAll.filter((c) => dentroPeriodo(c.data));
  const fretes = fretesAll.filter((f) => dentroPeriodo(f.data));
  const avulsasPeriodo = avulsasAll.filter((a) => dentroPeriodo(a.vencimento));

  const receitaVendas = vendas.reduce((s, v) => s + Number(v.total || 0), 0);
  const receitasAvulsas = avulsasPeriodo.filter((a) => a.tipo === "receber").reduce((s, a) => s + Number(a.valor || 0), 0);
  const receitaTotal = receitaVendas + receitasAvulsas;

  const comissoes = vendas.reduce((s, v) => s + Number(v.comissaoValor || 0) + Number(v.comissaoGerenteValor || 0), 0);
  const custoInsumos = compras.filter((c) => c.categoria === "insumo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const custoPintinhos = compras.filter((c) => c.categoria === "pintinhos").reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasAdm = compras.filter((c) => c.categoria === "administrativo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const manutencao = compras.filter((c) => c.categoria === "manutencao").reduce((s, c) => s + Number(c.valor || 0), 0);
  const outrasCompras = compras.filter((c) => !["insumo", "administrativo", "manutencao", "pintinhos"].includes(c.categoria)).reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasFrete = fretes.reduce((s, f) => s + Number(f.valorFrete || 0), 0);
  const despesasAvulsas = avulsasPeriodo.filter((a) => a.tipo === "pagar").reduce((s, a) => s + Number(a.valor || 0), 0);

  const folhaMensal = funcionarios.reduce((s, f) => s + Number(f.salarioBruto || 0) + (Number(f.salarioBruto || 0) * Number(f.encargosPercentual || 0)) / 100 + Number(f.beneficios || 0), 0);
  const folhaPeriodo = folhaMensal * nMeses;

  const custosOperacionais = custoInsumos + despesasAdm + manutencao + outrasCompras + despesasFrete + comissoes + despesasAvulsas + folhaPeriodo;
  const ebitda = receitaTotal - custosOperacionais;
  const margemEbitda = receitaTotal > 0 ? (ebitda / receitaTotal) * 100 : 0;
  const impostoEstimado = ebitda > 0 ? ebitda * (Number(config.aliquotaImposto || 0) / 100) : 0;
  const lucroLiquido = ebitda - impostoEstimado;

  const investimento = Number(config.investimentoTotal) || 0;
  const roi = investimento > 0 ? (lucroLiquido / investimento) * 100 : null;
  const lucroMedioMensal = lucroLiquido / nMeses;
  const paybackMeses = investimento > 0 && lucroMedioMensal > 0 ? investimento / lucroMedioMensal : null;

  // Fluxo de caixa projetado (por vencimento das parcelas, todo o histórico dentro do período de meses)
  const meses = listaDeMeses(periodo.de, periodo.ate);
  let acumulado = 0;
  const fluxo = meses.map((mes) => {
    const entradasVendas = vendasAll.flatMap((v) => v.parcelas || []).filter((p) => p.vencimento && p.vencimento.startsWith(mes)).reduce((s, p) => s + Number(p.valor || 0), 0);
    const entradasAvulsas = avulsasAll.filter((a) => a.tipo === "receber" && a.vencimento && a.vencimento.startsWith(mes)).reduce((s, a) => s + Number(a.valor || 0), 0);
    const saidasCompras = comprasAll.flatMap((c) => c.parcelas || []).filter((p) => p.vencimento && p.vencimento.startsWith(mes)).reduce((s, p) => s + Number(p.valor || 0), 0);
    const saidasFretes = fretesAll.filter((f) => f.data && f.data.startsWith(mes)).reduce((s, f) => s + Number(f.valorFrete || 0), 0);
    const saidasAvulsas = avulsasAll.filter((a) => a.tipo === "pagar" && a.vencimento && a.vencimento.startsWith(mes)).reduce((s, a) => s + Number(a.valor || 0), 0);
    const entradas = entradasVendas + entradasAvulsas;
    const saidas = saidasCompras + saidasFretes + saidasAvulsas + folhaMensal;
    const saldo = entradas - saidas;
    acumulado += saldo;
    return { mes, entradas, saidas, saldo, acumulado };
  });

  const comissoesPorVendedor = vendedores.map((vend) => {
    const proprias = vendasAll.filter((v) => v.vendedorId === vend.id && dentroPeriodo(v.data));
    const comoGerente = vendasAll.filter((v) => v.gerenteComercialId === vend.id && dentroPeriodo(v.data));
    const comissaoPropria = proprias.reduce((s, v) => s + Number(v.comissaoValor || 0), 0);
    const comissaoGerente = comoGerente.reduce((s, v) => s + Number(v.comissaoGerenteValor || 0), 0);
    return { ...vend, totalVendido: proprias.reduce((s, v) => s + Number(v.total || 0), 0), comissaoPropria, comissaoGerente, comissaoTotal: comissaoPropria + comissaoGerente };
  }).filter((v) => v.totalVendido > 0 || v.comissaoTotal > 0);

  const linha = (label, valor, bold, indent) => (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${BORDER}`, fontWeight: bold ? 800 : 500, paddingLeft: indent ? 16 : 0, color: bold ? GREEN : INK, fontSize: bold ? 14 : 13 }}>
      <span>{label}</span><span>{brl(valor)}</span>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#FBF3DC", border: `1px solid ${GOLD_LIGHT}`, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, color: "#6B5410" }}>
        Relatório calculado a partir dos lançamentos reais desta filial no período selecionado. Impostos, ROI e payback são estimativas gerenciais simplificadas (sem compensação de prejuízo fiscal, sem a trava legal de 30%, sem depreciação de ativos) — para uma apuração tributária real, consulte seu contador.
      </div>

      <Card title="Período do relatório">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="De"><TextInput type="date" value={periodo.de} onChange={(e) => setPeriodo({ ...periodo, de: e.target.value })} /></Field>
          <Field label="Até"><TextInput type="date" value={periodo.ate} onChange={(e) => setPeriodo({ ...periodo, ate: e.target.value })} /></Field>
          <div style={{ fontSize: 12, color: MUTED, paddingBottom: 8 }}>{nMeses} mês(es) considerado(s) — a folha de pagamento é multiplicada por esse número de meses.</div>
        </div>
      </Card>

      <Card title="Parâmetros para ROI, payback e impostos">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="Investimento total (R$)"><TextInput type="number" step="0.01" value={config.investimentoTotal} onChange={(e) => setConfig({ ...config, investimentoTotal: e.target.value })} /></Field>
          <Field label="Alíquota de imposto sobre o lucro (%)"><TextInput type="number" step="0.1" value={config.aliquotaImposto} onChange={(e) => setConfig({ ...config, aliquotaImposto: e.target.value })} /></Field>
          <Button onClick={salvarConfig}>Salvar parâmetros</Button>
        </div>
      </Card>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Receita no período" value={brl(receitaTotal)} accent={GREEN} />
        <StatCard label="EBITDA" value={brl(ebitda)} accent={GOLD} />
        <StatCard label="Margem EBITDA" value={`${margemEbitda.toFixed(1)}%`} accent={MUTED} />
        <StatCard label="Impostos estimados" value={brl(impostoEstimado)} accent={DANGER} />
        <StatCard label="Lucro líquido estimado" value={brl(lucroLiquido)} accent={GREEN} />
        <StatCard label="Folha de pagamento (período)" value={brl(folhaPeriodo)} accent={MUTED} />
        <StatCard label="ROI no período" value={roi === null ? "—" : `${roi.toFixed(1)}%`} accent={GOLD} />
        <StatCard label="Payback estimado" value={paybackMeses === null ? "—" : `${paybackMeses.toFixed(1)} meses`} accent={DANGER} />
      </div>

      <Card title="EBITDA — Demonstrativo gerencial">
        {linha("Receita de vendas", receitaVendas)}
        {linha("(+) Receitas avulsas", receitasAvulsas, false, true)}
        {linha("(-) Comissões (vendedor + gerente)", -comissoes, false, true)}
        {linha("(-) Insumos e ração", -custoInsumos, false, true)}
        {linha("(-) Despesas administrativas", -despesasAdm, false, true)}
        {linha("(-) Manutenção", -manutencao, false, true)}
        {linha("(-) Fretes e logística", -despesasFrete, false, true)}
        {linha("(-) Outras despesas de compra", -outrasCompras, false, true)}
        {linha("(-) Despesas avulsas", -despesasAvulsas, false, true)}
        {linha("(-) Folha de pagamento", -folhaPeriodo, false, true)}
        <div style={{ marginTop: 6 }}>{linha("EBITDA", ebitda, true)}</div>
        {linha(`(-) Impostos estimados (${config.aliquotaImposto || 0}% sobre o lucro)`, -impostoEstimado, false, true)}
        <div style={{ marginTop: 6 }}>{linha("Lucro líquido estimado", lucroLiquido, true)}</div>
      </Card>

      <Card title="Fluxo de caixa projetado" subtitle="Entradas e saídas por mês de vencimento das parcelas — folha de pagamento tratada como custo fixo mensal.">
        <Table
          columns={[
            { key: "mes", label: "Mês", render: (r) => nomeMes(r.mes) },
            { key: "entradas", label: "Entradas", render: (r) => brl(r.entradas) },
            { key: "saidas", label: "Saídas", render: (r) => brl(r.saidas) },
            { key: "saldo", label: "Saldo do mês", render: (r) => brl(r.saldo) },
            { key: "acumulado", label: "Saldo acumulado", render: (r) => brl(r.acumulado) },
          ]}
          rows={fluxo}
        />
      </Card>

      <Card title="Relatório de comissões" subtitle="Comissão própria (como vendedor) e comissão como gerente comercial, dentro do período selecionado.">
        <Table
          columns={[
            { key: "nome", label: "Vendedor", render: (r) => r.apelido || r.nomeCompleto },
            { key: "totalVendido", label: "Total vendido", render: (r) => brl(r.totalVendido) },
            { key: "comissaoPropria", label: "Comissão própria", render: (r) => brl(r.comissaoPropria) },
            { key: "comissaoGerente", label: "Comissão como gerente", render: (r) => brl(r.comissaoGerente) },
            { key: "comissaoTotal", label: "Total a pagar", render: (r) => brl(r.comissaoTotal) },
          ]}
          rows={comissoesPorVendedor}
          emptyText="Nenhuma venda com comissão neste período."
        />
      </Card>
    </div>
  );
}

/* ---------------- Produção Avícola ---------------- */

function ProducaoAvicola({ db, update, filialId }) {
  const galpoes = db.galpoes.filter((g) => g.filialId === filialId);
  const lotes = db.lotesAves.filter((l) => l.filialId === filialId);
  const posturas = db.registrosPostura.filter((p) => p.filialId === filialId);
  const mortalidades = db.registrosMortalidade.filter((m) => m.filialId === filialId);
  const estercos = db.registrosEsterco.filter((e) => e.filialId === filialId);
  const descartes = db.registrosDescarte.filter((d) => d.filialId === filialId);
  const producoesRacao = db.producoesRacao.filter((p) => p.filialId === filialId);
  const equipeManejo = db.equipeManejo.filter((m) => m.filialId === filialId);
  const [tempoCriaRecria, setTempoCriaRecria] = useState(120);

  const mortesDoLote = (loteId) => mortalidades.filter((m) => m.loteId === loteId).reduce((s, m) => s + Number(m.avesMortas || 0), 0);
  const descartesDoLote = (loteId) => descartes.filter((d) => d.loteId === loteId).reduce((s, d) => s + Number(d.quantidade || 0), 0);
  const quantidadeAtual = (lote) => Math.max(0, Number(lote.quantidadeAlojada || 0) - mortesDoLote(lote.id) - descartesDoLote(lote.id));

  const totalAvesVivas = lotes.reduce((s, l) => s + quantidadeAtual(l), 0);
  const custoRacaoTotal = producoesRacao.reduce((s, p) => s + Number(p.custoTotal || 0), 0);
  const custoPorAve = totalAvesVivas > 0 ? custoRacaoTotal / totalAvesVivas : 0;

  const hoje = todayISO();
  const ha30dias = new Date(new Date(hoje + "T00:00:00").getTime() - 30 * 86400000).toISOString().slice(0, 10);
  const ovosHoje = posturas.filter((p) => p.data === hoje).reduce((s, p) => s + Number(p.ovosProduzidos || 0), 0);
  const ovos30dias = posturas.filter((p) => p.data >= ha30dias).reduce((s, p) => s + Number(p.ovosProduzidos || 0), 0);
  const quebras30dias = posturas.filter((p) => p.data >= ha30dias).reduce((s, p) => s + Number(p.ovosQuebrados || 0), 0);
  const mortes30dias = mortalidades.filter((m) => m.data >= ha30dias).reduce((s, m) => s + Number(m.avesMortas || 0), 0);
  const taxaQuebra = ovos30dias > 0 ? (quebras30dias / ovos30dias) * 100 : 0;

  const estercoProduzido = estercos.filter((e) => e.tipo === "producao").reduce((s, e) => s + Number(e.quantidadeTon || 0), 0);
  const estercoVendidoTon = estercos.filter((e) => e.tipo === "venda").reduce((s, e) => s + Number(e.quantidadeTon || 0), 0);
  const estercoVendidoValor = estercos.filter((e) => e.tipo === "venda").reduce((s, e) => s + Number(e.valorVenda || 0), 0);
  const estercoArmazenado = Math.max(0, estercoProduzido - estercoVendidoTon);

  const alertasReposicao = lotes
    .filter((l) => l.fase === "postura" && l.proximaFase === "descarte" && l.dataProximaFase)
    .map((l) => {
      const diasRestantes = Math.round((new Date(l.dataProximaFase + "T00:00:00") - new Date(hoje + "T00:00:00")) / 86400000);
      const dataSugeridaCompra = new Date(new Date(l.dataProximaFase + "T00:00:00").getTime() - tempoCriaRecria * 86400000).toISOString().slice(0, 10);
      return { ...l, diasRestantes, dataSugeridaCompra, quantidadeSugerida: l.quantidadeAlojada };
    })
    .filter((l) => l.diasRestantes <= tempoCriaRecria + 30)
    .sort((a, b) => a.diasRestantes - b.diasRestantes);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Aves vivas (todos os lotes)" value={totalAvesVivas.toLocaleString("pt-BR")} accent={GREEN} />
        <StatCard label="Ovos produzidos hoje" value={ovosHoje.toLocaleString("pt-BR")} accent={GOLD} />
        <StatCard label="Ovos — últimos 30 dias" value={ovos30dias.toLocaleString("pt-BR")} accent={GOLD} />
        <StatCard label="Taxa de quebra (30 dias)" value={`${taxaQuebra.toFixed(1)}%`} accent={DANGER} />
        <StatCard label="Aves mortas (30 dias)" value={mortes30dias.toLocaleString("pt-BR")} accent={DANGER} />
        <StatCard label="Custo de ração por ave" value={brl(custoPorAve)} accent={MUTED} />
        <StatCard label="Esterco armazenado" value={`${estercoArmazenado.toFixed(1)} ton`} accent={GREEN} />
        <StatCard label="Esterco vendido (total)" value={`${estercoVendidoTon.toFixed(1)} ton · ${brl(estercoVendidoValor)}`} accent={GOLD} />
      </div>

      {!!alertasReposicao.length && (
        <Card title="Planejamento de reposição de pintos de 1 dia" subtitle="Lotes em postura próximos do descarte — programe a compra considerando o tempo de cria e recria.">
          <div style={{ display: "flex", gap: 10, alignItems: "end", marginBottom: 12 }}>
            <Field label="Tempo de cria + recria (dias)"><TextInput type="number" value={tempoCriaRecria} onChange={(e) => setTempoCriaRecria(Number(e.target.value) || 0)} /></Field>
          </div>
          <Table
            columns={[
              { key: "codigo", label: "Lote" },
              { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || "—" },
              { key: "diasRestantes", label: "Dias até o descarte", render: (r) => (r.diasRestantes < 0 ? `${Math.abs(r.diasRestantes)} dias atrasado` : `${r.diasRestantes} dias`) },
              { key: "quantidadeSugerida", label: "Qtd. sugerida de pintos", render: (r) => Number(r.quantidadeSugerida || 0).toLocaleString("pt-BR") },
              { key: "dataSugeridaCompra", label: "Comprar até", render: (r) => r.dataSugeridaCompra.split("-").reverse().join("/") },
            ]}
            rows={alertasReposicao}
          />
        </Card>
      )}

      <CrudBlock
        title="Galpões" subtitle="Estrutura física para alojamento dos lotes." filialId={filialId}
        items={galpoes} onChange={(items) => update((prev) => ({ ...prev, galpoes: mergeByFilial(prev.galpoes, items, filialId) }))}
        fields={[{ key: "nome", label: "Nome", required: true }, { key: "capacidade", label: "Capacidade (aves)", type: "number" }]}
      />

      <CrudBlock
        title="Lotes de Aves" subtitle="Manejo, descarte e abate — quantidade atual já desconta mortes e descartes registrados abaixo. Preencha 'Próxima fase' e sua data para o sistema avisar automaticamente (30, 14 e 2 dias antes)." filialId={filialId}
        items={lotes} onChange={(items) => update((prev) => ({ ...prev, lotesAves: mergeByFilial(prev.lotesAves, items, filialId) }))}
        fields={[
          { key: "codigo", label: "Código do lote", required: true },
          { key: "galpaoId", label: "Galpão", type: "select", options: galpoes.map((g) => ({ value: g.id, label: g.nome })) },
          { key: "linhagem", label: "Linhagem" },
          { key: "dataAlojamento", label: "Data de alojamento", type: "date" },
          { key: "quantidadeAlojada", label: "Quantidade alojada", type: "number" },
          { key: "fase", label: "Fase atual", type: "select", options: [{ value: "cria", label: "Cria" }, { value: "recria", label: "Recria" }, { value: "postura", label: "Postura" }, { value: "descarte", label: "Descarte/Abate" }] },
          { key: "proximaFase", label: "Próxima fase", type: "select", options: [{ value: "recria", label: "Recria" }, { value: "postura", label: "Postura" }, { value: "descarte", label: "Descarte/Abate" }] },
          { key: "dataProximaFase", label: "Data prevista da próxima fase", type: "date" },
        ]}
        columns={[
          { key: "codigo", label: "Lote" },
          { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || "—" },
          { key: "fase", label: "Fase atual" },
          { key: "quantidadeAlojada", label: "Alojada", render: (r) => Number(r.quantidadeAlojada || 0).toLocaleString("pt-BR") },
          { key: "quantidadeAtual", label: "Atual (viva)", render: (r) => quantidadeAtual(r).toLocaleString("pt-BR") },
          { key: "proximaFase", label: "Próxima fase" },
          { key: "dataProximaFase", label: "Data prevista" },
        ]}
      />

      <CrudBlock
        title="Equipe de Manejo" subtitle="Quem recebe os alertas por e-mail de troca de fase dos lotes (30, 14 e 2 dias antes)." filialId={filialId}
        items={equipeManejo} onChange={(items) => update((prev) => ({ ...prev, equipeManejo: mergeByFilial(prev.equipeManejo, items, filialId) }))}
        fields={[
          { key: "nome", label: "Nome", required: true },
          { key: "email", label: "E-mail", type: "email", required: true },
          { key: "telefone", label: "Telefone" },
          { key: "area", label: "Área/função" },
          { key: "ativo", label: "Situação", type: "select", options: [{ value: "true", label: "Ativo" }, { value: "false", label: "Inativo" }] },
        ]}
        columns={[
          { key: "nome", label: "Nome" },
          { key: "email", label: "E-mail" },
          { key: "area", label: "Área" },
          { key: "ativo", label: "Situação", render: (r) => (r.ativo === false || r.ativo === "false" ? "Inativo" : "Ativo") },
        ]}
      />

      <CrudBlock
        title="Descarte de lotes (venda de galinhas)" subtitle="Saída de aves vivas por venda/descarte — desconta do total de aves vivas do lote e gera uma venda de verdade (com direito a emitir NF-e no módulo Vendas ou Fiscal)." filialId={filialId}
        items={descartes} onChange={(items) => {
          update((prev) => {
            const antigos = prev.registrosDescarte.filter((d) => d.filialId === filialId);
            const novos = items.filter((it) => !antigos.some((a) => a.id === it.id));

            let produtosNext = prev.produtos;
            let clientesNext = prev.clientes;
            const vendasNovas = [];

            novos.filter((it) => Number(it.valorVenda) > 0 && Number(it.quantidade) > 0).forEach((it) => {
              const { produto, produtosAtualizados } = encontrarOuCriarProdutoPorNome(produtosNext, filialId, "Galinha de Descarte", "un", "5102");
              produtosNext = produtosAtualizados;
              const { clienteId, clientesAtualizados } = encontrarOuCriarClientePorNome(clientesNext, filialId, it.comprador);
              clientesNext = clientesAtualizados;
              vendasNovas.push(montarVendaAutomatica({
                filialId, data: it.data, produtoId: produto.id, qtd: it.quantidade, valorTotal: it.valorVenda, clienteId,
                origem: `Descarte — lote ${lotes.find((l) => l.id === it.loteId)?.codigo || it.loteId}`,
              }));
            });

            return {
              ...prev,
              registrosDescarte: mergeByFilial(prev.registrosDescarte, items, filialId),
              produtos: produtosNext,
              clientes: clientesNext,
              vendas: [...prev.vendas, ...vendasNovas],
            };
          });
        }}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "quantidade", label: "Quantidade de aves", type: "number" },
          { key: "valorVenda", label: "Valor da venda (R$)", type: "number" },
          { key: "comprador", label: "Comprador" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "quantidade", label: "Qtd. aves", render: (r) => Number(r.quantidade || 0).toLocaleString("pt-BR") },
          { key: "valorVenda", label: "Valor", render: (r) => brl(r.valorVenda) },
          { key: "comprador", label: "Comprador" },
        ]}
      />

      <CrudBlock
        title="Postura e quebras" subtitle="Produção diária ou por período, por lote." filialId={filialId}
        items={posturas} onChange={(items) => update((prev) => ({ ...prev, registrosPostura: mergeByFilial(prev.registrosPostura, items, filialId) }))}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "ovosProduzidos", label: "Ovos produzidos", type: "number" },
          { key: "ovosQuebrados", label: "Ovos quebrados", type: "number" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "ovosProduzidos", label: "Produzidos", render: (r) => Number(r.ovosProduzidos || 0).toLocaleString("pt-BR") },
          { key: "ovosQuebrados", label: "Quebrados", render: (r) => Number(r.ovosQuebrados || 0).toLocaleString("pt-BR") },
        ]}
      />

      <CrudBlock
        title="Mortalidade" subtitle="Aves mortas por período e por lote." filialId={filialId}
        items={mortalidades} onChange={(items) => update((prev) => ({ ...prev, registrosMortalidade: mergeByFilial(prev.registrosMortalidade, items, filialId) }))}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "avesMortas", label: "Aves mortas", type: "number" },
          { key: "motivo", label: "Motivo" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "avesMortas", label: "Aves mortas", render: (r) => Number(r.avesMortas || 0).toLocaleString("pt-BR") },
          { key: "motivo", label: "Motivo" },
        ]}
      />

      <CrudBlock
        title="Esterco — armazenado e vendido" subtitle="Vendas geram uma venda de verdade, com direito a emitir NF-e (módulo Vendas ou Fiscal). Atenção: esterco/adubo orgânico costuma ter isenção de ICMS em vários estados — confirme o enquadramento e o CFOP corretos com seu contador." filialId={filialId}
        items={estercos} onChange={(items) => {
          update((prev) => {
            const antigos = prev.registrosEsterco.filter((e) => e.filialId === filialId);
            const novos = items.filter((it) => !antigos.some((a) => a.id === it.id));

            let produtosNext = prev.produtos;
            let clientesNext = prev.clientes;
            const vendasNovas = [];

            novos.filter((it) => it.tipo === "venda" && Number(it.valorVenda) > 0 && Number(it.quantidadeTon) > 0).forEach((it) => {
              const { produto, produtosAtualizados } = encontrarOuCriarProdutoPorNome(produtosNext, filialId, "Esterco / Adubo Orgânico", "ton", "5101");
              produtosNext = produtosAtualizados;
              const { clienteId, clientesAtualizados } = encontrarOuCriarClientePorNome(clientesNext, filialId, it.comprador);
              clientesNext = clientesAtualizados;
              vendasNovas.push(montarVendaAutomatica({
                filialId, data: it.data, produtoId: produto.id, qtd: it.quantidadeTon, valorTotal: it.valorVenda, clienteId,
                origem: "Venda de esterco",
              }));
            });

            return {
              ...prev,
              registrosEsterco: mergeByFilial(prev.registrosEsterco, items, filialId),
              produtos: produtosNext,
              clientes: clientesNext,
              vendas: [...prev.vendas, ...vendasNovas],
            };
          });
        }}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "tipo", label: "Tipo", type: "select", options: [{ value: "producao", label: "Produção (armazenar)" }, { value: "venda", label: "Venda (saída)" }] },
          { key: "quantidadeTon", label: "Quantidade (ton)", type: "number" },
          { key: "valorVenda", label: "Valor da venda (R$)", type: "number" },
          { key: "comprador", label: "Comprador" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "venda" ? "Venda" : "Produção") },
          { key: "quantidadeTon", label: "Qtd. (ton)", render: (r) => Number(r.quantidadeTon || 0).toFixed(1) },
          { key: "valorVenda", label: "Valor", render: (r) => (r.tipo === "venda" ? brl(r.valorVenda) : "—") },
          { key: "comprador", label: "Comprador" },
        ]}
      />
    </div>
  );
}

/* ---------------- Sensores / IoT ---------------- */

function SensoresIoT({ conn, db, filialId }) {
  const galpoes = db.galpoes.filter((g) => g.filialId === filialId);
  const [leituras, setLeituras] = useState(null);
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  function buscar() {
    setCarregando(true); setErro("");
    apiGetSensores(conn, filialId)
      .then((r) => setLeituras(r))
      .catch((e) => setErro(e.message || String(e)))
      .finally(() => setCarregando(false));
  }

  useEffect(() => { buscar(); }, [filialId]);

  const exemploPayload = JSON.stringify({
    apiKey: "sua-chave-aqui",
    action: "hardware",
    deviceId: "sensor-galpao-1-temp",
    filialId,
    galpaoId: galpoes[0]?.id || "<id-do-galpao>",
    tipo: "temperatura",
    valor: 27.4,
    unidade: "C",
  }, null, 2);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#EDE7F6", border: "1px solid #C9B8E8", borderRadius: 10, padding: "12px 14px", fontSize: 12.5, color: "#4A3A70" }}>
        Este módulo lê as leituras enviadas por sensores/hardware de galpão (temperatura, umidade, amônia, peso, consumo de água/ração) diretamente para a planilha, via o endpoint <code>action=hardware</code> do Apps Script — sem passar pelo app. Cada leitura vira uma nova linha; nada é sobrescrito.
      </div>

      <Card title="Como um dispositivo deve enviar dados" subtitle="POST para a mesma URL do Apps Script, com Content-Type: text/plain e o corpo abaixo em JSON.">
        <div style={{ fontFamily: "monospace", fontSize: 11, background: GREEN_DARK, color: "#D7E3DC", padding: 14, borderRadius: 8, overflowX: "auto", whiteSpace: "pre" }}>{exemploPayload}</div>
      </Card>

      <Card title="Últimas leituras" right={<Button variant="ghost" onClick={buscar}>{carregando ? "Atualizando…" : "Atualizar"}</Button>}>
        {erro && <div style={{ color: DANGER, fontSize: 12.5, marginBottom: 10 }}>{erro}</div>}
        <Table
          columns={[
            { key: "timestamp", label: "Data/Hora" },
            { key: "deviceId", label: "Dispositivo" },
            { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || r.galpaoId || "—" },
            { key: "tipo", label: "Tipo" },
            { key: "valor", label: "Valor", render: (r) => `${r.valor} ${r.unidade || ""}` },
          ]}
          rows={leituras || []}
          emptyText={leituras === null ? "Carregando…" : "Nenhuma leitura recebida ainda — conecte um dispositivo usando o formato acima."}
        />
      </Card>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<AvisoftRoot />);
</script>
</body>
</html>
