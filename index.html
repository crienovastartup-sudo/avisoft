/* Cadastro completo de Cliente/Fornecedor para fins fiscais, com anexo de documentos. */
function CadastroPessoa({ title, subtitle, items, onChange, filialId }) {
  const isMobile = useIsMobile();
  const blank = { id: null, razaoSocial: "", cpfCnpj: "", inscricaoEstadual: "", endereco: "", numero: "", bairro: "", cidade: "", uf: "", telefone1: "", telefone2: "", email1: "", email2: "", responsavel: "", anexos: [] };
  const [draft, setDraft] = useState(blank);
  const editing = !!draft.id;

  function submit(e) {
    e.preventDefault();
    if (!draft.razaoSocial) return;
    if (editing) onChange(items.map((it) => (it.id === draft.id ? draft : it)));
    else onChange([...items, { ...draft, id: uid(), filialId }]);
    setDraft(blank);
  }
  function edit(row) { setDraft({ ...blank, ...row }); }
  function remove(row) { onChange(items.filter((it) => it.id !== row.id)); if (draft.id === row.id) setDraft(blank); }

  function anexarArquivo(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    comprimirImagem(file)
      .then((resultado) => setDraft((d) => ({ ...d, anexos: [...(d.anexos || []), { id: uid(), ...resultado }] })))
      .catch((err) => alert(err.message));
  }
  function removerAnexo(anexoId) {
    setDraft((d) => ({ ...d, anexos: (d.anexos || []).filter((a) => a.id !== anexoId) }));
  }

  return (
    <Card title={title} subtitle={subtitle}>
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr 1fr"), gap: 10 }}>
          <Field label="Razão social / Nome"><TextInput value={draft.razaoSocial} onChange={(e) => setDraft({ ...draft, razaoSocial: e.target.value })} /></Field>
          <Field label="CPF / CNPJ"><TextInput value={draft.cpfCnpj} onChange={(e) => setDraft({ ...draft, cpfCnpj: e.target.value })} /></Field>
          <Field label="Inscrição estadual"><TextInput value={draft.inscricaoEstadual} onChange={(e) => setDraft({ ...draft, inscricaoEstadual: e.target.value })} /></Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr 1fr"), gap: 10 }}>
          <Field label="Endereço"><TextInput value={draft.endereco} onChange={(e) => setDraft({ ...draft, endereco: e.target.value })} /></Field>
          <Field label="Número"><TextInput value={draft.numero} onChange={(e) => setDraft({ ...draft, numero: e.target.value })} /></Field>
          <Field label="Bairro"><TextInput value={draft.bairro} onChange={(e) => setDraft({ ...draft, bairro: e.target.value })} /></Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr"), gap: 10 }}>
          <Field label="Cidade"><TextInput value={draft.cidade} onChange={(e) => setDraft({ ...draft, cidade: e.target.value })} /></Field>
          <Field label="UF"><TextInput maxLength={2} value={draft.uf} onChange={(e) => setDraft({ ...draft, uf: e.target.value.toUpperCase() })} /></Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "1fr 1fr 1fr 1fr"), gap: 10 }}>
          <Field label="Telefone 1"><TextInput value={draft.telefone1} onChange={(e) => setDraft({ ...draft, telefone1: e.target.value })} /></Field>
          <Field label="Telefone 2"><TextInput value={draft.telefone2} onChange={(e) => setDraft({ ...draft, telefone2: e.target.value })} /></Field>
          <Field label="E-mail 1"><TextInput type="email" value={draft.email1} onChange={(e) => setDraft({ ...draft, email1: e.target.value })} /></Field>
          <Field label="E-mail 2"><TextInput type="email" value={draft.email2} onChange={(e) => setDraft({ ...draft, email2: e.target.value })} /></Field>
        </div>
        <Field label="Responsável"><TextInput value={draft.responsavel} onChange={(e) => setDraft({ ...draft, responsavel: e.target.value })} /></Field>
        <div>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: MUTED, marginBottom: 6 }}>Documentos (imagem ou PDF, até 1,5 MB)</div>
          <input type="file" accept="image/*,.pdf" onChange={anexarArquivo} style={{ fontSize: 12.5 }} />
          {!!(draft.anexos || []).length && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8 }}>
              {draft.anexos.map((a) => (
                <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 6, background: BG, border: `1px solid ${BORDER}`, borderRadius: 999, padding: "4px 10px", fontSize: 11.5 }}>
                  <a href={a.dataUrl} download={a.nome} style={{ color: GREEN, textDecoration: "none", fontWeight: 700 }}>{a.nome}</a>
                  <button type="button" onClick={() => removerAnexo(a.id)} style={{ border: "none", background: "none", color: DANGER, cursor: "pointer", fontWeight: 700 }}>×</button>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <Button type="submit">{editing ? "Salvar alteração" : "Adicionar"}</Button>
          {editing && <Button type="button" variant="ghost" onClick={() => setDraft(blank)}>Cancelar</Button>}
        </div>
      </form>
      <div style={{ height: 1, background: BORDER, margin: "16px 0" }} />
      <Table
        columns={[
          { key: "razaoSocial", label: "Razão social / Nome" },
          { key: "cpfCnpj", label: "CPF/CNPJ" },
          { key: "cidade", label: "Cidade/UF", render: (r) => [r.cidade, r.uf].filter(Boolean).join("/") || "—" },
          { key: "telefone1", label: "Telefone" },
          { key: "anexos", label: "Docs", render: (r) => (r.anexos?.length ? `${r.anexos.length} arquivo(s)` : "—") },
        ]}
        rows={items}
        onEdit={edit}
        onDelete={remove}
      />
    </Card>
  );
}

function Vendas({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const produtos = db.produtos.filter((p) => p.filialId === filialId && p.controleTipo !== "almoxarifado");
  const vendedores = db.vendedores.filter((v) => v.filialId === filialId);
  const clientes = db.clientes.filter((c) => c.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const empresa = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
  const filial = empresa?.filiais.find((f) => f.id === filialId);
  const [danfeVenda, setDanfeVenda] = useState(null);

  const [form, setForm] = useState({ data: todayISO(), clienteId: "", vendedorId: "", produtoId: "", qtd: "", precoUnit: "", condicaoPagamento: "vista_pix", centroCustoId: "", modalidadeFrete: "sem_frete", enderecoEntrega: "", valorFrete: "" });
  const clienteSelecionado = clientes.find((c) => c.id === form.clienteId);
  const produtoSelecionado = produtos.find((p) => p.id === form.produtoId);
  const cfopPreview = determinarCFOP(empresa?.tipoEmpresa, filial?.uf, clienteSelecionado?.uf, ehSim(produtoSelecionado?.residuo), produtoSelecionado?.controleTipo === "imobilizado");

  function precoAoEscolher(produtoId) {
    const p = produtos.find((x) => x.id === produtoId);
    setForm((f) => ({ ...f, produtoId, precoUnit: p ? p.precoVenda : "" }));
  }

  function clienteAoEscolher(clienteId) {
    const c = clientes.find((x) => x.id === clienteId);
    const enderecoCliente = c ? [c.endereco, c.numero, c.bairro, c.cidade, c.uf].filter(Boolean).join(", ") : "";
    setForm((f) => ({ ...f, clienteId, enderecoEntrega: f.enderecoEntrega || enderecoCliente }));
  }

  function lancarVenda(e) {
    e.preventDefault();
    const vendedor = vendedores.find((v) => v.id === form.vendedorId);
    const totalProdutos = Number(form.qtd || 0) * Number(form.precoUnit || 0);
    const freteDestacado = form.modalidadeFrete === "cif_destacado" ? Number(form.valorFrete) || 0 : 0;
    const total = totalProdutos + freteDestacado;
    const comissaoValor = vendedor ? total * (Number(vendedor.percentualComissao || 0) / 100) : 0;
    let comissaoGerenteValor = 0;
    let gerenteComercialId = null;
    if (vendedor && vendedor.gerenteComercialId) {
      const gerente = vendedores.find((v) => v.id === vendedor.gerenteComercialId);
      if (gerente) {
        gerenteComercialId = gerente.id;
        comissaoGerenteValor = total * (Number(gerente.percentualComissaoGerente || 0) / 100);
      }
    }
    const condicao = form.condicaoPagamento || "vista_pix";
    const parcelas = gerarParcelas(condicao, total, form.data);
    const cfop = determinarCFOP(empresa?.tipoEmpresa, filial?.uf, clienteSelecionado?.uf, ehSim(produtoSelecionado?.residuo), produtoSelecionado?.controleTipo === "imobilizado");
    const venda = {
      id: uid(), filialId, data: form.data, clienteId: form.clienteId, vendedorId: form.vendedorId,
      itens: [{ produtoId: form.produtoId, qtd: Number(form.qtd), precoUnit: Number(form.precoUnit), cfop }],
      total, comissaoValor, gerenteComercialId, comissaoGerenteValor,
      condicaoPagamento: condicao, centroCustoId: form.centroCustoId || "",
      parcelas, nfe: null,
      entrega: {
        modalidadeFrete: form.modalidadeFrete,
        enderecoEntrega: form.modalidadeFrete === "sem_frete" ? "" : form.enderecoEntrega,
        valorFrete: freteDestacado,
        status: form.modalidadeFrete === "sem_frete" ? "" : "aguardando",
      },
    };
    update((prev) => ({
      ...prev,
      vendas: [...prev.vendas, venda],
      movimentacoesEstoque: [...prev.movimentacoesEstoque, { id: uid(), filialId, data: form.data, produtoId: form.produtoId, tipo: "saida", qtd: Number(form.qtd), motivo: "Venda", origem: "venda:" + venda.id }],
    }));
    setForm({ data: todayISO(), clienteId: "", vendedorId: "", produtoId: "", qtd: "", precoUnit: "", condicaoPagamento: "vista_pix", centroCustoId: "", modalidadeFrete: "sem_frete", enderecoEntrega: "", valorFrete: "" });
  }

  function atualizarParcela(vendaId, parcelaId, status) {
    update((prev) => ({
      ...prev,
      vendas: prev.vendas.map((v) => (v.id !== vendaId ? v : { ...v, parcelas: v.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })),
    }));
  }

  function emitirNFe(venda) {
    update((prev) => ({
      ...prev,
      vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { status: "autorizada", chave: gerarChaveAcessoFake(), protocolo: gerarProtocoloFake(), dataEmissao: todayISO(), ambiente: "homologacao" } })),
    }));
  }
  function cancelarNFe(venda) {
    const justificativa = window.prompt("Justificativa do cancelamento (mínimo 15 caracteres — exigência real da SEFAZ):");
    if (!justificativa || justificativa.trim().length < 15) { alert("Cancelamento não realizado: a justificativa precisa ter pelo menos 15 caracteres."); return; }
    update((prev) => ({
      ...prev,
      vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { ...v.nfe, status: "cancelada", dataCancelamento: todayISO(), justificativaCancelamento: justificativa } })),
    }));
  }
  function consultarNFe(venda) {
    if (!venda.nfe) { alert("Esta venda ainda não teve NF-e emitida."); return; }
    alert(`Consulta simulada — ambiente de HOMOLOGAÇÃO, sem conexão real com a SEFAZ.\n\nStatus: ${venda.nfe.status}\nChave de acesso: ${venda.nfe.chave}\nProtocolo: ${venda.nfe.protocolo}`);
  }

  const nomeProduto = (id) => produtos.find((p) => p.id === id)?.nome || "—";
  const nomeCliente = (id) => clientes.find((c) => c.id === id)?.razaoSocial || "—";
  const nomeVendedor = (id) => { const v = vendedores.find((x) => x.id === id); return v ? (v.apelido || v.nomeCompleto) : "—"; };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <CadastroPessoa title="Clientes" subtitle="Cadastro completo para fins fiscais — usado na emissão de NF-e." items={clientes} filialId={filialId}
        onChange={(items) => update((prev) => ({ ...prev, clientes: mergeByFilial(prev.clientes, items, filialId) }))} />

      <CrudBlock
        title="Vendedores & Comissão" subtitle="Cada vendedor pode ter um gerente comercial, que recebe uma comissão adicional sobre as vendas dele. Vendedores inativos não aparecem para escolher em vendas nem no relatório de comissões."
        filialId={filialId} items={vendedores} onChange={(items) => update((prev) => ({ ...prev, vendedores: mergeByFilial(prev.vendedores, items, filialId) }))}
        fields={[
          { key: "nomeCompleto", label: "Nome completo", required: true },
          { key: "apelido", label: "Apelido" },
          { key: "telefone", label: "Telefone" },
          { key: "percentualComissao", label: "Comissão (%)", type: "number" },
          { key: "gerenteComercialId", label: "Gerente comercial", type: "select", options: vendedores.map((v) => ({ value: v.id, label: v.apelido || v.nomeCompleto })) },
          { key: "percentualComissaoGerente", label: "Comissão do gerente (%)", type: "number" },
          { key: "ativo", label: "Situação", type: "select", options: [{ value: "true", label: "Ativo" }, { value: "false", label: "Inativo" }] },
        ]}
        columns={[
          { key: "nomeCompleto", label: "Nome" },
          { key: "apelido", label: "Apelido" },
          { key: "percentualComissao", label: "Comissão", render: (r) => `${r.percentualComissao || 0}%` },
          { key: "gerenteComercialId", label: "Gerente", render: (r) => { const g = vendedores.find((x) => x.id === r.gerenteComercialId); return g ? `${g.apelido || g.nomeCompleto} (${r.percentualComissaoGerente || 0}%)` : "—"; } },
          { key: "ativo", label: "Situação", render: (r) => (r.ativo === false || r.ativo === "false" ? "Inativo" : "Ativo") },
        ]}
      />

      <Card title="Lançar venda" subtitle="Gera parcelas conforme a condição de pagamento, alimenta contas a receber, comissões e a DRE. O CFOP é calculado automaticamente pelo tipo da empresa (Empresa & Filiais) e pelo UF do cliente.">
        <form onSubmit={lancarVenda} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "repeat(4, 1fr)"), gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Cliente"><Select options={clientes.map((c) => ({ value: c.id, label: c.razaoSocial }))} value={form.clienteId} onChange={(e) => clienteAoEscolher(e.target.value)} /></Field>
          <Field label="Vendedor"><Select options={vendedores.filter((v) => v.ativo !== false && v.ativo !== "false").map((v) => ({ value: v.id, label: v.apelido || v.nomeCompleto }))} value={form.vendedorId} onChange={(e) => setForm({ ...form, vendedorId: e.target.value })} /></Field>
          <Field label="Produto"><Select options={produtos.map((p) => ({ value: p.id, label: p.nome }))} value={form.produtoId} onChange={(e) => precoAoEscolher(e.target.value)} /></Field>
          <Field label="Qtd"><TextInput type="number" step="0.01" value={form.qtd} onChange={(e) => setForm({ ...form, qtd: e.target.value })} /></Field>
          <Field label="Preço unit. (R$)"><TextInput type="number" step="0.01" value={form.precoUnit} onChange={(e) => setForm({ ...form, precoUnit: e.target.value })} /></Field>
          <Field label="Condição de pagamento"><Select options={CONDICOES_PAGAMENTO} value={form.condicaoPagamento} onChange={(e) => setForm({ ...form, condicaoPagamento: e.target.value })} /></Field>
          <Field label="Centro de custo"><Select options={centrosCusto.map((c) => ({ value: c.id, label: c.nome }))} value={form.centroCustoId} onChange={(e) => setForm({ ...form, centroCustoId: e.target.value })} /></Field>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: MUTED, marginBottom: 6 }}>CFOP (automático)</div>
            <div style={{ background: BG, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "8px 10px", fontSize: 13.5, fontWeight: 800, color: GREEN }}>
              {cfopPreview} {cfopPreview.startsWith("6") ? "— interestadual" : "— estadual"}
            </div>
          </div>
          <Field label="Frete / entrega">
            <Select
              options={[
                { value: "sem_frete", label: "Sem frete (cliente retira)" },
                { value: "cif_gratis", label: "CIF — grátis, incluso no preço" },
                { value: "cif_destacado", label: "CIF — cobrado à parte (destacado na NF-e)" },
                { value: "fob", label: "FOB — por conta do destinatário" },
              ]}
              value={form.modalidadeFrete} onChange={(e) => setForm({ ...form, modalidadeFrete: e.target.value })}
            />
          </Field>
          {form.modalidadeFrete !== "sem_frete" && (
            <Field label="Endereço de entrega"><TextInput value={form.enderecoEntrega} onChange={(e) => setForm({ ...form, enderecoEntrega: e.target.value })} placeholder="Preenchido a partir do cliente — edite se for outro endereço" /></Field>
          )}
          {form.modalidadeFrete === "cif_destacado" && (
            <Field label="Valor do frete (R$)"><TextInput type="number" step="0.01" value={form.valorFrete} onChange={(e) => setForm({ ...form, valorFrete: e.target.value })} /></Field>
          )}
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar venda</Button></div>
        </form>
      </Card>

      <Card title={`Vendas lançadas (${vendas.length})`}>
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "clienteId", label: "Cliente", render: (r) => nomeCliente(r.clienteId) },
            { key: "vendedorId", label: "Vendedor", render: (r) => nomeVendedor(r.vendedorId) },
            { key: "produto", label: "Produto", render: (r) => nomeProduto(r.itens[0]?.produtoId) },
            { key: "cfop", label: "CFOP", render: (r) => r.itens[0]?.cfop || produtos.find((p) => p.id === r.itens[0]?.produtoId)?.cfop || "—" },
            { key: "total", label: "Total", render: (r) => brl(r.total) },
            { key: "entrega", label: "Entrega", render: (r) => {
              if (!r.entrega || r.entrega.modalidadeFrete === "sem_frete") return <span style={{ fontSize: 11, color: MUTED }}>Cliente retira</span>;
              const rotulos = { cif_gratis: "CIF grátis", cif_destacado: "CIF destacado", fob: "FOB" };
              return (
                <div style={{ fontSize: 11 }}>
                  <div style={{ fontWeight: 700 }}>{rotulos[r.entrega.modalidadeFrete] || r.entrega.modalidadeFrete}{r.entrega.valorFrete > 0 && <> — {brl(r.entrega.valorFrete)}</>}</div>
                  <div style={{ color: MUTED }}>{r.entrega.status === "entregue" ? "Entregue" : "Aguardando entrega"}</div>
                </div>
              );
            } },
            { key: "comissaoValor", label: "Comissão", render: (r) => <span>{brl(r.comissaoValor)}{r.comissaoGerenteValor > 0 && <><br /><span style={{ fontSize: 10.5, color: MUTED }}>+ gerente: {brl(r.comissaoGerenteValor)}</span></>}</span> },
            { key: "condicaoPagamento", label: "Condição", render: (r) => CONDICOES_PAGAMENTO.find((c) => c.value === r.condicaoPagamento)?.label || "—" },
            { key: "parcelas", label: "Parcelas / recebimento", render: (r) => <ParcelasList parcelas={r.parcelas} onStatusChange={(pid, st) => atualizarParcela(r.id, pid, st)} /> },
            {
              key: "nfe", label: "NF-e", render: (r) => (
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {r.nfe ? (
                    <span style={{ fontSize: 11, fontWeight: 700, color: r.nfe.status === "cancelada" ? DANGER : SUCCESS }}>
                      {r.nfe.status === "cancelada" ? "Cancelada" : "Autorizada"} (homolog.)
                    </span>
                  ) : <span style={{ fontSize: 11, color: MUTED }}>Não emitida</span>}
                  <div style={{ display: "flex", gap: 8 }}>
                    {!r.nfe && <button onClick={() => emitirNFe(r)} style={linkBtnStyle(GREEN)}>emitir</button>}
                    {r.nfe && r.nfe.status !== "cancelada" && <button onClick={() => cancelarNFe(r)} style={linkBtnStyle(DANGER)}>cancelar</button>}
                    {r.nfe && <button onClick={() => consultarNFe(r)} style={linkBtnStyle(MUTED)}>consultar</button>}
                    {r.nfe && <button onClick={() => setDanfeVenda(r)} style={linkBtnStyle(GOLD)}>ver DANFE</button>}
                  </div>
                </div>
              ),
            },
          ]}
          rows={[...vendas].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>

      {danfeVenda && (
        <Modal title="DANFE — Ambiente de Homologação" onClose={() => setDanfeVenda(null)} wide>
          <Danfe venda={danfeVenda} empresa={empresa} filial={filial} cliente={clientes.find((c) => c.id === danfeVenda.clienteId)} produtos={produtos} />
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Button onClick={() => window.print()}>Imprimir / Salvar como PDF</Button>
            <Button variant="ghost" onClick={() => setDanfeVenda(null)}>Fechar</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* Quanto já foi vendido de um lote específico — soma os itens de venda que
   referenciam esse loteId (orçamentos não contam, só vendas de verdade). */
function vendidoDoLote(db, loteId) {
  return db.vendas.reduce((s, v) => s + (v.itens || []).filter((it) => it.loteId === loteId).reduce((s2, it) => s2 + Number(it.qtd || 0), 0), 0);
}
function saldoLote(db, lote) {
  return Math.max(0, Number(lote.quantidade || 0) - vendidoDoLote(db, lote.id));
}
/* Lotes de um produto com saldo disponível, ordenados por FEFO
   (o que vence primeiro aparece primeiro — sem data de validade vai por último). */
function lotesFEFO(db, filialId, produtoId) {
  return db.lotesProduto
    .filter((l) => l.filialId === filialId && l.produtoId === produtoId)
    .map((l) => ({ ...l, saldo: saldoLote(db, l) }))
    .filter((l) => l.saldo > 0)
    .sort((a, b) => {
      if (!a.dataValidade) return 1;
      if (!b.dataValidade) return -1;
      return a.dataValidade < b.dataValidade ? -1 : 1;
    });
}

/* Cadastro de lotes de produção — cada lote é um registro separado, com sua
   própria validade, permitindo vários lotes em aberto para um mesmo produto. */
/* Controle de entrada/saída dos itens marcados como "Almoxarifado" (uso
   interno — limpeza, peças, ferramentas, material de escritório etc.).
   Fica separado do estoque de produtos para venda: aqui não é venda,
   é consumo — a saída pode virar despesa administrativa se você marcar. */
function AlmoxarifadoMovimentacoes({ db, update, filialId }) {
  const itensAlmoxarifado = db.produtos.filter((p) => p.filialId === filialId && p.controleTipo === "almoxarifado");
  const movimentacoes = db.movimentacoesEstoque.filter((m) => m.filialId === filialId && itensAlmoxarifado.some((p) => p.id === m.produtoId));
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);

  const [form, setForm] = useState({ produtoId: "", tipo: "saida", quantidade: "", motivo: "", centroCustoId: "", gerarDespesa: "false", valorDespesa: "" });

  const saldoPorItem = {};
  movimentacoes.forEach((m) => {
    const delta = m.tipo === "entrada" ? Number(m.qtd || 0) : -Number(m.qtd || 0);
    saldoPorItem[m.produtoId] = (saldoPorItem[m.produtoId] || 0) + delta;
  });

  function registrar(e) {
    e.preventDefault();
    if (!form.produtoId || !Number(form.quantidade)) return;
    const movId = uid();
    update((prev) => {
      const novaMov = { id: movId, filialId, data: todayISO(), produtoId: form.produtoId, tipo: form.tipo, qtd: Number(form.quantidade), motivo: form.motivo || (form.tipo === "saida" ? "Consumo interno" : "Reposição de almoxarifado") };
      const gerarDespesa = form.gerarDespesa === "true" && form.tipo === "saida" && Number(form.valorDespesa) > 0;
      const contaNova = gerarDespesa ? [{
        id: uid(), filialId, tipo: "pagar",
        descricao: `Almoxarifado — ${db.produtos.find((p) => p.id === form.produtoId)?.nome || "item"} (${form.motivo || "consumo"})`,
        valor: Number(form.valorDespesa), vencimento: todayISO(), centroCustoId: form.centroCustoId || "", status: "pago",
      }] : [];
      return {
        ...prev,
        movimentacoesEstoque: [...prev.movimentacoesEstoque, novaMov],
        contasAvulsas: [...prev.contasAvulsas, ...contaNova],
      };
    });
    setForm({ produtoId: "", tipo: "saida", quantidade: "", motivo: "", centroCustoId: "", gerarDespesa: "false", valorDespesa: "" });
  }

  if (!itensAlmoxarifado.length) {
    return (
      <Card title="Almoxarifado" subtitle="Nenhum produto está marcado como 'Almoxarifado' ainda. Marque acima os itens de uso interno (limpeza, peças, ferramentas etc.) pra controlar entrada e saída aqui.">
        <div />
      </Card>
    );
  }

  return (
    <Card title="Almoxarifado — entrada e saída (uso interno)" subtitle="Separado do estoque de produtos para venda — aqui é consumo, não venda.">
      <form onSubmit={registrar} style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, alignItems: "end", marginBottom: 16 }}>
        <Field label="Item"><Select options={itensAlmoxarifado.map((p) => ({ value: p.id, label: p.nome }))} value={form.produtoId} onChange={(e) => setForm({ ...form, produtoId: e.target.value })} /></Field>
        <Field label="Movimento"><Select options={[{ value: "saida", label: "Saída (consumo)" }, { value: "entrada", label: "Entrada (reposição/compra)" }]} value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })} /></Field>
        <Field label="Quantidade"><TextInput type="number" value={form.quantidade} onChange={(e) => setForm({ ...form, quantidade: e.target.value })} /></Field>
        <Field label="Motivo"><TextInput placeholder="ex.: limpeza do galpão 3" value={form.motivo} onChange={(e) => setForm({ ...form, motivo: e.target.value })} /></Field>
        <Field label="Centro de custo"><Select options={centrosCusto.map((c) => ({ value: c.id, label: c.nome }))} value={form.centroCustoId} onChange={(e) => setForm({ ...form, centroCustoId: e.target.value })} /></Field>
        {form.tipo === "saida" && (
          <Field label="Gerar despesa?"><Select options={[{ value: "false", label: "Não" }, { value: "true", label: "Sim" }]} value={form.gerarDespesa} onChange={(e) => setForm({ ...form, gerarDespesa: e.target.value })} /></Field>
        )}
        {form.tipo === "saida" && form.gerarDespesa === "true" && (
          <Field label="Valor da despesa (R$)"><TextInput type="number" step="0.01" value={form.valorDespesa} onChange={(e) => setForm({ ...form, valorDespesa: e.target.value })} /></Field>
        )}
        <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Registrar</Button></div>
      </form>
      <Table
        columns={[
          { key: "nome", label: "Item" },
          { key: "saldo", label: "Saldo atual", render: (r) => (saldoPorItem[r.id] || 0).toLocaleString("pt-BR") },
        ]}
        rows={itensAlmoxarifado}
      />
      <div style={{ height: 1, background: BORDER, margin: "14px 0" }} />
      <Table
        columns={[
          { key: "data", label: "Data" },
          { key: "produtoId", label: "Item", render: (r) => itensAlmoxarifado.find((p) => p.id === r.produtoId)?.nome || "—" },
          { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "entrada" ? "Entrada" : "Saída") },
          { key: "qtd", label: "Qtd.", render: (r) => Number(r.qtd || 0).toLocaleString("pt-BR") },
          { key: "motivo", label: "Motivo" },
        ]}
        rows={[...movimentacoes].sort((a, b) => (a.data < b.data ? 1 : -1)).slice(0, 30)}
        emptyText="Nenhuma movimentação de almoxarifado registrada ainda."
      />
    </Card>
  );
}

/* Controle de bens do Imobilizado (veículos, câmeras, ferramentas de maior valor...).
   Entrada pode ser avulsa (sem nota) ou vinculada a uma nota fiscal de compra —
   o valor de aquisição alimenta o Ativo Não Circulante no Balanço Patrimonial. */
function ImobilizadoControle({ db, update, filialId }) {
  const itensImobilizado = db.produtos.filter((p) => p.filialId === filialId && p.controleTipo === "imobilizado");
  const fornecedores = db.fornecedores.filter((f) => f.filialId === filialId);
  const movimentacoes = db.movimentacoesEstoque.filter((m) => m.filialId === filialId && itensImobilizado.some((p) => p.id === m.produtoId));

  const [form, setForm] = useState({ produtoId: "", tipo: "entrada", quantidade: "1", valorAquisicao: "", origemLancamento: "avulso", numeroNota: "", fornecedorId: "", motivo: "" });

  const saldoPorItem = {};
  const valorPorItem = {};
  movimentacoes.forEach((m) => {
    const delta = m.tipo === "entrada" ? Number(m.qtd || 0) : -Number(m.qtd || 0);
    saldoPorItem[m.produtoId] = (saldoPorItem[m.produtoId] || 0) + delta;
    const valorDelta = m.tipo === "entrada" ? Number(m.valorAquisicao || 0) : -Number(m.valorAquisicao || 0);
    valorPorItem[m.produtoId] = (valorPorItem[m.produtoId] || 0) + valorDelta;
  });
  const valorTotalImobilizado = Object.values(valorPorItem).reduce((s, v) => s + v, 0);

  function registrar(e) {
    e.preventDefault();
    if (!form.produtoId || !Number(form.quantidade)) return;
    const novaMov = {
      id: uid(), filialId, data: todayISO(), produtoId: form.produtoId, tipo: form.tipo, qtd: Number(form.quantidade),
      motivo: form.motivo || (form.tipo === "entrada" ? "Aquisição de bem do imobilizado" : "Baixa de bem do imobilizado"),
      valorAquisicao: Number(form.valorAquisicao) || 0,
      origemLancamento: form.origemLancamento,
      numeroNota: form.origemLancamento === "nota_fiscal" ? form.numeroNota : "",
      fornecedorId: form.fornecedorId || "",
    };
    update((prev) => ({ ...prev, movimentacoesEstoque: [...prev.movimentacoesEstoque, novaMov] }));
    setForm({ produtoId: "", tipo: "entrada", quantidade: "1", valorAquisicao: "", origemLancamento: "avulso", numeroNota: "", fornecedorId: "", motivo: "" });
  }

  if (!itensImobilizado.length) {
    return (
      <Card title="Imobilizado" subtitle="Nenhum produto está marcado como 'Imobilizado' ainda. Marque em Produtos & Embalagens os bens de uso duradouro (veículos, câmeras, ferramentas de maior valor) para controlar entrada e saída aqui.">
        <div />
      </Card>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <StatCard label="Valor total em Imobilizado (Ativo Não Circulante)" value={brl(valorTotalImobilizado)} accent={GREEN} />
      <Card title="Imobilizado — entrada e baixa de bens" subtitle="Separado do estoque de produtos e do almoxarifado. O valor de aquisição das entradas alimenta o Balanço Patrimonial.">
        <form onSubmit={registrar} style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, alignItems: "end", marginBottom: 16 }}>
          <Field label="Bem"><Select options={itensImobilizado.map((p) => ({ value: p.id, label: p.nome }))} value={form.produtoId} onChange={(e) => setForm({ ...form, produtoId: e.target.value })} /></Field>
          <Field label="Movimento"><Select options={[{ value: "entrada", label: "Entrada (aquisição)" }, { value: "saida", label: "Baixa (perda/descarte, não venda)" }]} value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })} /></Field>
          <Field label="Quantidade"><TextInput type="number" value={form.quantidade} onChange={(e) => setForm({ ...form, quantidade: e.target.value })} /></Field>
          <Field label="Valor de aquisição (R$)"><TextInput type="number" step="0.01" value={form.valorAquisicao} onChange={(e) => setForm({ ...form, valorAquisicao: e.target.value })} /></Field>
          <Field label="Tipo de lançamento">
            <Select options={[{ value: "avulso", label: "Avulso (sem nota)" }, { value: "nota_fiscal", label: "Com nota fiscal" }]} value={form.origemLancamento} onChange={(e) => setForm({ ...form, origemLancamento: e.target.value })} />
          </Field>
          {form.origemLancamento === "nota_fiscal" && (
            <>
              <Field label="Número da nota"><TextInput value={form.numeroNota} onChange={(e) => setForm({ ...form, numeroNota: e.target.value })} /></Field>
              <Field label="Fornecedor"><Select options={fornecedores.map((f) => ({ value: f.id, label: f.razaoSocial }))} value={form.fornecedorId} onChange={(e) => setForm({ ...form, fornecedorId: e.target.value })} /></Field>
            </>
          )}
          <Field label="Motivo/observação"><TextInput placeholder="ex.: compra de caminhão 3/4" value={form.motivo} onChange={(e) => setForm({ ...form, motivo: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Registrar</Button></div>
        </form>
        <Table
          columns={[
            { key: "nome", label: "Bem" },
            { key: "saldo", label: "Quantidade atual", render: (r) => (saldoPorItem[r.id] || 0).toLocaleString("pt-BR") },
            { key: "valor", label: "Valor contábil", render: (r) => brl(valorPorItem[r.id] || 0) },
          ]}
          rows={itensImobilizado}
        />
        <div style={{ height: 1, background: BORDER, margin: "14px 0" }} />
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "produtoId", label: "Bem", render: (r) => itensImobilizado.find((p) => p.id === r.produtoId)?.nome || "—" },
            { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "entrada" ? "Entrada" : "Baixa") },
            { key: "qtd", label: "Qtd.", render: (r) => Number(r.qtd || 0).toLocaleString("pt-BR") },
            { key: "valorAquisicao", label: "Valor", render: (r) => brl(r.valorAquisicao) },
            { key: "origemLancamento", label: "Origem", render: (r) => (r.origemLancamento === "nota_fiscal" ? `NF ${r.numeroNota || "—"}` : "Avulso") },
          ]}
          rows={[...movimentacoes].sort((a, b) => (a.data < b.data ? 1 : -1)).slice(0, 30)}
          emptyText="Nenhuma movimentação de imobilizado registrada ainda."
        />
      </Card>
    </div>
  );
}

function LotesProduto({ db, update, filialId }) {
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const lotes = db.lotesProduto.filter((l) => l.filialId === filialId);
  const clientes = db.clientes.filter((c) => c.filialId === filialId);
  const vendedores = db.vendedores.filter((v) => v.filialId === filialId);
  const hoje = todayISO();
  const [loteVendas, setLoteVendas] = useState(null); // lote selecionado para o popup

  function corValidade(dataValidade) {
    if (!dataValidade) return MUTED;
    const dias = Math.round((new Date(dataValidade + "T00:00:00") - new Date(hoje + "T00:00:00")) / 86400000);
    if (dias < 0) return DANGER;
    if (dias <= 7) return DANGER;
    if (dias <= 30) return GOLD;
    return SUCCESS;
  }

  /* Vendas que têm ao menos um item referenciando este lote, com os dados
     de cliente/vendedor/NF-e já resolvidos para exibir no popup. */
  function vendasDoLote(loteId) {
    return db.vendas
      .filter((v) => (v.itens || []).some((it) => it.loteId === loteId))
      .map((v) => {
        const item = v.itens.find((it) => it.loteId === loteId);
        const cliente = clientes.find((c) => c.id === v.clienteId);
        const vendedor = vendedores.find((x) => x.id === v.vendedorId);
        return {
          vendaId: v.id,
          data: v.data,
          cliente: cliente?.razaoSocial || "—",
          telefoneCliente: cliente?.telefone1 || cliente?.telefone2 || "—",
          vendedor: vendedor ? (vendedor.apelido || vendedor.nomeCompleto) : "—",
          quantidadeVendida: item?.qtd || 0,
          valorVendido: (item?.qtd || 0) * (item?.precoUnit || 0),
          condicaoPagamento: CONDICOES_PAGAMENTO.find((c) => c.value === v.condicaoPagamento)?.label || "—",
          nfe: v.nfe,
        };
      })
      .sort((a, b) => (a.data < b.data ? 1 : -1));
  }

  return (
    <>
      <CrudBlock
        title="Lotes de Produção (com validade)"
        subtitle="Cada lote é um cadastro separado do produto — um mesmo produto pode ter vários lotes com validades diferentes ao mesmo tempo. O saldo já desconta o que foi vendido (rastreabilidade venda ↔ lote)."
        filialId={filialId}
        items={lotes}
        onChange={(items) => update((prev) => ({ ...prev, lotesProduto: mergeByFilial(prev.lotesProduto, items, filialId) }))}
        fields={[
          { key: "produtoId", label: "Produto", type: "select", options: produtos.map((p) => ({ value: p.id, label: p.nome })) },
          { key: "codigo", label: "Código do lote", required: true },
          { key: "dataProducao", label: "Data de produção", type: "date" },
          { key: "dataValidade", label: "Data de validade", type: "date" },
          { key: "quantidade", label: "Quantidade produzida", type: "number" },
        ]}
        columns={[
          { key: "produtoId", label: "Produto", render: (r) => produtos.find((p) => p.id === r.produtoId)?.nome || "—" },
          { key: "codigo", label: "Lote" },
          { key: "quantidade", label: "Produzido", render: (r) => Number(r.quantidade || 0).toLocaleString("pt-BR") },
          { key: "vendido", label: "Vendido", render: (r) => vendidoDoLote(db, r.id).toLocaleString("pt-BR") },
          { key: "saldo", label: "Saldo disponível", render: (r) => saldoLote(db, r).toLocaleString("pt-BR") },
          {
            key: "dataValidade", label: "Validade", render: (r) => {
              if (!r.dataValidade) return "—";
              const dias = Math.round((new Date(r.dataValidade + "T00:00:00") - new Date(hoje + "T00:00:00")) / 86400000);
              return <span style={{ color: corValidade(r.dataValidade), fontWeight: 700 }}>{r.dataValidade.split("-").reverse().join("/")} {dias < 0 ? "(vencido)" : `(${dias}d)`}</span>;
            },
          },
          {
            key: "vendas", label: "Vendas", render: (r) => (
              <button onClick={() => setLoteVendas(r)} style={linkBtnStyle(GREEN)}>ver vendas ({vendidoDoLote(db, r.id) > 0 ? vendasDoLote(r.id).length : 0})</button>
            ),
          },
        ]}
      />

      {loteVendas && (
        <Modal title={`Vendas do lote ${loteVendas.codigo}`} travado onClose={() => setLoteVendas(null)} wide>
          <div style={{ fontSize: 12.5, color: MUTED, marginBottom: 12 }}>
            Produto: <b>{produtos.find((p) => p.id === loteVendas.produtoId)?.nome || "—"}</b> · Total vendido deste lote: <b>{vendidoDoLote(db, loteVendas.id).toLocaleString("pt-BR")}</b> de {Number(loteVendas.quantidade || 0).toLocaleString("pt-BR")} produzidos
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {vendasDoLote(loteVendas.id).map((v) => (
              <div key={v.vendaId} style={{ background: BG, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontWeight: 800, color: GREEN, fontSize: 13.5 }}>{v.cliente}</div>
                    <div style={{ fontSize: 11.5, color: MUTED }}>Tel.: {v.telefoneCliente}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontWeight: 800, fontSize: 14, color: GREEN }}>{brl(v.valorVendido)}</div>
                    <div style={{ fontSize: 11, color: MUTED }}>{v.data.split("-").reverse().join("/")}</div>
                  </div>
                </div>
                <div style={{ height: 1, background: BORDER, margin: "8px 0" }} />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 12 }}>
                  <div><b>Vendedor:</b> {v.vendedor}</div>
                  <div><b>Qtd. do lote vendida:</b> {v.quantidadeVendida.toLocaleString("pt-BR")}</div>
                  <div><b>Condição de pagamento:</b> {v.condicaoPagamento}</div>
                  <div>
                    <b>NF-e:</b>{" "}
                    {v.nfe ? (
                      <span style={{ color: v.nfe.status === "cancelada" ? DANGER : SUCCESS, fontWeight: 700 }}>
                        {v.nfe.status === "cancelada" ? "Cancelada" : "Autorizada"} — {v.nfe.chave}
                      </span>
                    ) : (
                      <span style={{ color: MUTED }}>Não emitida</span>
                    )}
                  </div>
                </div>
              </div>
            ))}
            {!vendasDoLote(loteVendas.id).length && <div style={{ textAlign: "center", color: MUTED, padding: 20, fontSize: 13 }}>Nenhuma venda vinculada a este lote ainda.</div>}
          </div>
          <div style={{ marginTop: 16 }}>
            <Button onClick={() => setLoteVendas(null)}>Fechar</Button>
          </div>
        </Modal>
      )}
    </>
  );
}

function Estoque({ db, filialId }) {
  const produtos = db.produtos.filter((p) => p.filialId === filialId && p.controleTipo !== "almoxarifado" && p.controleTipo !== "imobilizado");
  const movimentacoes = db.movimentacoesEstoque.filter((m) => m.filialId === filialId);
  const producoes = db.producoesRacao.filter((p) => p.filialId === filialId);
  const lotesProduto = db.lotesProduto.filter((l) => l.filialId === filialId);

  const proximaValidade = (produtoId) => {
    const lotes = lotesProduto.filter((l) => l.produtoId === produtoId && l.dataValidade).sort((a, b) => (a.dataValidade < b.dataValidade ? -1 : 1));
    return lotes[0];
  };

  const saldoPorProduto = {};
  movimentacoes.forEach((m) => {
    const delta = m.tipo === "entrada" ? Number(m.qtd || 0) : -Number(m.qtd || 0);
    saldoPorProduto[m.produtoId] = (saldoPorProduto[m.produtoId] || 0) + delta;
  });

  const racaoProduzida = producoes.reduce((s, p) => s + Number(p.qtdKg || 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card title="Saldo por produto" subtitle="Entradas (compras e importação de XML) menos saídas (vendas), lançamento a lançamento.">
        <Table
          columns={[
            { key: "nome", label: "Produto" },
            { key: "unidade", label: "Unidade" },
            { key: "lote", label: "Próximo lote a vencer", render: (r) => { const l = proximaValidade(r.id); return l ? `${l.codigo} — ${l.dataValidade.split("-").reverse().join("/")}` : "—"; } },
            { key: "saldo", label: "Saldo atual", render: (r) => (saldoPorProduto[r.id] || 0).toLocaleString("pt-BR") },
            { key: "valorEstoque", label: "Custo unitário", render: (r) => brl(r.custoUnit) },
          ]}
          rows={produtos}
        />
      </Card>
      <Card title="Movimentações recentes">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "produtoId", label: "Produto", render: (r) => produtos.find((p) => p.id === r.produtoId)?.nome || "—" },
            { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "entrada" ? "Entrada" : "Saída") },
            { key: "qtd", label: "Qtd", render: (r) => r.qtd.toLocaleString("pt-BR") },
            { key: "motivo", label: "Motivo" },
          ]}
          rows={[...movimentacoes].sort((a, b) => (a.data < b.data ? 1 : -1)).slice(0, 20)}
          emptyText="Nenhuma movimentação registrada ainda."
        />
      </Card>
      <Card title="Estoque de ração produzida">
        <div style={{ fontSize: 22, fontWeight: 800, color: GREEN }}>{racaoProduzida.toLocaleString("pt-BR")} kg</div>

        <div style={{ fontSize: 12.5, color: MUTED }}>Total produzido registrado no módulo Fábrica de Ração.</div>
      </Card>
    </div>
  );
}

function FabricaRacao({ db, update, filialId }) {
  const isMobile = useIsMobile();
  const formulacoes = db.formulacoes.filter((f) => f.filialId === filialId);
  const producoes = db.producoesRacao.filter((p) => p.filialId === filialId);
  const galpoes = db.galpoes.filter((g) => g.filialId === filialId);

  const [ingredientes, setIngredientes] = useState([{ nome: "", percentual: "", custoKg: "" }]);
  const [nomeFormula, setNomeFormula] = useState("");

  function addLinha() { setIngredientes([...ingredientes, { nome: "", percentual: "", custoKg: "" }]); }
  function updLinha(i, patch) { setIngredientes(ingredientes.map((l, idx) => (idx === i ? { ...l, ...patch } : l))); }
  function removeLinha(i) { setIngredientes(ingredientes.filter((_, idx) => idx !== i)); }

  function salvarFormula(e) {
    e.preventDefault();
    update((prev) => ({ ...prev, formulacoes: [...prev.formulacoes, { id: uid(), filialId, nome: nomeFormula, ingredientes }] }));
    setNomeFormula(""); setIngredientes([{ nome: "", percentual: "", custoKg: "" }]);
  }

  const custoKgFormula = (f) => f.ingredientes.reduce((s, i) => s + (Number(i.percentual || 0) / 100) * Number(i.custoKg || 0), 0);

  const [prod, setProd] = useState({ data: todayISO(), formulacaoId: "", qtdKg: "", moega: "", pesoPorSaco: "40", galpaoDestinoId: "" });
  const formulaSelecionada = formulacoes.find((f) => f.id === prod.formulacaoId);
  const custoTotalPreview = formulaSelecionada ? custoKgFormula(formulaSelecionada) * Number(prod.qtdKg || 0) : 0;

  function lancarProducao(e) {
    e.preventDefault();
    const formula = formulacoes.find((f) => f.id === prod.formulacaoId);
    const custoTotal = formula ? custoKgFormula(formula) * Number(prod.qtdKg || 0) : 0;
    const sacos = Number(prod.pesoPorSaco || 0) > 0 ? Number(prod.qtdKg || 0) / Number(prod.pesoPorSaco) : 0;
    update((prev) => ({ ...prev, producoesRacao: [...prev.producoesRacao, { id: uid(), filialId, data: prod.data, formulacaoId: prod.formulacaoId, moega: prod.moega, pesoPorSaco: Number(prod.pesoPorSaco || 0), galpaoDestinoId: prod.galpaoDestinoId, qtdKg: Number(prod.qtdKg), sacos, custoTotal }] }));
    setProd({ data: todayISO(), formulacaoId: "", qtdKg: "", moega: "", pesoPorSaco: "40", galpaoDestinoId: "" });
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card title="Referência de mercado — insumos" subtitle="Cotações consultadas para apoiar a decisão de compra. Preços de commodities agrícolas oscilam diariamente — confirme no fornecedor antes de negociar.">
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
          <StatCard label="Milho — saca 60kg (CEPEA)" value="R$ 67 – 70" accent={GOLD} />
          <StatCard label="Farelo de soja — tonelada" value="R$ 1.900" accent={GREEN} />
        </div>
        <div style={{ fontSize: 10.5, color: MUTED, marginTop: 8 }}>Fonte: CEPEA/Esalq e Portal DBO, cotações de agosto de 2026. Valores de referência — não são atualizados automaticamente pelo sistema.</div>
      </Card>

      <Card title="Nova formulação" subtitle="Cadastre os ingredientes e o percentual de cada um na mistura.">
        <form onSubmit={salvarFormula} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <Field label="Nome da formulação"><TextInput value={nomeFormula} onChange={(e) => setNomeFormula(e.target.value)} /></Field>
          {ingredientes.map((ing, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "2fr 1fr 1fr auto"), gap: 10 }}>
              <TextInput placeholder="Ingrediente (ex: milho)" value={ing.nome} onChange={(e) => updLinha(i, { nome: e.target.value })} />
              <TextInput placeholder="% na mistura" type="number" value={ing.percentual} onChange={(e) => updLinha(i, { percentual: e.target.value })} />
              <TextInput placeholder="Custo/kg (R$)" type="number" step="0.01" value={ing.custoKg} onChange={(e) => updLinha(i, { custoKg: e.target.value })} />
              <Button type="button" variant="danger" onClick={() => removeLinha(i)}>×</Button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8 }}>
            <Button type="button" variant="ghost" onClick={addLinha}>+ ingrediente</Button>
            <Button type="submit">Salvar formulação</Button>
          </div>
        </form>
      </Card>

      <Card title={`Formulações cadastradas (${formulacoes.length})`}>
        <Table
          columns={[
            { key: "nome", label: "Formulação" },
            { key: "ingredientes", label: "Ingredientes", render: (r) => r.ingredientes.map((i) => `${i.nome} (${i.percentual}%)`).join(", ") },
            { key: "custoKg", label: "Custo/kg", render: (r) => brl(custoKgFormula(r)) },
          ]}
          rows={formulacoes}
        />
      </Card>

      <Card title="Registrar produção" subtitle="Baixa o custo calculado da formulação, converte em sacos e alimenta o estoque de ração.">
        <form onSubmit={lancarProducao} style={{ display: "grid", gridTemplateColumns: gridCols(isMobile, "repeat(3, 1fr)"), gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={prod.data} onChange={(e) => setProd({ ...prod, data: e.target.value })} /></Field>
          <Field label="Formulação"><Select options={formulacoes.map((f) => ({ value: f.id, label: f.nome }))} value={prod.formulacaoId} onChange={(e) => setProd({ ...prod, formulacaoId: e.target.value })} /></Field>
          <Field label="Moega / silo de origem"><TextInput value={prod.moega} onChange={(e) => setProd({ ...prod, moega: e.target.value })} /></Field>
          <Field label="Quantidade (kg)"><TextInput type="number" value={prod.qtdKg} onChange={(e) => setProd({ ...prod, qtdKg: e.target.value })} /></Field>
          <Field label="Peso por saco (kg)"><TextInput type="number" value={prod.pesoPorSaco} onChange={(e) => setProd({ ...prod, pesoPorSaco: e.target.value })} /></Field>
          <Field label="Silo/Galpão de destino"><Select options={galpoes.map((g) => ({ value: g.id, label: g.nome }))} value={prod.galpaoDestinoId} onChange={(e) => setProd({ ...prod, galpaoDestinoId: e.target.value })} /></Field>
          <div style={{ fontSize: 12, color: MUTED, paddingBottom: 8 }}>
            {Number(prod.pesoPorSaco) > 0 && Number(prod.qtdKg) > 0 ? `≈ ${(Number(prod.qtdKg) / Number(prod.pesoPorSaco)).toFixed(1)} sacos` : "—"}
          </div>
          <div style={{ gridColumn: "1 / -1" }}>
            <div style={{ background: BG, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "10px 14px", marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12.5, color: MUTED, fontWeight: 700 }}>Custo total gerado neste lote</span>
              <span style={{ fontSize: 18, fontWeight: 800, color: GREEN }}>{brl(custoTotalPreview)}</span>
            </div>
            <Button type="submit">Registrar</Button>
          </div>
        </form>
      </Card>

      <Card title="Produções registradas">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "formulacaoId", label: "Formulação", render: (r) => formulacoes.find((f) => f.id === r.formulacaoId)?.nome || "—" },
            { key: "moega", label: "Moega", render: (r) => r.moega || "—" },
            { key: "galpaoDestinoId", label: "Destino", render: (r) => galpoes.find((g) => g.id === r.galpaoDestinoId)?.nome || "—" },
            { key: "qtdKg", label: "Kg produzidos", render: (r) => r.qtdKg.toLocaleString("pt-BR") },
            { key: "sacos", label: "Sacos", render: (r) => (r.sacos || 0).toFixed(1) },
            { key: "custoTotal", label: "Custo total", render: (r) => brl(r.custoTotal) },
          ]}
          rows={[...producoes].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>
    </div>
  );
}
