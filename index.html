/* Leitura de XML de NF-e (DANFE eletrônico) no navegador — sem backend. */
function parseNFeXML(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML inválido ou mal formado.");
  const txt = (root, tag) => (root ? root.getElementsByTagName(tag)[0]?.textContent?.trim() || "" : "");

  const infNFe = doc.getElementsByTagName("infNFe")[0];
  if (!infNFe) throw new Error("Não encontrei a tag <infNFe> — este arquivo não parece ser um XML de NF-e.");

  const emit = infNFe.getElementsByTagName("emit")[0];
  const ide = infNFe.getElementsByTagName("ide")[0];
  const total = infNFe.getElementsByTagName("ICMSTot")[0];
  const chaveAcesso = (infNFe.getAttribute("Id") || "").replace(/^NFe/, "");

  const itens = Array.from(infNFe.getElementsByTagName("det")).map((det) => {
    const prod = det.getElementsByTagName("prod")[0];
    return {
      codigo: txt(prod, "cProd"),
      nome: txt(prod, "xProd") || "Item sem descrição",
      ncm: txt(prod, "NCM"),
      cfop: txt(prod, "CFOP"),
      unidade: txt(prod, "uCom"),
      qtd: parseFloat(txt(prod, "qCom")) || 0,
      valorUnit: parseFloat(txt(prod, "vUnCom")) || 0,
      valorTotal: parseFloat(txt(prod, "vProd")) || 0,
    };
  });
  if (!itens.length) throw new Error("O XML não contém itens de produto (<det>/<prod>).");

  return {
    chaveAcesso,
    numero: txt(ide, "nNF"),
    dataEmissao: (txt(ide, "dhEmi") || "").slice(0, 10) || todayISO(),
    fornecedor: { cnpj: txt(emit, "CNPJ"), nome: txt(emit, "xNome") || "Fornecedor do XML" },
    valorTotal: parseFloat(txt(total, "vNF")) || itens.reduce((s, i) => s + i.valorTotal, 0),
    itens,
  };
}

function Compras({ db, update, filialId }) {
  const fornecedores = db.fornecedores.filter((f) => f.filialId === filialId);
  const compras = db.compras.filter((c) => c.filialId === filialId);
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);
  const [form, setForm] = useState({ data: todayISO(), fornecedorId: "", categoria: "insumo", descricao: "", valor: "", condicaoPagamento: "boleto_30", centroCustoId: "", produtoId: "", quantidade: "" });
  const [xmlPreview, setXmlPreview] = useState(null);
  const [xmlError, setXmlError] = useState("");

  function lancar(e) {
    e.preventDefault();
    const parcelas = gerarParcelas(form.condicaoPagamento || "boleto_30", Number(form.valor || 0), form.data);
    const compraId = uid();
    update((prev) => ({
      ...prev,
      compras: [...prev.compras, { id: compraId, filialId, data: form.data, fornecedorId: form.fornecedorId, categoria: form.categoria, descricao: form.descricao, valor: Number(form.valor), condicaoPagamento: form.condicaoPagamento, centroCustoId: form.centroCustoId, parcelas }],
      movimentacoesEstoque: form.produtoId && Number(form.quantidade) > 0
        ? [...prev.movimentacoesEstoque, { id: uid(), filialId, data: form.data, produtoId: form.produtoId, tipo: "entrada", qtd: Number(form.quantidade), motivo: form.descricao || "Compra", origem: "compra:" + compraId }]
        : prev.movimentacoesEstoque,
    }));
    setForm({ data: todayISO(), fornecedorId: "", categoria: "insumo", descricao: "", valor: "", condicaoPagamento: "boleto_30", centroCustoId: "", produtoId: "", quantidade: "" });
  }

  function atualizarParcela(compraId, parcelaId, status) {
    update((prev) => ({ ...prev, compras: prev.compras.map((c) => (c.id !== compraId ? c : { ...c, parcelas: c.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })) }));
  }

  function handleXmlFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setXmlError("");
    const reader = new FileReader();
    reader.onload = () => {
      try { setXmlPreview(parseNFeXML(reader.result)); }
      catch (err) { setXmlError(err.message || "Não foi possível ler este XML."); setXmlPreview(null); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function confirmarImportacaoXML() {
    if (!xmlPreview) return;
    update((prev) => {
      let fornecedoresNext = prev.fornecedores;
      let fornecedor = xmlPreview.fornecedor.cnpj && fornecedoresNext.find((f) => f.filialId === filialId && f.cpfCnpj === xmlPreview.fornecedor.cnpj);
      if (!fornecedor) {
        fornecedor = { id: uid(), filialId, razaoSocial: xmlPreview.fornecedor.nome, cpfCnpj: xmlPreview.fornecedor.cnpj, inscricaoEstadual: "", endereco: "", numero: "", bairro: "", cidade: "", uf: "", telefone1: "", telefone2: "", email1: "", email2: "", responsavel: "", anexos: [] };
        fornecedoresNext = [...fornecedoresNext, fornecedor];
      }
      let produtosNext = prev.produtos;
      const movimentacoes = [];
      xmlPreview.itens.forEach((item) => {
        let produto = produtosNext.find((p) => p.filialId === filialId && p.nome.trim().toLowerCase() === item.nome.trim().toLowerCase());
        if (!produto) {
          produto = { id: uid(), filialId, nome: item.nome, tipo: "outro", unidade: (item.unidade || "un").toLowerCase(), custoUnit: item.valorUnit, precoVenda: "", lote: "", cfop: item.cfop };
          produtosNext = [...produtosNext, produto];
        }
        movimentacoes.push({ id: uid(), filialId, data: xmlPreview.dataEmissao, produtoId: produto.id, tipo: "entrada", qtd: item.qtd, motivo: "Importação XML NF-e nº " + xmlPreview.numero, origem: "xml:" + xmlPreview.chaveAcesso });
      });
      const parcelas = gerarParcelas("boleto_30", xmlPreview.valorTotal, xmlPreview.dataEmissao);
      const compra = {
        id: uid(), filialId, data: xmlPreview.dataEmissao, fornecedorId: fornecedor.id,
        categoria: "insumo", descricao: `Importação XML NF-e nº ${xmlPreview.numero}`, valor: xmlPreview.valorTotal,
        condicaoPagamento: "boleto_30", centroCustoId: "", parcelas, origemXml: true, chaveAcessoOrigem: xmlPreview.chaveAcesso,
      };
      return { ...prev, fornecedores: fornecedoresNext, produtos: produtosNext, compras: [...prev.compras, compra], movimentacoesEstoque: [...prev.movimentacoesEstoque, ...movimentacoes] };
    });
    setXmlPreview(null);
  }

  const nomeFornecedor = (id) => fornecedores.find((f) => f.id === id)?.razaoSocial || "—";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <CadastroPessoa title="Fornecedores" subtitle="Cadastro completo para fins fiscais." items={fornecedores} filialId={filialId}
        onChange={(items) => update((prev) => ({ ...prev, fornecedores: mergeByFilial(prev.fornecedores, items, filialId) }))} />

      <Card title="Importar XML de NF-e de compra" subtitle="Lê o XML no seu navegador, cadastra fornecedor/produtos novos automaticamente e dá entrada no estoque.">
        <input type="file" accept=".xml,text/xml" onChange={handleXmlFile} style={{ fontSize: 12.5 }} />
        {xmlError && <div style={{ color: DANGER, fontSize: 12.5, marginTop: 10 }}>{xmlError}</div>}
        {xmlPreview && (
          <div style={{ marginTop: 14, background: BG, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 800, color: GREEN }}>NF-e nº {xmlPreview.numero} — {xmlPreview.fornecedor.nome}</div>
            <div style={{ fontSize: 11.5, color: MUTED, marginBottom: 8 }}>CNPJ {xmlPreview.fornecedor.cnpj || "não informado"} · Emissão {xmlPreview.dataEmissao} · Total {brl(xmlPreview.valorTotal)}</div>
            <Table
              columns={[
                { key: "nome", label: "Produto" },
                { key: "cfop", label: "CFOP" },
                { key: "qtd", label: "Qtd" },
                { key: "valorUnit", label: "Vlr. unit.", render: (r) => brl(r.valorUnit) },
                { key: "valorTotal", label: "Vlr. total", render: (r) => brl(r.valorTotal) },
              ]}
              rows={xmlPreview.itens}
            />
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <Button onClick={confirmarImportacaoXML}>Confirmar importação</Button>
              <Button variant="ghost" onClick={() => setXmlPreview(null)}>Descartar</Button>
            </div>
          </div>
        )}
      </Card>

      <Card title="Lançar compra manual" subtitle="Gera parcelas conforme a condição de pagamento e alimenta a DRE como despesa.">
        <form onSubmit={lancar} style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Fornecedor"><Select options={fornecedores.map((f) => ({ value: f.id, label: f.razaoSocial }))} value={form.fornecedorId} onChange={(e) => setForm({ ...form, fornecedorId: e.target.value })} /></Field>
          <Field label="Categoria">
            <Select options={[{ value: "insumo", label: "Insumo / Ração" }, { value: "administrativo", label: "Administrativo" }, { value: "manutencao", label: "Manutenção" }, { value: "outro", label: "Outro" }]} value={form.categoria} onChange={(e) => setForm({ ...form, categoria: e.target.value })} />
          </Field>
          <Field label="Descrição"><TextInput value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })} /></Field>
          <Field label="Valor (R$)"><TextInput type="number" step="0.01" value={form.valor} onChange={(e) => setForm({ ...form, valor: e.target.value })} /></Field>
          <Field label="Condição de pagamento"><Select options={CONDICOES_PAGAMENTO} value={form.condicaoPagamento} onChange={(e) => setForm({ ...form, condicaoPagamento: e.target.value })} /></Field>
          <Field label="Centro de custo"><Select options={centrosCusto.map((c) => ({ value: c.id, label: c.nome }))} value={form.centroCustoId} onChange={(e) => setForm({ ...form, centroCustoId: e.target.value })} /></Field>
          <Field label="Produto (dá entrada no estoque)"><Select options={produtos.map((p) => ({ value: p.id, label: `${p.nome} (${p.unidade})` }))} value={form.produtoId} onChange={(e) => setForm({ ...form, produtoId: e.target.value })} /></Field>
          <Field label="Quantidade recebida"><TextInput type="number" step="0.01" value={form.quantidade} onChange={(e) => setForm({ ...form, quantidade: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar compra</Button></div>
        </form>
      </Card>
      <Card title={`Compras lançadas (${compras.length})`}>
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "fornecedorId", label: "Fornecedor", render: (r) => nomeFornecedor(r.fornecedorId) },
            { key: "categoria", label: "Categoria", render: (r) => <span>{r.categoria}{r.origemXml && <><br /><span style={{ fontSize: 10, color: MUTED }}>via XML</span></>}</span> },
            { key: "descricao", label: "Descrição" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "parcelas", label: "Parcelas / pagamento", render: (r) => <ParcelasList parcelas={r.parcelas} onStatusChange={(pid, st) => atualizarParcela(r.id, pid, st)} /> },
          ]}
          rows={[...compras].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>
    </div>
  );
}

/* ---------------- Financeiro ---------------- */

function Financeiro({ db, update, filialId }) {
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const compras = db.compras.filter((c) => c.filialId === filialId);
  const fretes = db.fretes.filter((f) => f.filialId === filialId);
  const avulsas = db.contasAvulsas.filter((a) => a.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);

  const abertos = (s) => s !== "pago" && s !== "cancelado";

  // parcelas de vendas (a receber) e compras (a pagar), achatadas com referência ao documento de origem
  const parcelasReceber = vendas.flatMap((v) => (v.parcelas || []).map((p) => ({ ...p, origem: "Venda", data: v.data, ref: v.id })));
  const parcelasPagarCompras = compras.flatMap((c) => (c.parcelas || []).map((p) => ({ ...p, origem: c.descricao || "Compra", data: c.data, ref: c.id })));

  const totalReceber = parcelasReceber.filter((p) => abertos(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + avulsas.filter((a) => a.tipo === "receber" && abertos(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);
  const totalPagar = parcelasPagarCompras.filter((p) => abertos(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + fretes.filter((f) => abertos(f.statusPagamento)).reduce((s, f) => s + Number(f.valorFrete || 0), 0)
    + avulsas.filter((a) => a.tipo === "pagar" && abertos(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);

  function atualizarParcelaVenda(vendaId, parcelaId, status) {
    update((prev) => ({ ...prev, vendas: prev.vendas.map((v) => (v.id !== vendaId ? v : { ...v, parcelas: v.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })) }));
  }
  function atualizarParcelaCompra(compraId, parcelaId, status) {
    update((prev) => ({ ...prev, compras: prev.compras.map((c) => (c.id !== compraId ? c : { ...c, parcelas: c.parcelas.map((p) => (p.id === parcelaId ? { ...p, status } : p)) })) }));
  }
  function atualizarStatusFrete(freteId, status) {
    update((prev) => ({ ...prev, fretes: prev.fretes.map((f) => (f.id === freteId ? { ...f, statusPagamento: status } : f)) }));
  }
  function atualizarStatusAvulsa(id, status) {
    update((prev) => ({ ...prev, contasAvulsas: prev.contasAvulsas.map((a) => (a.id === id ? { ...a, status } : a)) }));
  }

  const [form, setForm] = useState({ tipo: "pagar", descricao: "", valor: "", vencimento: todayISO(), centroCustoId: "" });
  function lancarAvulsa(e) {
    e.preventDefault();
    update((prev) => ({ ...prev, contasAvulsas: [...prev.contasAvulsas, { id: uid(), filialId, ...form, valor: Number(form.valor), status: "pendente" }] }));
    setForm({ tipo: "pagar", descricao: "", valor: "", vencimento: todayISO(), centroCustoId: "" });
  }
  function removerAvulsa(a) {
    update((prev) => ({ ...prev, contasAvulsas: prev.contasAvulsas.filter((x) => x.id !== a.id) }));
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14 }}>
        <StatCard label="Total a receber" value={brl(totalReceber)} accent={GOLD} />
        <StatCard label="Total a pagar" value={brl(totalPagar)} accent={DANGER} />
        <StatCard label="Saldo projetado" value={brl(totalReceber - totalPagar)} accent={GREEN} />
      </div>

      <div style={{ background: "#EDE7F6", border: "1px solid #C9B8E8", borderRadius: 10, padding: "10px 14px", fontSize: 12, color: "#4A3A70" }}>
        Os status "Faturado", "Pago" e "Em reconciliação" são atualizados manualmente aqui ou nos módulos de origem. Uma conciliação bancária automática via API do banco não está incluída neste protótipo — isso exigiria credenciais e integração real com a instituição financeira.
      </div>

      <Card title="Lançar conta avulsa" subtitle="Para lançamentos de contas a pagar ou a receber que não vêm de uma venda ou compra.">
        <form onSubmit={lancarAvulsa} style={{ display: "grid", gridTemplateColumns: "1fr 2fr 1fr 1fr 1fr", gap: 10, alignItems: "end" }}>
          <Field label="Tipo"><Select options={[{ value: "pagar", label: "Conta a pagar" }, { value: "receber", label: "Conta a receber" }]} value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })} /></Field>
          <Field label="Descrição"><TextInput value={form.descricao} onChange={(e) => setForm({ ...form, descricao: e.target.value })} /></Field>
          <Field label="Valor (R$)"><TextInput type="number" step="0.01" value={form.valor} onChange={(e) => setForm({ ...form, valor: e.target.value })} /></Field>
          <Field label="Vencimento"><TextInput type="date" value={form.vencimento} onChange={(e) => setForm({ ...form, vencimento: e.target.value })} /></Field>
          <Field label="Centro de custo"><Select options={centrosCusto.map((c) => ({ value: c.id, label: c.nome }))} value={form.centroCustoId} onChange={(e) => setForm({ ...form, centroCustoId: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar</Button></div>
        </form>
      </Card>
      <Card title={`Contas avulsas (${avulsas.length})`}>
        <Table
          columns={[
            { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "pagar" ? "A pagar" : "A receber") },
            { key: "descricao", label: "Descrição" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "vencimento", label: "Vencimento" },
            { key: "status", label: "Status", render: (r) => <StatusSelect status={r.status} onChange={(v) => atualizarStatusAvulsa(r.id, v)} /> },
          ]}
          rows={avulsas}
          onDelete={removerAvulsa}
        />
      </Card>

      <Card title="Contas a receber — parcelas de vendas">
        <Table
          columns={[
            { key: "data", label: "Data da venda" },
            { key: "numero", label: "Parcela", render: (r) => `${r.numero}/${r.de}` },
            { key: "vencimento", label: "Vencimento" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "status", label: "Status", render: (r) => <StatusSelect status={r.status} onChange={(v) => atualizarParcelaVenda(r.ref, r.id, v)} /> },
          ]}
          rows={parcelasReceber}
          emptyText="Nenhuma parcela de venda lançada ainda."
        />
      </Card>
      <Card title="Contas a pagar — parcelas de compras">
        <Table
          columns={[
            { key: "origem", label: "Compra" },
            { key: "numero", label: "Parcela", render: (r) => `${r.numero}/${r.de}` },
            { key: "vencimento", label: "Vencimento" },
            { key: "valor", label: "Valor", render: (r) => brl(r.valor) },
            { key: "status", label: "Status", render: (r) => <StatusSelect status={r.status} onChange={(v) => atualizarParcelaCompra(r.ref, r.id, v)} /> },
          ]}
          rows={parcelasPagarCompras}
          emptyText="Nenhuma parcela de compra lançada ainda."
        />
      </Card>
      <Card title="Contas a pagar — fretes">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "destino", label: "Destino" },
            { key: "valorFrete", label: "Valor", render: (r) => brl(r.valorFrete) },
            { key: "statusPagamento", label: "Status", render: (r) => <StatusSelect status={r.statusPagamento} onChange={(v) => atualizarStatusFrete(r.id, v)} /> },
          ]}
          rows={fretes}
          emptyText="Nenhum frete lançado ainda."
        />
      </Card>
    </div>
  );
}

/* ---------------- Contabilidade: DRE + Balanço ---------------- */

function Contabilidade({ db, filialId }) {
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const compras = db.compras.filter((c) => c.filialId === filialId);
  const fretes = db.fretes.filter((f) => f.filialId === filialId);
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const avulsas = db.contasAvulsas.filter((a) => a.filialId === filialId);
  const centrosCusto = db.centrosCusto.filter((c) => c.filialId === filialId);
  const aberto = (s) => s !== "pago" && s !== "cancelado";

  const receitaBruta = vendas.reduce((s, v) => s + Number(v.total || 0), 0);
  const comissoes = vendas.reduce((s, v) => s + Number(v.comissaoValor || 0) + Number(v.comissaoGerenteValor || 0), 0);
  const custoInsumos = compras.filter((c) => c.categoria === "insumo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasAdm = compras.filter((c) => c.categoria === "administrativo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const manutencao = compras.filter((c) => c.categoria === "manutencao").reduce((s, c) => s + Number(c.valor || 0), 0);
  const outrasCompras = compras.filter((c) => !["insumo", "administrativo", "manutencao"].includes(c.categoria)).reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasFrete = fretes.reduce((s, f) => s + Number(f.valorFrete || 0), 0);
  const receitasAvulsas = avulsas.filter((a) => a.tipo === "receber").reduce((s, a) => s + Number(a.valor || 0), 0);
  const despesasAvulsas = avulsas.filter((a) => a.tipo === "pagar").reduce((s, a) => s + Number(a.valor || 0), 0);

  const totalReceitas = receitaBruta + receitasAvulsas;
  const totalDespesas = comissoes + custoInsumos + despesasAdm + manutencao + outrasCompras + despesasFrete + despesasAvulsas;
  const resultadoLiquido = totalReceitas - totalDespesas;

  const caixa = totalReceitas - totalDespesas; // simplificado: regime de caixa acumulado
  const contasReceber = vendas.flatMap((v) => v.parcelas || []).filter((p) => aberto(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + avulsas.filter((a) => a.tipo === "receber" && aberto(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);
  const estoqueValor = produtos.reduce((s, p) => s + Number(p.custoUnit || 0) * 0, 0); // sem contagem física neste protótipo
  const ativoTotal = caixa + contasReceber + estoqueValor;
  const contasPagar = compras.flatMap((c) => c.parcelas || []).filter((p) => aberto(p.status)).reduce((s, p) => s + Number(p.valor || 0), 0)
    + fretes.filter((f) => aberto(f.statusPagamento)).reduce((s, f) => s + Number(f.valorFrete || 0), 0)
    + avulsas.filter((a) => a.tipo === "pagar" && aberto(a.status)).reduce((s, a) => s + Number(a.valor || 0), 0);
  const patrimonioLiquido = ativoTotal - contasPagar;

  const resultadoPorCentro = centrosCusto.map((cc) => {
    const rec = vendas.filter((v) => v.centroCustoId === cc.id).reduce((s, v) => s + Number(v.total || 0), 0);
    const desp = compras.filter((c) => c.centroCustoId === cc.id).reduce((s, c) => s + Number(c.valor || 0), 0)
      + avulsas.filter((a) => a.centroCustoId === cc.id).reduce((s, a) => s + (a.tipo === "pagar" ? Number(a.valor || 0) : -Number(a.valor || 0)), 0);
    return { ...cc, receita: rec, despesa: desp, resultado: rec - desp };
  });

  const linha = (label, valor, bold, indent) => (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${BORDER}`, fontWeight: bold ? 800 : 500, paddingLeft: indent ? 16 : 0, color: bold ? GREEN : INK, fontSize: bold ? 14 : 13 }}>
      <span>{label}</span><span>{brl(valor)}</span>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#FBF3DC", border: `1px solid ${GOLD_LIGHT}`, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, color: "#6B5410" }}>
        Demonstrações calculadas automaticamente a partir dos lançamentos de Vendas, Compras, Logística e Contas Avulsas desta filial — regime de caixa simplificado, para fins gerenciais. Não substitui a escrituração contábil oficial.
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Card title="DRE — Demonstrativo de Resultado">
          {linha("Receita bruta de vendas", receitaBruta)}
          {linha("(+) Receitas avulsas", receitasAvulsas, false, true)}
          {linha("(-) Comissões (vendedor + gerente)", -comissoes, false, true)}
          {linha("(-) Insumos e ração", -custoInsumos, false, true)}
          {linha("(-) Despesas administrativas", -despesasAdm, false, true)}
          {linha("(-) Manutenção", -manutencao, false, true)}
          {linha("(-) Fretes e logística", -despesasFrete, false, true)}
          {linha("(-) Outras despesas de compra", -outrasCompras, false, true)}
          {linha("(-) Despesas avulsas", -despesasAvulsas, false, true)}
          <div style={{ marginTop: 8 }}>{linha("Resultado líquido do período", resultadoLiquido, true)}</div>
        </Card>
        <Card title="Balanço Patrimonial (simplificado)">
          <div style={{ fontSize: 12.5, fontWeight: 800, color: MUTED, marginTop: 4 }}>ATIVO</div>
          {linha("Caixa (acumulado)", caixa, false, true)}
          {linha("Contas a receber (parcelas em aberto)", contasReceber, false, true)}
          {linha("Estoques", estoqueValor, false, true)}
          {linha("Total do ativo", ativoTotal, true)}
          <div style={{ fontSize: 12.5, fontWeight: 800, color: MUTED, marginTop: 14 }}>PASSIVO + PATRIMÔNIO LÍQUIDO</div>
          {linha("Contas a pagar (parcelas em aberto)", contasPagar, false, true)}
          {linha("Patrimônio líquido", patrimonioLiquido, false, true)}
          {linha("Total passivo + PL", contasPagar + patrimonioLiquido, true)}
        </Card>
      </div>
      {!!resultadoPorCentro.length && (
        <Card title="Resultado por Centro de Custo">
          <Table
            columns={[
              { key: "nome", label: "Centro de custo" },
              { key: "receita", label: "Receita", render: (r) => brl(r.receita) },
              { key: "despesa", label: "Despesa", render: (r) => brl(r.despesa) },
              { key: "resultado", label: "Resultado", render: (r) => brl(r.resultado) },
            ]}
            rows={resultadoPorCentro}
          />
        </Card>
      )}
    </div>
  );
}

/* ---------------- Logística ---------------- */

function Logistica({ db, update, filialId }) {
  const motoristas = db.motoristas.filter((m) => m.filialId === filialId);
  const veiculos = db.veiculos.filter((v) => v.filialId === filialId);
  const fretes = db.fretes.filter((f) => f.filialId === filialId);
  const [form, setForm] = useState({ data: todayISO(), motoristaId: "", veiculoId: "", destino: "", valorFrete: "" });

  function lancar(e) {
    e.preventDefault();
    update((prev) => ({ ...prev, fretes: [...prev.fretes, { id: uid(), filialId, ...form, valorFrete: Number(form.valorFrete), statusPagamento: "pendente" }] }));
    setForm({ data: todayISO(), motoristaId: "", veiculoId: "", destino: "", valorFrete: "" });
  }

  function atualizarStatus(f, status) {
    update((prev) => ({ ...prev, fretes: prev.fretes.map((x) => (x.id === f.id ? { ...x, statusPagamento: status } : x)) }));
  }

  const nomeMotorista = (id) => motoristas.find((m) => m.id === id)?.nome || "—";
  const nomeVeiculo = (id) => veiculos.find((v) => v.id === id)?.placa || "—";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <CrudBlock title="Motoristas" filialId={filialId} items={motoristas} onChange={(items) => update((prev) => ({ ...prev, motoristas: mergeByFilial(prev.motoristas, items, filialId) }))}
          fields={[{ key: "nome", label: "Nome", required: true }, { key: "cnh", label: "CNH" }]} />
        <CrudBlock title="Veículos" filialId={filialId} items={veiculos} onChange={(items) => update((prev) => ({ ...prev, veiculos: mergeByFilial(prev.veiculos, items, filialId) }))}
          fields={[{ key: "placa", label: "Placa", required: true }, { key: "modelo", label: "Modelo" }]} />
      </div>
      <Card title="Lançar frete" subtitle="Gera uma conta a pagar e entra como despesa de logística na DRE.">
        <form onSubmit={lancar} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr", gap: 10, alignItems: "end" }}>
          <Field label="Data"><TextInput type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value })} /></Field>
          <Field label="Motorista"><Select options={motoristas.map((m) => ({ value: m.id, label: m.nome }))} value={form.motoristaId} onChange={(e) => setForm({ ...form, motoristaId: e.target.value })} /></Field>
          <Field label="Veículo"><Select options={veiculos.map((v) => ({ value: v.id, label: v.placa }))} value={form.veiculoId} onChange={(e) => setForm({ ...form, veiculoId: e.target.value })} /></Field>
          <Field label="Destino"><TextInput value={form.destino} onChange={(e) => setForm({ ...form, destino: e.target.value })} /></Field>
          <Field label="Valor (R$)"><TextInput type="number" step="0.01" value={form.valorFrete} onChange={(e) => setForm({ ...form, valorFrete: e.target.value })} /></Field>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit">Lançar frete</Button></div>
        </form>
      </Card>
      <Card title={`Fretes lançados (${fretes.length})`}>
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "motoristaId", label: "Motorista", render: (r) => nomeMotorista(r.motoristaId) },
            { key: "veiculoId", label: "Veículo", render: (r) => nomeVeiculo(r.veiculoId) },
            { key: "destino", label: "Destino" },
            { key: "valorFrete", label: "Valor", render: (r) => brl(r.valorFrete) },
            { key: "statusPagamento", label: "Pagamento", render: (r) => <StatusSelect status={r.statusPagamento} onChange={(v) => atualizarStatus(r, v)} /> },
          ]}
          rows={[...fretes].sort((a, b) => (a.data < b.data ? 1 : -1))}
        />
      </Card>
    </div>
  );
}

/* ---------------- Fiscal (NFe / SPED) — módulo ilustrativo ---------------- */

function Fiscal({ db, update, filialId }) {
  const vendas = db.vendas.filter((v) => v.filialId === filialId);
  const emitidas = vendas.filter((v) => v.nfe && v.nfe.status === "autorizada");
  const canceladas = vendas.filter((v) => v.nfe && v.nfe.status === "cancelada");
  const naoEmitidas = vendas.filter((v) => !v.nfe);
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const clientes = db.clientes.filter((c) => c.filialId === filialId);
  const empresa = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
  const filial = empresa?.filiais.find((f) => f.id === filialId);
  const [danfeVenda, setDanfeVenda] = useState(null);
  const [spedPreview, setSpedPreview] = useState(null); // { tipo, conteudo }

  function emitirNFe(venda) {
    update((prev) => ({ ...prev, vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { status: "autorizada", chave: gerarChaveAcessoFake(), protocolo: gerarProtocoloFake(), dataEmissao: todayISO(), ambiente: "homologacao" } })) }));
  }
  function cancelarNFe(venda) {
    const justificativa = window.prompt("Justificativa do cancelamento (mínimo 15 caracteres):");
    if (!justificativa || justificativa.trim().length < 15) { alert("Cancelamento não realizado: informe uma justificativa com pelo menos 15 caracteres."); return; }
    update((prev) => ({ ...prev, vendas: prev.vendas.map((v) => (v.id !== venda.id ? v : { ...v, nfe: { ...v.nfe, status: "cancelada", dataCancelamento: todayISO(), justificativaCancelamento: justificativa } })) }));
  }
  function consultarNFe(venda) {
    alert(`Consulta simulada — ambiente de HOMOLOGAÇÃO, sem conexão real com a SEFAZ.\n\nStatus: ${venda.nfe.status}\nChave de acesso: ${venda.nfe.chave}\nProtocolo: ${venda.nfe.protocolo}`);
  }

  function verSpedFiscal() {
    setSpedPreview({ tipo: "SPED Fiscal (EFD ICMS/IPI)", conteudo: gerarSpedFiscal(db, filialId, empresa), nomeArquivo: `SPED_FISCAL_HOMOLOGACAO_${filialId.slice(0, 6)}.txt` });
  }
  function verSpedContabil() {
    setSpedPreview({ tipo: "SPED Contábil (ECD)", conteudo: gerarSpedContabil(db, filialId, empresa), nomeArquivo: `SPED_CONTABIL_HOMOLOGACAO_${filialId.slice(0, 6)}.txt` });
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: GOLD, color: GREEN_DARK, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, fontWeight: 800, textAlign: "center" }}>
        AMBIENTE DE HOMOLOGAÇÃO — nenhuma nota fiscal ou arquivo SPED aqui é transmitido à Receita/SEFAZ de verdade
      </div>
      <div style={{ background: "#FBEAE4", border: `1px solid ${DANGER}55`, borderRadius: 10, padding: "12px 14px", fontSize: 12.5, color: "#7A2E1B" }}>
        <b>Importante:</b> a emissão real de NF-e e a entrega válida de SPED exigem certificado digital (A1/A3), credenciamento junto à SEFAZ/Receita e, no caso do SPED, assinatura digital do arquivo. O que este módulo gera são arquivos com a <b>estrutura de blocos e layout reais</b> (registros |0000|, |C100|, |I050| etc.), preenchidos com os seus lançamentos, para você validar o fluxo — não são arquivos assinados nem válidos para entrega oficial.
      </div>

      <div style={{ display: "flex", gap: 14 }}>
        <StatCard label="Autorizadas (homolog.)" value={emitidas.length} accent={SUCCESS} />
        <StatCard label="Canceladas" value={canceladas.length} accent={DANGER} />
        <StatCard label="Aguardando emissão" value={naoEmitidas.length} accent={GOLD} />
      </div>

      <Card title="Notas fiscais por venda" subtitle="Emita, cancele, consulte o status simulado, ou visualize o DANFE de cada venda.">
        <Table
          columns={[
            { key: "data", label: "Data" },
            { key: "total", label: "Valor", render: (r) => brl(r.total) },
            { key: "chave", label: "Chave de acesso", render: (r) => r.nfe ? <span style={{ fontFamily: "monospace", fontSize: 10.5 }}>{r.nfe.chave}</span> : "—" },
            { key: "status", label: "Status", render: (r) => r.nfe ? <StatusBadge status={r.nfe.status === "autorizada" ? "pago" : "cancelado"} /> : <span style={{ fontSize: 11, color: MUTED }}>Não emitida</span> },
            {
              key: "acoes", label: "Ações", render: (r) => (
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  {!r.nfe && <button onClick={() => emitirNFe(r)} style={linkBtnStyle(GREEN)}>emitir</button>}
                  {r.nfe && r.nfe.status !== "cancelada" && <button onClick={() => cancelarNFe(r)} style={linkBtnStyle(DANGER)}>cancelar</button>}
                  {r.nfe && <button onClick={() => consultarNFe(r)} style={linkBtnStyle(MUTED)}>consultar status</button>}
                  {r.nfe && <button onClick={() => setDanfeVenda(r)} style={linkBtnStyle(GOLD)}>ver DANFE</button>}
                </div>
              ),
            },
          ]}
          rows={[...vendas].sort((a, b) => (a.data < b.data ? 1 : -1))}
          emptyText="Nenhuma venda lançada ainda."
        />
      </Card>

      <Card title="SPED Fiscal / Contábil" subtitle="Gera o arquivo com o layout real de blocos, preenchido com os lançamentos desta filial — ambiente de homologação.">
        <div style={{ display: "flex", gap: 10 }}>
          <Button onClick={verSpedFiscal}>Gerar SPED Fiscal (homologação)</Button>
          <Button onClick={verSpedContabil}>Gerar SPED Contábil (homologação)</Button>
        </div>
      </Card>

      {danfeVenda && (
        <Modal title="DANFE — Ambiente de Homologação" onClose={() => setDanfeVenda(null)} wide>
          <Danfe venda={danfeVenda} empresa={empresa} filial={filial} cliente={clientes.find((c) => c.id === danfeVenda.clienteId)} produtos={produtos} />
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Button onClick={() => window.print()}>Imprimir / Salvar como PDF</Button>
            <Button variant="ghost" onClick={() => setDanfeVenda(null)}>Fechar</Button>
          </div>
        </Modal>
      )}

      {spedPreview && (
        <Modal title={spedPreview.tipo + " — prévia do arquivo"} onClose={() => setSpedPreview(null)} wide>
          <div style={{ fontSize: 11.5, color: MUTED, marginBottom: 8 }}>{spedPreview.conteudo.split("\r\n").length} registros gerados. Confira antes de baixar.</div>
          <div style={{ fontFamily: "monospace", fontSize: 10.5, background: GREEN_DARK, color: "#D7E3DC", padding: 14, borderRadius: 8, overflow: "auto", whiteSpace: "pre", maxHeight: "50vh" }}>
            {spedPreview.conteudo}
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Button onClick={() => downloadTextFile(spedPreview.nomeArquivo, spedPreview.conteudo)}>Baixar arquivo .txt</Button>
            <Button variant="ghost" onClick={() => setSpedPreview(null)}>Fechar</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- Folha de Pagamento ---------------- */

function FolhaPagamento({ db, update, filialId }) {
  const funcionarios = db.funcionarios.filter((f) => f.filialId === filialId);
  const ativos = funcionarios.filter((f) => f.ativo !== false && f.ativo !== "false");

  const folhaBruta = ativos.reduce((s, f) => s + Number(f.salarioBruto || 0), 0);
  const encargosTotal = ativos.reduce((s, f) => s + (Number(f.salarioBruto || 0) * Number(f.encargosPercentual || 0)) / 100, 0);
  const beneficiosTotal = ativos.reduce((s, f) => s + Number(f.beneficios || 0), 0);
  const folhaTotalMensal = folhaBruta + encargosTotal + beneficiosTotal;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Salários brutos" value={brl(folhaBruta)} accent={GREEN} />
        <StatCard label="Encargos" value={brl(encargosTotal)} accent={GOLD} />
        <StatCard label="Benefícios" value={brl(beneficiosTotal)} accent={MUTED} />
        <StatCard label="Folha total / mês" value={brl(folhaTotalMensal)} accent={DANGER} />
      </div>
      <CrudBlock
        title="Funcionários"
        subtitle="Encargos em % sobre o salário bruto (INSS patronal, FGTS, 13º/férias provisionados etc.). Colaboradores inativos não entram nos totais acima."
        filialId={filialId}
        items={funcionarios}
        onChange={(items) => update((prev) => ({ ...prev, funcionarios: mergeByFilial(prev.funcionarios, items, filialId) }))}
        fields={[
          { key: "nome", label: "Nome", required: true },
          { key: "cargo", label: "Cargo" },
          { key: "salarioBruto", label: "Salário bruto (R$)", type: "number" },
          { key: "encargosPercentual", label: "Encargos (%)", type: "number" },
          { key: "beneficios", label: "Benefícios (R$)", type: "number" },
          { key: "ativo", label: "Situação", type: "select", options: [{ value: "true", label: "Ativo" }, { value: "false", label: "Inativo" }] },
        ]}
        columns={[
          { key: "nome", label: "Nome" },
          { key: "cargo", label: "Cargo" },
          { key: "salarioBruto", label: "Bruto", render: (r) => brl(r.salarioBruto) },
          { key: "encargosPercentual", label: "Encargos", render: (r) => `${r.encargosPercentual || 0}%` },
          { key: "beneficios", label: "Benefícios", render: (r) => brl(r.beneficios) },
          { key: "ativo", label: "Situação", render: (r) => (r.ativo === false || r.ativo === "false" ? "Inativo" : "Ativo") },
        ]}
      />
    </div>
  );
}

/* ---------------- Relatório Gerencial ---------------- */

function RelatorioGerencial({ db, update, filialId }) {
  const vendasAll = db.vendas.filter((v) => v.filialId === filialId);
  const comprasAll = db.compras.filter((c) => c.filialId === filialId);
  const fretesAll = db.fretes.filter((f) => f.filialId === filialId);
  const avulsasAll = db.contasAvulsas.filter((a) => a.filialId === filialId);
  const funcionarios = db.funcionarios.filter((f) => f.filialId === filialId && f.ativo !== false && f.ativo !== "false");
  const vendedores = db.vendedores.filter((v) => v.filialId === filialId);

  const configSalva = db.configsGerenciais.find((c) => c.filialId === filialId) || { investimentoTotal: 0, aliquotaImposto: 34 };
  const [config, setConfig] = useState({ investimentoTotal: configSalva.investimentoTotal || "", aliquotaImposto: configSalva.aliquotaImposto ?? 34 });
  const [periodo, setPeriodo] = useState({ de: primeiroDiaDoMes(), ate: todayISO() });

  function salvarConfig() {
    update((prev) => ({ ...prev, configsGerenciais: [...prev.configsGerenciais.filter((c) => c.filialId !== filialId), { filialId, investimentoTotal: Number(config.investimentoTotal) || 0, aliquotaImposto: Number(config.aliquotaImposto) || 0 }] }));
  }

  const dentroPeriodo = (dataISO) => !!dataISO && dataISO >= periodo.de && dataISO <= periodo.ate;
  const nMeses = mesesNoPeriodo(periodo.de, periodo.ate);

  const vendas = vendasAll.filter((v) => dentroPeriodo(v.data));
  const compras = comprasAll.filter((c) => dentroPeriodo(c.data));
  const fretes = fretesAll.filter((f) => dentroPeriodo(f.data));
  const avulsasPeriodo = avulsasAll.filter((a) => dentroPeriodo(a.vencimento));

  const receitaVendas = vendas.reduce((s, v) => s + Number(v.total || 0), 0);
  const receitasAvulsas = avulsasPeriodo.filter((a) => a.tipo === "receber").reduce((s, a) => s + Number(a.valor || 0), 0);
  const receitaTotal = receitaVendas + receitasAvulsas;

  const comissoes = vendas.reduce((s, v) => s + Number(v.comissaoValor || 0) + Number(v.comissaoGerenteValor || 0), 0);
  const custoInsumos = compras.filter((c) => c.categoria === "insumo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasAdm = compras.filter((c) => c.categoria === "administrativo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const manutencao = compras.filter((c) => c.categoria === "manutencao").reduce((s, c) => s + Number(c.valor || 0), 0);
  const outrasCompras = compras.filter((c) => !["insumo", "administrativo", "manutencao"].includes(c.categoria)).reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasFrete = fretes.reduce((s, f) => s + Number(f.valorFrete || 0), 0);
  const despesasAvulsas = avulsasPeriodo.filter((a) => a.tipo === "pagar").reduce((s, a) => s + Number(a.valor || 0), 0);

  const folhaMensal = funcionarios.reduce((s, f) => s + Number(f.salarioBruto || 0) + (Number(f.salarioBruto || 0) * Number(f.encargosPercentual || 0)) / 100 + Number(f.beneficios || 0), 0);
  const folhaPeriodo = folhaMensal * nMeses;

  const custosOperacionais = custoInsumos + despesasAdm + manutencao + outrasCompras + despesasFrete + comissoes + despesasAvulsas + folhaPeriodo;
  const ebitda = receitaTotal - custosOperacionais;
  const margemEbitda = receitaTotal > 0 ? (ebitda / receitaTotal) * 100 : 0;
  const impostoEstimado = ebitda > 0 ? ebitda * (Number(config.aliquotaImposto || 0) / 100) : 0;
  const lucroLiquido = ebitda - impostoEstimado;

  const investimento = Number(config.investimentoTotal) || 0;
  const roi = investimento > 0 ? (lucroLiquido / investimento) * 100 : null;
  const lucroMedioMensal = lucroLiquido / nMeses;
  const paybackMeses = investimento > 0 && lucroMedioMensal > 0 ? investimento / lucroMedioMensal : null;

  // Fluxo de caixa projetado (por vencimento das parcelas, todo o histórico dentro do período de meses)
  const meses = listaDeMeses(periodo.de, periodo.ate);
  let acumulado = 0;
  const fluxo = meses.map((mes) => {
    const entradasVendas = vendasAll.flatMap((v) => v.parcelas || []).filter((p) => p.vencimento && p.vencimento.startsWith(mes)).reduce((s, p) => s + Number(p.valor || 0), 0);
    const entradasAvulsas = avulsasAll.filter((a) => a.tipo === "receber" && a.vencimento && a.vencimento.startsWith(mes)).reduce((s, a) => s + Number(a.valor || 0), 0);
    const saidasCompras = comprasAll.flatMap((c) => c.parcelas || []).filter((p) => p.vencimento && p.vencimento.startsWith(mes)).reduce((s, p) => s + Number(p.valor || 0), 0);
    const saidasFretes = fretesAll.filter((f) => f.data && f.data.startsWith(mes)).reduce((s, f) => s + Number(f.valorFrete || 0), 0);
    const saidasAvulsas = avulsasAll.filter((a) => a.tipo === "pagar" && a.vencimento && a.vencimento.startsWith(mes)).reduce((s, a) => s + Number(a.valor || 0), 0);
    const entradas = entradasVendas + entradasAvulsas;
    const saidas = saidasCompras + saidasFretes + saidasAvulsas + folhaMensal;
    const saldo = entradas - saidas;
    acumulado += saldo;
    return { mes, entradas, saidas, saldo, acumulado };
  });

  const comissoesPorVendedor = vendedores.map((vend) => {
    const proprias = vendasAll.filter((v) => v.vendedorId === vend.id && dentroPeriodo(v.data));
    const comoGerente = vendasAll.filter((v) => v.gerenteComercialId === vend.id && dentroPeriodo(v.data));
    const comissaoPropria = proprias.reduce((s, v) => s + Number(v.comissaoValor || 0), 0);
    const comissaoGerente = comoGerente.reduce((s, v) => s + Number(v.comissaoGerenteValor || 0), 0);
    return { ...vend, totalVendido: proprias.reduce((s, v) => s + Number(v.total || 0), 0), comissaoPropria, comissaoGerente, comissaoTotal: comissaoPropria + comissaoGerente };
  }).filter((v) => v.totalVendido > 0 || v.comissaoTotal > 0);

  const linha = (label, valor, bold, indent) => (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${BORDER}`, fontWeight: bold ? 800 : 500, paddingLeft: indent ? 16 : 0, color: bold ? GREEN : INK, fontSize: bold ? 14 : 13 }}>
      <span>{label}</span><span>{brl(valor)}</span>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#FBF3DC", border: `1px solid ${GOLD_LIGHT}`, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, color: "#6B5410" }}>
        Relatório calculado a partir dos lançamentos reais desta filial no período selecionado. Impostos, ROI e payback são estimativas gerenciais simplificadas (sem compensação de prejuízo fiscal, sem a trava legal de 30%, sem depreciação de ativos) — para uma apuração tributária real, consulte seu contador.
      </div>

      <Card title="Período do relatório">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="De"><TextInput type="date" value={periodo.de} onChange={(e) => setPeriodo({ ...periodo, de: e.target.value })} /></Field>
          <Field label="Até"><TextInput type="date" value={periodo.ate} onChange={(e) => setPeriodo({ ...periodo, ate: e.target.value })} /></Field>
          <div style={{ fontSize: 12, color: MUTED, paddingBottom: 8 }}>{nMeses} mês(es) considerado(s) — a folha de pagamento é multiplicada por esse número de meses.</div>
        </div>
      </Card>

      <Card title="Parâmetros para ROI, payback e impostos">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="Investimento total (R$)"><TextInput type="number" step="0.01" value={config.investimentoTotal} onChange={(e) => setConfig({ ...config, investimentoTotal: e.target.value })} /></Field>
          <Field label="Alíquota de imposto sobre o lucro (%)"><TextInput type="number" step="0.1" value={config.aliquotaImposto} onChange={(e) => setConfig({ ...config, aliquotaImposto: e.target.value })} /></Field>
          <Button onClick={salvarConfig}>Salvar parâmetros</Button>
        </div>
      </Card>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Receita no período" value={brl(receitaTotal)} accent={GREEN} />
        <StatCard label="EBITDA" value={brl(ebitda)} accent={GOLD} />
        <StatCard label="Margem EBITDA" value={`${margemEbitda.toFixed(1)}%`} accent={MUTED} />
        <StatCard label="Impostos estimados" value={brl(impostoEstimado)} accent={DANGER} />
        <StatCard label="Lucro líquido estimado" value={brl(lucroLiquido)} accent={GREEN} />
        <StatCard label="Folha de pagamento (período)" value={brl(folhaPeriodo)} accent={MUTED} />
        <StatCard label="ROI no período" value={roi === null ? "—" : `${roi.toFixed(1)}%`} accent={GOLD} />
        <StatCard label="Payback estimado" value={paybackMeses === null ? "—" : `${paybackMeses.toFixed(1)} meses`} accent={DANGER} />
      </div>

      <Card title="EBITDA — Demonstrativo gerencial">
        {linha("Receita de vendas", receitaVendas)}
        {linha("(+) Receitas avulsas", receitasAvulsas, false, true)}
        {linha("(-) Comissões (vendedor + gerente)", -comissoes, false, true)}
        {linha("(-) Insumos e ração", -custoInsumos, false, true)}
        {linha("(-) Despesas administrativas", -despesasAdm, false, true)}
        {linha("(-) Manutenção", -manutencao, false, true)}
        {linha("(-) Fretes e logística", -despesasFrete, false, true)}
        {linha("(-) Outras despesas de compra", -outrasCompras, false, true)}
        {linha("(-) Despesas avulsas", -despesasAvulsas, false, true)}
        {linha("(-) Folha de pagamento", -folhaPeriodo, false, true)}
        <div style={{ marginTop: 6 }}>{linha("EBITDA", ebitda, true)}</div>
        {linha(`(-) Impostos estimados (${config.aliquotaImposto || 0}% sobre o lucro)`, -impostoEstimado, false, true)}
        <div style={{ marginTop: 6 }}>{linha("Lucro líquido estimado", lucroLiquido, true)}</div>
      </Card>

      <Card title="Fluxo de caixa projetado" subtitle="Entradas e saídas por mês de vencimento das parcelas — folha de pagamento tratada como custo fixo mensal.">
        <Table
          columns={[
            { key: "mes", label: "Mês", render: (r) => nomeMes(r.mes) },
            { key: "entradas", label: "Entradas", render: (r) => brl(r.entradas) },
            { key: "saidas", label: "Saídas", render: (r) => brl(r.saidas) },
            { key: "saldo", label: "Saldo do mês", render: (r) => brl(r.saldo) },
            { key: "acumulado", label: "Saldo acumulado", render: (r) => brl(r.acumulado) },
          ]}
          rows={fluxo}
        />
      </Card>

      <Card title="Relatório de comissões" subtitle="Comissão própria (como vendedor) e comissão como gerente comercial, dentro do período selecionado.">
        <Table
          columns={[
            { key: "nome", label: "Vendedor", render: (r) => r.apelido || r.nomeCompleto },
            { key: "totalVendido", label: "Total vendido", render: (r) => brl(r.totalVendido) },
            { key: "comissaoPropria", label: "Comissão própria", render: (r) => brl(r.comissaoPropria) },
            { key: "comissaoGerente", label: "Comissão como gerente", render: (r) => brl(r.comissaoGerente) },
            { key: "comissaoTotal", label: "Total a pagar", render: (r) => brl(r.comissaoTotal) },
          ]}
          rows={comissoesPorVendedor}
          emptyText="Nenhuma venda com comissão neste período."
        />
      </Card>
    </div>
  );
}

/* ---------------- Produção Avícola ---------------- */

function ProducaoAvicola({ db, update, filialId }) {
  const galpoes = db.galpoes.filter((g) => g.filialId === filialId);
  const lotes = db.lotesAves.filter((l) => l.filialId === filialId);
  const posturas = db.registrosPostura.filter((p) => p.filialId === filialId);
  const mortalidades = db.registrosMortalidade.filter((m) => m.filialId === filialId);
  const estercos = db.registrosEsterco.filter((e) => e.filialId === filialId);
  const producoesRacao = db.producoesRacao.filter((p) => p.filialId === filialId);
  const [tempoCriaRecria, setTempoCriaRecria] = useState(120);

  const mortesDoLote = (loteId) => mortalidades.filter((m) => m.loteId === loteId).reduce((s, m) => s + Number(m.avesMortas || 0), 0);
  const quantidadeAtual = (lote) => Math.max(0, Number(lote.quantidadeAlojada || 0) - mortesDoLote(lote.id));

  const totalAvesVivas = lotes.reduce((s, l) => s + quantidadeAtual(l), 0);
  const custoRacaoTotal = producoesRacao.reduce((s, p) => s + Number(p.custoTotal || 0), 0);
  const custoPorAve = totalAvesVivas > 0 ? custoRacaoTotal / totalAvesVivas : 0;

  const hoje = todayISO();
  const ha30dias = new Date(new Date(hoje + "T00:00:00").getTime() - 30 * 86400000).toISOString().slice(0, 10);
  const ovosHoje = posturas.filter((p) => p.data === hoje).reduce((s, p) => s + Number(p.ovosProduzidos || 0), 0);
  const ovos30dias = posturas.filter((p) => p.data >= ha30dias).reduce((s, p) => s + Number(p.ovosProduzidos || 0), 0);
  const quebras30dias = posturas.filter((p) => p.data >= ha30dias).reduce((s, p) => s + Number(p.ovosQuebrados || 0), 0);
  const mortes30dias = mortalidades.filter((m) => m.data >= ha30dias).reduce((s, m) => s + Number(m.avesMortas || 0), 0);
  const taxaQuebra = ovos30dias > 0 ? (quebras30dias / ovos30dias) * 100 : 0;

  const estercoProduzido = estercos.filter((e) => e.tipo === "producao").reduce((s, e) => s + Number(e.quantidadeTon || 0), 0);
  const estercoVendidoTon = estercos.filter((e) => e.tipo === "venda").reduce((s, e) => s + Number(e.quantidadeTon || 0), 0);
  const estercoVendidoValor = estercos.filter((e) => e.tipo === "venda").reduce((s, e) => s + Number(e.valorVenda || 0), 0);
  const estercoArmazenado = Math.max(0, estercoProduzido - estercoVendidoTon);

  const alertasReposicao = lotes
    .filter((l) => l.fase === "postura" && l.dataPrevistaDescarte)
    .map((l) => {
      const diasRestantes = Math.round((new Date(l.dataPrevistaDescarte + "T00:00:00") - new Date(hoje + "T00:00:00")) / 86400000);
      const dataSugeridaCompra = new Date(new Date(l.dataPrevistaDescarte + "T00:00:00").getTime() - tempoCriaRecria * 86400000).toISOString().slice(0, 10);
      return { ...l, diasRestantes, dataSugeridaCompra, quantidadeSugerida: l.quantidadeAlojada };
    })
    .filter((l) => l.diasRestantes <= tempoCriaRecria + 30)
    .sort((a, b) => a.diasRestantes - b.diasRestantes);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Aves vivas (todos os lotes)" value={totalAvesVivas.toLocaleString("pt-BR")} accent={GREEN} />
        <StatCard label="Ovos produzidos hoje" value={ovosHoje.toLocaleString("pt-BR")} accent={GOLD} />
        <StatCard label="Ovos — últimos 30 dias" value={ovos30dias.toLocaleString("pt-BR")} accent={GOLD} />
        <StatCard label="Taxa de quebra (30 dias)" value={`${taxaQuebra.toFixed(1)}%`} accent={DANGER} />
        <StatCard label="Aves mortas (30 dias)" value={mortes30dias.toLocaleString("pt-BR")} accent={DANGER} />
        <StatCard label="Custo de ração por ave" value={brl(custoPorAve)} accent={MUTED} />
        <StatCard label="Esterco armazenado" value={`${estercoArmazenado.toFixed(1)} ton`} accent={GREEN} />
        <StatCard label="Esterco vendido (total)" value={`${estercoVendidoTon.toFixed(1)} ton · ${brl(estercoVendidoValor)}`} accent={GOLD} />
      </div>

      {!!alertasReposicao.length && (
        <Card title="Planejamento de reposição de pintos de 1 dia" subtitle="Lotes em postura próximos do descarte — programe a compra considerando o tempo de cria e recria.">
          <div style={{ display: "flex", gap: 10, alignItems: "end", marginBottom: 12 }}>
            <Field label="Tempo de cria + recria (dias)"><TextInput type="number" value={tempoCriaRecria} onChange={(e) => setTempoCriaRecria(Number(e.target.value) || 0)} /></Field>
          </div>
          <Table
            columns={[
              { key: "codigo", label: "Lote" },
              { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || "—" },
              { key: "diasRestantes", label: "Dias até o descarte", render: (r) => (r.diasRestantes < 0 ? `${Math.abs(r.diasRestantes)} dias atrasado` : `${r.diasRestantes} dias`) },
              { key: "quantidadeSugerida", label: "Qtd. sugerida de pintos", render: (r) => Number(r.quantidadeSugerida || 0).toLocaleString("pt-BR") },
              { key: "dataSugeridaCompra", label: "Comprar até", render: (r) => r.dataSugeridaCompra.split("-").reverse().join("/") },
            ]}
            rows={alertasReposicao}
          />
        </Card>
      )}

      <CrudBlock
        title="Galpões" subtitle="Estrutura física para alojamento dos lotes." filialId={filialId}
        items={galpoes} onChange={(items) => update((prev) => ({ ...prev, galpoes: mergeByFilial(prev.galpoes, items, filialId) }))}
        fields={[{ key: "nome", label: "Nome", required: true }, { key: "capacidade", label: "Capacidade (aves)", type: "number" }]}
      />

      <CrudBlock
        title="Lotes de Aves" subtitle="Manejo, descarte e abate — quantidade atual já desconta as mortes registradas abaixo." filialId={filialId}
        items={lotes} onChange={(items) => update((prev) => ({ ...prev, lotesAves: mergeByFilial(prev.lotesAves, items, filialId) }))}
        fields={[
          { key: "codigo", label: "Código do lote", required: true },
          { key: "galpaoId", label: "Galpão", type: "select", options: galpoes.map((g) => ({ value: g.id, label: g.nome })) },
          { key: "linhagem", label: "Linhagem" },
          { key: "dataAlojamento", label: "Data de alojamento", type: "date" },
          { key: "quantidadeAlojada", label: "Quantidade alojada", type: "number" },
          { key: "fase", label: "Fase", type: "select", options: [{ value: "cria", label: "Cria" }, { value: "recria", label: "Recria" }, { value: "postura", label: "Postura" }, { value: "descarte", label: "Descarte/Abate" }] },
          { key: "dataPrevistaDescarte", label: "Previsão de descarte", type: "date" },
        ]}
        columns={[
          { key: "codigo", label: "Lote" },
          { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || "—" },
          { key: "fase", label: "Fase" },
          { key: "quantidadeAlojada", label: "Alojada", render: (r) => Number(r.quantidadeAlojada || 0).toLocaleString("pt-BR") },
          { key: "quantidadeAtual", label: "Atual (viva)", render: (r) => quantidadeAtual(r).toLocaleString("pt-BR") },
          { key: "dataPrevistaDescarte", label: "Previsão descarte" },
        ]}
      />

      <CrudBlock
        title="Postura e quebras" subtitle="Produção diária ou por período, por lote." filialId={filialId}
        items={posturas} onChange={(items) => update((prev) => ({ ...prev, registrosPostura: mergeByFilial(prev.registrosPostura, items, filialId) }))}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "ovosProduzidos", label: "Ovos produzidos", type: "number" },
          { key: "ovosQuebrados", label: "Ovos quebrados", type: "number" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "ovosProduzidos", label: "Produzidos", render: (r) => Number(r.ovosProduzidos || 0).toLocaleString("pt-BR") },
          { key: "ovosQuebrados", label: "Quebrados", render: (r) => Number(r.ovosQuebrados || 0).toLocaleString("pt-BR") },
        ]}
      />

      <CrudBlock
        title="Mortalidade" subtitle="Aves mortas por período e por lote." filialId={filialId}
        items={mortalidades} onChange={(items) => update((prev) => ({ ...prev, registrosMortalidade: mergeByFilial(prev.registrosMortalidade, items, filialId) }))}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "avesMortas", label: "Aves mortas", type: "number" },
          { key: "motivo", label: "Motivo" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "avesMortas", label: "Aves mortas", render: (r) => Number(r.avesMortas || 0).toLocaleString("pt-BR") },
          { key: "motivo", label: "Motivo" },
        ]}
      />

      <CrudBlock
        title="Esterco — armazenado e vendido" subtitle="Registre a produção (entrada no armazém) e as vendas (saída)." filialId={filialId}
        items={estercos} onChange={(items) => update((prev) => ({ ...prev, registrosEsterco: mergeByFilial(prev.registrosEsterco, items, filialId) }))}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "tipo", label: "Tipo", type: "select", options: [{ value: "producao", label: "Produção (armazenar)" }, { value: "venda", label: "Venda (saída)" }] },
          { key: "quantidadeTon", label: "Quantidade (ton)", type: "number" },
          { key: "valorVenda", label: "Valor da venda (R$)", type: "number" },
          { key: "comprador", label: "Comprador" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "venda" ? "Venda" : "Produção") },
          { key: "quantidadeTon", label: "Qtd. (ton)", render: (r) => Number(r.quantidadeTon || 0).toFixed(1) },
          { key: "valorVenda", label: "Valor", render: (r) => (r.tipo === "venda" ? brl(r.valorVenda) : "—") },
          { key: "comprador", label: "Comprador" },
        ]}
      />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<AvisoftRoot />);
</script>
</body>
</html>
