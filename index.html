function FolhaPagamento({ db, update, filialId }) {
  const funcionarios = db.funcionarios.filter((f) => f.filialId === filialId);
  const ativos = funcionarios.filter((f) => f.ativo !== false && f.ativo !== "false");

  const folhaBruta = ativos.reduce((s, f) => s + Number(f.salarioBruto || 0), 0);
  const encargosTotal = ativos.reduce((s, f) => s + (Number(f.salarioBruto || 0) * Number(f.encargosPercentual || 0)) / 100, 0);
  const beneficiosTotal = ativos.reduce((s, f) => s + Number(f.beneficios || 0), 0);
  const folhaTotalMensal = folhaBruta + encargosTotal + beneficiosTotal;

  function onChange(items) { update((prev) => ({ ...prev, funcionarios: mergeByFilial(prev.funcionarios, items, filialId) })); }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Salários brutos" value={brl(folhaBruta)} accent={GREEN} />
        <StatCard label="Encargos" value={brl(encargosTotal)} accent={GOLD} />
        <StatCard label="Benefícios" value={brl(beneficiosTotal)} accent={MUTED} />
        <StatCard label="Folha total / mês" value={brl(folhaTotalMensal)} accent={DANGER} />
      </div>
      <CadastroFuncionario items={funcionarios} onChange={onChange} filialId={filialId} />
    </div>
  );
}

/* ---------------- Relatório Gerencial ---------------- */

function RelatorioGerencial({ db, update, filialId }) {
  const vendasAll = db.vendas.filter((v) => v.filialId === filialId);
  const comprasAll = db.compras.filter((c) => c.filialId === filialId);
  const fretesAll = db.fretes.filter((f) => f.filialId === filialId);
  const avulsasAll = db.contasAvulsas.filter((a) => a.filialId === filialId);
  const funcionarios = db.funcionarios.filter((f) => f.filialId === filialId && f.ativo !== false && f.ativo !== "false");
  const vendedores = db.vendedores.filter((v) => v.filialId === filialId);

  const configSalva = db.configsGerenciais.find((c) => c.filialId === filialId) || { investimentoTotal: 0, aliquotaImposto: 34, descontoValidadeAtivo: false, descontoValidadeDias: 7, descontoValidadePercentual: 10, lalurAdicoes: 0, lalurExclusoes: 0 };
  const [config, setConfig] = useState({
    investimentoTotal: configSalva.investimentoTotal || "", aliquotaImposto: configSalva.aliquotaImposto ?? 34,
    descontoValidadeAtivo: configSalva.descontoValidadeAtivo ? "true" : "false",
    descontoValidadeDias: configSalva.descontoValidadeDias ?? 7,
    descontoValidadePercentual: configSalva.descontoValidadePercentual ?? 10,
    lalurAdicoes: configSalva.lalurAdicoes || "", lalurExclusoes: configSalva.lalurExclusoes || "",
  });
  // Padrão: os últimos 12 meses fechados (setembro até 11 meses antes, por exemplo) — fatos contábeis já ocorridos.
  // Pode ser ajustado livremente nos campos "De" / "Até" abaixo.
  const [periodo, setPeriodo] = useState({ de: mesesAtras(11), ate: todayISO() });

  function salvarConfig() {
    update((prev) => ({
      ...prev,
      configsGerenciais: [...prev.configsGerenciais.filter((c) => c.filialId !== filialId), {
        filialId, investimentoTotal: Number(config.investimentoTotal) || 0, aliquotaImposto: Number(config.aliquotaImposto) || 0,
        descontoValidadeAtivo: config.descontoValidadeAtivo === "true" || config.descontoValidadeAtivo === true,
        descontoValidadeDias: Number(config.descontoValidadeDias) || 0,
        descontoValidadePercentual: Number(config.descontoValidadePercentual) || 0,
        lalurAdicoes: Number(config.lalurAdicoes) || 0, lalurExclusoes: Number(config.lalurExclusoes) || 0,
      }],
    }));
  }

  const dentroPeriodo = (dataISO) => !!dataISO && dataISO >= periodo.de && dataISO <= periodo.ate;
  const nMeses = mesesNoPeriodo(periodo.de, periodo.ate);

  const vendas = vendasAll.filter((v) => dentroPeriodo(v.data));
  const compras = comprasAll.filter((c) => dentroPeriodo(c.data));
  const fretes = fretesAll.filter((f) => dentroPeriodo(f.data));
  const avulsasPeriodo = avulsasAll.filter((a) => dentroPeriodo(a.vencimento));

  const receitaVendas = vendas.reduce((s, v) => s + Number(v.total || 0), 0);
  const receitasAvulsas = avulsasPeriodo.filter((a) => a.tipo === "receber").reduce((s, a) => s + Number(a.valor || 0), 0);
  const receitaTotal = receitaVendas + receitasAvulsas;

  const comissoes = vendas.reduce((s, v) => s + Number(v.comissaoValor || 0) + Number(v.comissaoGerenteValor || 0), 0);
  const custoInsumos = compras.filter((c) => c.categoria === "insumo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const custoPintinhos = compras.filter((c) => c.categoria === "pintinhos").reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasAdm = compras.filter((c) => c.categoria === "administrativo").reduce((s, c) => s + Number(c.valor || 0), 0);
  const manutencao = compras.filter((c) => c.categoria === "manutencao").reduce((s, c) => s + Number(c.valor || 0), 0);
  const outrasCompras = compras.filter((c) => !["insumo", "administrativo", "manutencao", "pintinhos"].includes(c.categoria)).reduce((s, c) => s + Number(c.valor || 0), 0);
  const despesasFrete = fretes.reduce((s, f) => s + Number(f.valorFrete || 0), 0);
  const despesasAvulsas = avulsasPeriodo.filter((a) => a.tipo === "pagar").reduce((s, a) => s + Number(a.valor || 0), 0);

  const folhaMensal = funcionarios.reduce((s, f) => s + Number(f.salarioBruto || 0) + (Number(f.salarioBruto || 0) * Number(f.encargosPercentual || 0)) / 100 + Number(f.beneficios || 0), 0);
  const folhaPeriodo = folhaMensal * nMeses;

  const custosOperacionais = custoInsumos + despesasAdm + manutencao + outrasCompras + despesasFrete + comissoes + despesasAvulsas + folhaPeriodo;
  const ebitda = receitaTotal - custosOperacionais;
  const margemEbitda = receitaTotal > 0 ? (ebitda / receitaTotal) * 100 : 0;
  const impostoEstimado = ebitda > 0 ? ebitda * (Number(config.aliquotaImposto || 0) / 100) : 0;
  const lucroLiquido = ebitda - impostoEstimado;

  const investimento = Number(config.investimentoTotal) || 0;
  const roi = investimento > 0 ? (lucroLiquido / investimento) * 100 : null;
  const lucroMedioMensal = lucroLiquido / nMeses;
  const paybackMeses = investimento > 0 && lucroMedioMensal > 0 ? investimento / lucroMedioMensal : null;

  // Fluxo de caixa projetado (por vencimento das parcelas). Cobre o período selecionado (fatos já
  // ocorridos) e, além dele, qualquer mês futuro que já tenha conta a pagar ou a receber lançada
  // (ex.: um boleto de 30/60 dias vencendo depois do fim do período) — essas contas já existem no
  // sistema, então entram no fluxo mesmo fora da janela padrão.
  const mesesBase = listaDeMeses(periodo.de, periodo.ate);
  const mesFinalBase = mesesBase[mesesBase.length - 1];
  const mesesFuturosSet = new Set();
  vendasAll.forEach((v) => (v.parcelas || []).forEach((p) => { if (p.vencimento && p.vencimento.slice(0, 7) > mesFinalBase) mesesFuturosSet.add(p.vencimento.slice(0, 7)); }));
  comprasAll.forEach((c) => (c.parcelas || []).forEach((p) => { if (p.vencimento && p.vencimento.slice(0, 7) > mesFinalBase) mesesFuturosSet.add(p.vencimento.slice(0, 7)); }));
  avulsasAll.forEach((a) => { if (a.vencimento && a.vencimento.slice(0, 7) > mesFinalBase) mesesFuturosSet.add(a.vencimento.slice(0, 7)); });
  const meses = [...mesesBase, ...[...mesesFuturosSet].sort()];

  let acumulado = 0;
  const fluxo = meses.map((mes) => {
    const entradasVendas = vendasAll.flatMap((v) => v.parcelas || []).filter((p) => p.vencimento && p.vencimento.startsWith(mes)).reduce((s, p) => s + Number(p.valor || 0), 0);
    const entradasAvulsas = avulsasAll.filter((a) => a.tipo === "receber" && a.vencimento && a.vencimento.startsWith(mes)).reduce((s, a) => s + Number(a.valor || 0), 0);
    const saidasCompras = comprasAll.flatMap((c) => c.parcelas || []).filter((p) => p.vencimento && p.vencimento.startsWith(mes)).reduce((s, p) => s + Number(p.valor || 0), 0);
    const saidasFretes = fretesAll.filter((f) => f.data && f.data.startsWith(mes)).reduce((s, f) => s + Number(f.valorFrete || 0), 0);
    const saidasAvulsas = avulsasAll.filter((a) => a.tipo === "pagar" && a.vencimento && a.vencimento.startsWith(mes)).reduce((s, a) => s + Number(a.valor || 0), 0);
    const entradas = entradasVendas + entradasAvulsas;
    const saidas = saidasCompras + saidasFretes + saidasAvulsas + folhaMensal;
    const saldo = entradas - saidas;
    acumulado += saldo;
    return { mes, entradas, saidas, saldo, acumulado, futuro: mes > mesFinalBase };
  });

  // ---- Resumo de um período arbitrário (usado no comparativo semestral) ----
  function resumoPeriodo(deISO, ateISO) {
    const emPer = (d) => !!d && d >= deISO && d <= ateISO;
    const nMesesP = mesesNoPeriodo(deISO, ateISO);
    const vP = vendasAll.filter((v) => emPer(v.data));
    const cP = comprasAll.filter((c) => emPer(c.data));
    const fP = fretesAll.filter((f) => emPer(f.data));
    const aP = avulsasAll.filter((a) => emPer(a.vencimento));
    const receitaP = vP.reduce((s, v) => s + Number(v.total || 0), 0) + aP.filter((a) => a.tipo === "receber").reduce((s, a) => s + Number(a.valor || 0), 0);
    const comissoesP = vP.reduce((s, v) => s + Number(v.comissaoValor || 0) + Number(v.comissaoGerenteValor || 0), 0);
    const insumosP = cP.filter((c) => c.categoria === "insumo").reduce((s, c) => s + Number(c.valor || 0), 0);
    const admP = cP.filter((c) => c.categoria === "administrativo").reduce((s, c) => s + Number(c.valor || 0), 0);
    const manutP = cP.filter((c) => c.categoria === "manutencao").reduce((s, c) => s + Number(c.valor || 0), 0);
    const outrasP = cP.filter((c) => !["insumo", "administrativo", "manutencao", "pintinhos"].includes(c.categoria)).reduce((s, c) => s + Number(c.valor || 0), 0);
    const freteP = fP.reduce((s, f) => s + Number(f.valorFrete || 0), 0);
    const avulsasPagarP = aP.filter((a) => a.tipo === "pagar").reduce((s, a) => s + Number(a.valor || 0), 0);
    const folhaP = folhaMensal * nMesesP;
    const custosP = insumosP + admP + manutP + outrasP + freteP + comissoesP + avulsasPagarP + folhaP;
    const ebitdaP = receitaP - custosP;
    const impostoP = ebitdaP > 0 ? ebitdaP * (Number(config.aliquotaImposto || 0) / 100) : 0;
    return { receita: receitaP, custos: custosP, ebitda: ebitdaP, lucro: ebitdaP - impostoP, nMeses: nMesesP };
  }

  const semestreAtualDe = inicioSemestre(todayISO());
  const semestreAtualAte = todayISO();
  const semestreAnteriorDe = deslocarAno(semestreAtualDe, -1);
  const semestreAnteriorAte = deslocarAno(semestreAtualAte, -1);
  const resumoSemestreAtual = resumoPeriodo(semestreAtualDe, semestreAtualAte);
  const resumoSemestreAnterior = resumoPeriodo(semestreAnteriorDe, semestreAnteriorAte);
  const variacao = (atual, anterior) => (anterior !== 0 ? ((atual - anterior) / Math.abs(anterior)) * 100 : (atual !== 0 ? 100 : 0));

  // ---- LALUR simplificado (Livro de Apuração do Lucro Real) ----
  // Parte do EBITDA do período como proxy de "lucro líquido antes do IR/CSLL" (o sistema não
  // modela depreciação/amortização) e aplica as regras de IRPJ (15% + adicional de 10% sobre o
  // que exceder R$20.000/mês) e CSLL (9%) sobre a base ajustada por adições e exclusões.
  const lalurAdicoes = Number(config.lalurAdicoes) || 0;
  const lalurExclusoes = Number(config.lalurExclusoes) || 0;
  const lalurLucroContabil = ebitda;
  const lalurBaseCalculo = lalurLucroContabil + lalurAdicoes - lalurExclusoes;
  const lalurLimiteAdicional = 20000 * nMeses;
  const lalurIrpjBase = lalurBaseCalculo > 0 ? lalurBaseCalculo * 0.15 : 0;
  const lalurIrpjAdicional = lalurBaseCalculo > lalurLimiteAdicional ? (lalurBaseCalculo - lalurLimiteAdicional) * 0.10 : 0;
  const lalurCsll = lalurBaseCalculo > 0 ? lalurBaseCalculo * 0.09 : 0;
  const lalurTotalTributos = lalurIrpjBase + lalurIrpjAdicional + lalurCsll;
  const lalurLucroReal = lalurBaseCalculo - lalurTotalTributos;

  const comissoesPorVendedor = vendedores.filter((v) => v.ativo !== false && v.ativo !== "false").map((vend) => {
    const proprias = vendasAll.filter((v) => v.vendedorId === vend.id && dentroPeriodo(v.data));
    const comoGerente = vendasAll.filter((v) => v.gerenteComercialId === vend.id && dentroPeriodo(v.data));
    const comissaoPropria = proprias.reduce((s, v) => s + Number(v.comissaoValor || 0), 0);
    const comissaoGerente = comoGerente.reduce((s, v) => s + Number(v.comissaoGerenteValor || 0), 0);
    return { ...vend, totalVendido: proprias.reduce((s, v) => s + Number(v.total || 0), 0), comissaoPropria, comissaoGerente, comissaoTotal: comissaoPropria + comissaoGerente };
  }).filter((v) => v.totalVendido > 0 || v.comissaoTotal > 0);

  const linha = (label, valor, bold, indent) => (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${BORDER}`, fontWeight: bold ? 800 : 500, paddingLeft: indent ? 16 : 0, color: bold ? GREEN : INK, fontSize: bold ? 14 : 13 }}>
      <span>{label}</span><span>{brl(valor)}</span>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#FBF3DC", border: `1px solid ${GOLD_LIGHT}`, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, color: "#6B5410" }}>
        Relatório calculado a partir dos lançamentos reais desta filial no período selecionado. Impostos, ROI e payback são estimativas gerenciais simplificadas (sem compensação de prejuízo fiscal, sem a trava legal de 30%, sem depreciação de ativos) — para uma apuração tributária real, consulte seu contador.
      </div>

      <Card title="Período do relatório" subtitle="Padrão: os últimos 12 meses fechados (mês corrente + 11 anteriores), com fatos contábeis já ocorridos. Contas a pagar/receber já lançadas para depois do fim do período aparecem à parte, no Fluxo de Caixa.">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="De"><TextInput type="date" value={periodo.de} onChange={(e) => setPeriodo({ ...periodo, de: e.target.value })} /></Field>
          <Field label="Até"><TextInput type="date" value={periodo.ate} onChange={(e) => setPeriodo({ ...periodo, ate: e.target.value })} /></Field>
          <Button variant="ghost" onClick={() => setPeriodo({ de: mesesAtras(11), ate: todayISO() })}>Últimos 12 meses</Button>
          <div style={{ fontSize: 12, color: MUTED, paddingBottom: 8 }}>{nMeses} mês(es) considerado(s) — a folha de pagamento é multiplicada por esse número de meses.</div>
        </div>
      </Card>

      <Card title="Parâmetros para ROI, payback e impostos">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="Investimento total (R$)"><TextInput type="number" step="0.01" value={config.investimentoTotal} onChange={(e) => setConfig({ ...config, investimentoTotal: e.target.value })} /></Field>
          <Field label="Alíquota de imposto sobre o lucro (%)"><TextInput type="number" step="0.1" value={config.aliquotaImposto} onChange={(e) => setConfig({ ...config, aliquotaImposto: e.target.value })} /></Field>
          <Button onClick={salvarConfig}>Salvar parâmetros</Button>
        </div>
      </Card>

      <Card title="Parâmetros do LALUR" subtitle="Ajustes ao lucro contábil exigidos pela legislação — despesas não dedutíveis (adições) e receitas não tributáveis (exclusões), informados pelo contador.">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="Adições (R$)"><TextInput type="number" step="0.01" value={config.lalurAdicoes} onChange={(e) => setConfig({ ...config, lalurAdicoes: e.target.value })} /></Field>
          <Field label="Exclusões (R$)"><TextInput type="number" step="0.01" value={config.lalurExclusoes} onChange={(e) => setConfig({ ...config, lalurExclusoes: e.target.value })} /></Field>
          <Button onClick={salvarConfig}>Salvar parâmetros</Button>
        </div>
      </Card>

      <Card title="Desconto automático por validade (Força de Vendas)" subtitle="Opcional — quando ligado, o lote sugerido perto do vencimento já entra com desconto aplicado. A decisão de ligar ou não continua sendo sua.">
        <div style={{ display: "flex", gap: 12, alignItems: "end", flexWrap: "wrap" }}>
          <Field label="Aplicar desconto automático?">
            <Select options={[{ value: "false", label: "Não" }, { value: "true", label: "Sim" }]} value={config.descontoValidadeAtivo} onChange={(e) => setConfig({ ...config, descontoValidadeAtivo: e.target.value })} />
          </Field>
          <Field label="Nos últimos quantos dias antes de vencer"><TextInput type="number" value={config.descontoValidadeDias} onChange={(e) => setConfig({ ...config, descontoValidadeDias: e.target.value })} /></Field>
          <Field label="Percentual de desconto (%)"><TextInput type="number" step="0.1" value={config.descontoValidadePercentual} onChange={(e) => setConfig({ ...config, descontoValidadePercentual: e.target.value })} /></Field>
          <Button onClick={salvarConfig}>Salvar parâmetros</Button>
        </div>
      </Card>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Receita no período" value={brl(receitaTotal)} accent={GREEN} />
        <StatCard label="EBITDA" value={brl(ebitda)} accent={GOLD} />
        <StatCard label="Margem EBITDA" value={`${margemEbitda.toFixed(1)}%`} accent={MUTED} />
        <StatCard label="Impostos estimados" value={brl(impostoEstimado)} accent={DANGER} />
        <StatCard label="Lucro líquido estimado" value={brl(lucroLiquido)} accent={GREEN} />
        <StatCard label="Folha de pagamento (período)" value={brl(folhaPeriodo)} accent={MUTED} />
        <StatCard label="ROI no período" value={roi === null ? "—" : `${roi.toFixed(1)}%`} accent={GOLD} />
        <StatCard label="Payback estimado" value={paybackMeses === null ? "—" : `${paybackMeses.toFixed(1)} meses`} accent={DANGER} />
      </div>

      <Card title="EBITDA — Demonstrativo gerencial">
        {linha("Receita de vendas", receitaVendas)}
        {linha("(+) Receitas avulsas", receitasAvulsas, false, true)}
        {linha("(-) Comissões (vendedor + gerente)", -comissoes, false, true)}
        {linha("(-) Insumos e ração", -custoInsumos, false, true)}
        {linha("(-) Despesas administrativas", -despesasAdm, false, true)}
        {linha("(-) Manutenção", -manutencao, false, true)}
        {linha("(-) Fretes e logística", -despesasFrete, false, true)}
        {linha("(-) Outras despesas de compra", -outrasCompras, false, true)}
        {linha("(-) Despesas avulsas", -despesasAvulsas, false, true)}
        {linha("(-) Folha de pagamento", -folhaPeriodo, false, true)}
        <div style={{ marginTop: 6 }}>{linha("EBITDA", ebitda, true)}</div>
        {linha(`(-) Impostos estimados (${config.aliquotaImposto || 0}% sobre o lucro)`, -impostoEstimado, false, true)}
        <div style={{ marginTop: 6 }}>{linha("Lucro líquido estimado", lucroLiquido, true)}</div>
      </Card>

      <Card title="Fluxo de caixa projetado" subtitle="Entradas e saídas por mês de vencimento das parcelas — folha de pagamento tratada como custo fixo mensal. Meses marcados como 'projetado' ficam além do período selecionado, mas já têm conta a pagar/receber lançada.">
        <Table
          columns={[
            { key: "mes", label: "Mês", render: (r) => <>{nomeMes(r.mes)}{r.futuro && <span style={{ marginLeft: 6, fontSize: 10, fontWeight: 700, color: GOLD, background: "#FBF3DC", borderRadius: 6, padding: "1px 6px" }}>projetado</span>}</> },
            { key: "entradas", label: "Entradas", render: (r) => brl(r.entradas) },
            { key: "saidas", label: "Saídas", render: (r) => brl(r.saidas) },
            { key: "saldo", label: "Saldo do mês", render: (r) => brl(r.saldo) },
            { key: "acumulado", label: "Saldo acumulado", render: (r) => brl(r.acumulado) },
          ]}
          rows={fluxo}
        />
      </Card>

      <Card title="LALUR — Livro de Apuração do Lucro Real (simplificado)" subtitle="Parte do EBITDA do período como lucro contábil (o sistema não modela depreciação/amortização). IRPJ: 15% + adicional de 10% sobre o que exceder R$20.000/mês; CSLL: 9%. Apuração gerencial simplificada — não substitui o LALUR fiscal formal preparado pelo contador.">
        {linha("Lucro líquido contábil (EBITDA do período)", lalurLucroContabil)}
        {linha("(+) Adições", lalurAdicoes, false, true)}
        {linha("(-) Exclusões", -lalurExclusoes, false, true)}
        <div style={{ marginTop: 6 }}>{linha("Base de cálculo (Lucro Real)", lalurBaseCalculo, true)}</div>
        {linha("(-) IRPJ (15%)", -lalurIrpjBase, false, true)}
        {linha(`(-) IRPJ adicional (10% acima de ${brl(lalurLimiteAdicional)})`, -lalurIrpjAdicional, false, true)}
        {linha("(-) CSLL (9%)", -lalurCsll, false, true)}
        <div style={{ marginTop: 6 }}>{linha("Lucro líquido após IRPJ/CSLL", lalurLucroReal, true)}</div>
      </Card>

      <Card title="Comparativo semestral" subtitle={`Semestre atual (${semestreAtualDe.split("-").reverse().join("/")} a ${semestreAtualAte.split("-").reverse().join("/")}) vs. mesmo intervalo do ano anterior.`}>
        <Table
          columns={[
            { key: "indicador", label: "Indicador" },
            { key: "atual", label: "Semestre atual", render: (r) => brl(r.atual) },
            { key: "anterior", label: "Mesmo período ano anterior", render: (r) => brl(r.anterior) },
            { key: "variacao", label: "Variação", render: (r) => <span style={{ color: r.variacao >= 0 ? SUCCESS : DANGER, fontWeight: 700 }}>{r.variacao >= 0 ? "▲" : "▼"} {Math.abs(r.variacao).toFixed(1)}%</span> },
          ]}
          rows={[
            { indicador: "Receita", atual: resumoSemestreAtual.receita, anterior: resumoSemestreAnterior.receita, variacao: variacao(resumoSemestreAtual.receita, resumoSemestreAnterior.receita) },
            { indicador: "Custos operacionais", atual: resumoSemestreAtual.custos, anterior: resumoSemestreAnterior.custos, variacao: variacao(resumoSemestreAtual.custos, resumoSemestreAnterior.custos) },
            { indicador: "EBITDA", atual: resumoSemestreAtual.ebitda, anterior: resumoSemestreAnterior.ebitda, variacao: variacao(resumoSemestreAtual.ebitda, resumoSemestreAnterior.ebitda) },
            { indicador: "Lucro líquido estimado", atual: resumoSemestreAtual.lucro, anterior: resumoSemestreAnterior.lucro, variacao: variacao(resumoSemestreAtual.lucro, resumoSemestreAnterior.lucro) },
          ]}
        />
      </Card>

      <Card title="Relatório de comissões" subtitle="Comissão própria (como vendedor) e comissão como gerente comercial, dentro do período selecionado.">
        <Table
          columns={[
            { key: "nome", label: "Vendedor", render: (r) => r.apelido || r.nomeCompleto },
            { key: "totalVendido", label: "Total vendido", render: (r) => brl(r.totalVendido) },
            { key: "comissaoPropria", label: "Comissão própria", render: (r) => brl(r.comissaoPropria) },
            { key: "comissaoGerente", label: "Comissão como gerente", render: (r) => brl(r.comissaoGerente) },
            { key: "comissaoTotal", label: "Total a pagar", render: (r) => brl(r.comissaoTotal) },
          ]}
          rows={comissoesPorVendedor}
          emptyText="Nenhuma venda com comissão neste período."
        />
      </Card>
    </div>
  );
}

/* ---------------- Produção Avícola ---------------- */

function ProducaoAvicola({ db, update, filialId }) {
  const galpoes = db.galpoes.filter((g) => g.filialId === filialId);
  const lotes = db.lotesAves.filter((l) => l.filialId === filialId);
  const posturas = db.registrosPostura.filter((p) => p.filialId === filialId);
  const mortalidades = db.registrosMortalidade.filter((m) => m.filialId === filialId);
  const estercos = db.registrosEsterco.filter((e) => e.filialId === filialId);
  const descartes = db.registrosDescarte.filter((d) => d.filialId === filialId);
  const producoesRacao = db.producoesRacao.filter((p) => p.filialId === filialId);
  const equipeManejo = db.equipeManejo.filter((m) => m.filialId === filialId);
  const empresaAtual = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
  const filialAtual = empresaAtual?.filiais.find((f) => f.id === filialId);
  const [tempoCriaRecria, setTempoCriaRecria] = useState(120);

  const mortesDoLote = (loteId) => mortalidades.filter((m) => m.loteId === loteId).reduce((s, m) => s + Number(m.avesMortas || 0), 0);
  const descartesDoLote = (loteId) => descartes.filter((d) => d.loteId === loteId).reduce((s, d) => s + Number(d.quantidade || 0), 0);
  const quantidadeAtual = (lote) => Math.max(0, Number(lote.quantidadeAlojada || 0) - mortesDoLote(lote.id) - descartesDoLote(lote.id));

  const totalAvesVivas = lotes.reduce((s, l) => s + quantidadeAtual(l), 0);
  const custoRacaoTotal = producoesRacao.reduce((s, p) => s + Number(p.custoTotal || 0), 0);
  const custoPorAve = totalAvesVivas > 0 ? custoRacaoTotal / totalAvesVivas : 0;

  const hoje = todayISO();
  const ha30dias = new Date(new Date(hoje + "T00:00:00").getTime() - 30 * 86400000).toISOString().slice(0, 10);
  const ovosHoje = posturas.filter((p) => p.data === hoje).reduce((s, p) => s + Number(p.ovosProduzidos || 0), 0);
  const ovos30dias = posturas.filter((p) => p.data >= ha30dias).reduce((s, p) => s + Number(p.ovosProduzidos || 0), 0);
  const quebras30dias = posturas.filter((p) => p.data >= ha30dias).reduce((s, p) => s + Number(p.ovosQuebrados || 0), 0);
  const mortes30dias = mortalidades.filter((m) => m.data >= ha30dias).reduce((s, m) => s + Number(m.avesMortas || 0), 0);
  const taxaQuebra = ovos30dias > 0 ? (quebras30dias / ovos30dias) * 100 : 0;

  const estercoProduzido = estercos.filter((e) => e.tipo === "producao").reduce((s, e) => s + Number(e.quantidadeTon || 0), 0);
  const estercoVendidoTon = estercos.filter((e) => e.tipo === "venda").reduce((s, e) => s + Number(e.quantidadeTon || 0), 0);
  const estercoVendidoValor = estercos.filter((e) => e.tipo === "venda").reduce((s, e) => s + Number(e.valorVenda || 0), 0);
  const estercoArmazenado = Math.max(0, estercoProduzido - estercoVendidoTon);

  const alertasReposicao = lotes
    .filter((l) => l.fase === "postura" && l.proximaFase === "descarte" && l.dataProximaFase)
    .map((l) => {
      const diasRestantes = Math.round((new Date(l.dataProximaFase + "T00:00:00") - new Date(hoje + "T00:00:00")) / 86400000);
      const dataSugeridaCompra = new Date(new Date(l.dataProximaFase + "T00:00:00").getTime() - tempoCriaRecria * 86400000).toISOString().slice(0, 10);
      return { ...l, diasRestantes, dataSugeridaCompra, quantidadeSugerida: l.quantidadeAlojada };
    })
    .filter((l) => l.diasRestantes <= tempoCriaRecria + 30)
    .sort((a, b) => a.diasRestantes - b.diasRestantes);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <StatCard label="Aves vivas (todos os lotes)" value={totalAvesVivas.toLocaleString("pt-BR")} accent={GREEN} />
        <StatCard label="Ovos produzidos hoje" value={ovosHoje.toLocaleString("pt-BR")} accent={GOLD} />
        <StatCard label="Ovos — últimos 30 dias" value={ovos30dias.toLocaleString("pt-BR")} accent={GOLD} />
        <StatCard label="Taxa de quebra (30 dias)" value={`${taxaQuebra.toFixed(1)}%`} accent={DANGER} />
        <StatCard label="Aves mortas (30 dias)" value={mortes30dias.toLocaleString("pt-BR")} accent={DANGER} />
        <StatCard label="Custo de ração por ave" value={brl(custoPorAve)} accent={MUTED} />
        <StatCard label="Esterco armazenado" value={`${estercoArmazenado.toFixed(1)} ton`} accent={GREEN} />
        <StatCard label="Esterco vendido (total)" value={`${estercoVendidoTon.toFixed(1)} ton · ${brl(estercoVendidoValor)}`} accent={GOLD} />
      </div>

      {!!alertasReposicao.length && (
        <Card title="Planejamento de reposição de pintos de 1 dia" subtitle="Lotes em postura próximos do descarte — programe a compra considerando o tempo de cria e recria.">
          <div style={{ display: "flex", gap: 10, alignItems: "end", marginBottom: 12 }}>
            <Field label="Tempo de cria + recria (dias)"><TextInput type="number" value={tempoCriaRecria} onChange={(e) => setTempoCriaRecria(Number(e.target.value) || 0)} /></Field>
          </div>
          <Table
            columns={[
              { key: "codigo", label: "Lote" },
              { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || "—" },
              { key: "diasRestantes", label: "Dias até o descarte", render: (r) => (r.diasRestantes < 0 ? `${Math.abs(r.diasRestantes)} dias atrasado` : `${r.diasRestantes} dias`) },
              { key: "quantidadeSugerida", label: "Qtd. sugerida de pintos", render: (r) => Number(r.quantidadeSugerida || 0).toLocaleString("pt-BR") },
              { key: "dataSugeridaCompra", label: "Comprar até", render: (r) => r.dataSugeridaCompra.split("-").reverse().join("/") },
            ]}
            rows={alertasReposicao}
          />
        </Card>
      )}

      <CrudBlock
        title="Galpões" subtitle="Estrutura física para alojamento dos lotes." filialId={filialId}
        items={galpoes} onChange={(items) => update((prev) => ({ ...prev, galpoes: mergeByFilial(prev.galpoes, items, filialId) }))}
        fields={[{ key: "nome", label: "Nome", required: true }, { key: "capacidade", label: "Capacidade (aves)", type: "number" }]}
      />

      <CrudBlock
        title="Lotes de Aves" subtitle="Manejo, descarte e abate — quantidade atual já desconta mortes e descartes registrados abaixo. Preencha 'Próxima fase' e sua data para o sistema avisar automaticamente (30, 14 e 2 dias antes)." filialId={filialId}
        items={lotes} onChange={(items) => update((prev) => ({ ...prev, lotesAves: mergeByFilial(prev.lotesAves, items, filialId) }))}
        fields={[
          { key: "codigo", label: "Código do lote", required: true },
          { key: "galpaoId", label: "Galpão", type: "select", options: galpoes.map((g) => ({ value: g.id, label: g.nome })) },
          { key: "linhagem", label: "Linhagem" },
          { key: "dataAlojamento", label: "Data de alojamento", type: "date" },
          { key: "quantidadeAlojada", label: "Quantidade alojada", type: "number" },
          { key: "fase", label: "Fase atual", type: "select", options: [{ value: "cria", label: "Cria" }, { value: "recria", label: "Recria" }, { value: "postura", label: "Postura" }, { value: "descarte", label: "Descarte/Abate" }] },
          { key: "proximaFase", label: "Próxima fase", type: "select", options: [{ value: "recria", label: "Recria" }, { value: "postura", label: "Postura" }, { value: "descarte", label: "Descarte/Abate" }] },
          { key: "dataProximaFase", label: "Data prevista da próxima fase", type: "date" },
        ]}
        columns={[
          { key: "codigo", label: "Lote" },
          { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || "—" },
          { key: "fase", label: "Fase atual" },
          { key: "quantidadeAlojada", label: "Alojada", render: (r) => Number(r.quantidadeAlojada || 0).toLocaleString("pt-BR") },
          { key: "quantidadeAtual", label: "Atual (viva)", render: (r) => quantidadeAtual(r).toLocaleString("pt-BR") },
          { key: "proximaFase", label: "Próxima fase" },
          { key: "dataProximaFase", label: "Data prevista" },
        ]}
      />

      <CrudBlock
        title="Equipe de Manejo" subtitle="Quem recebe os alertas por e-mail de troca de fase dos lotes (30, 14 e 2 dias antes)." filialId={filialId}
        items={equipeManejo} onChange={(items) => update((prev) => ({ ...prev, equipeManejo: mergeByFilial(prev.equipeManejo, items, filialId) }))}
        fields={[
          { key: "nome", label: "Nome", required: true },
          { key: "email", label: "E-mail", type: "email", required: true },
          { key: "telefone", label: "Telefone" },
          { key: "area", label: "Área/função" },
          { key: "ativo", label: "Situação", type: "select", options: [{ value: "true", label: "Ativo" }, { value: "false", label: "Inativo" }] },
        ]}
        columns={[
          { key: "nome", label: "Nome" },
          { key: "email", label: "E-mail" },
          { key: "area", label: "Área" },
          { key: "ativo", label: "Situação", render: (r) => (r.ativo === false || r.ativo === "false" ? "Inativo" : "Ativo") },
        ]}
      />

      <CrudBlock
        title="Descarte de lotes (venda de galinhas)" subtitle="Saída de aves vivas por venda/descarte — desconta do total de aves vivas do lote e gera uma venda de verdade (com direito a emitir NF-e no módulo Vendas ou Fiscal)." filialId={filialId}
        items={descartes} onChange={(items) => {
          update((prev) => {
            const antigos = prev.registrosDescarte.filter((d) => d.filialId === filialId);
            const novos = items.filter((it) => !antigos.some((a) => a.id === it.id));

            let produtosNext = prev.produtos;
            let clientesNext = prev.clientes;
            const vendasNovas = [];

            novos.filter((it) => Number(it.valorVenda) > 0 && Number(it.quantidade) > 0).forEach((it) => {
              const { produto, produtosAtualizados } = encontrarOuCriarProdutoPorNome(produtosNext, filialId, "Galinha de Descarte", "un", "5102");
              produtosNext = produtosAtualizados;
              const { clienteId, clientesAtualizados } = encontrarOuCriarClientePorNome(clientesNext, filialId, it.comprador);
              clientesNext = clientesAtualizados;
              const clienteVenda = clientesAtualizados.find((c) => c.id === clienteId);
              const cfop = determinarCFOP(empresaAtual?.tipoEmpresa, filialAtual?.uf, clienteVenda?.uf);
              vendasNovas.push(montarVendaAutomatica({
                filialId, data: it.data, produtoId: produto.id, qtd: it.quantidade, valorTotal: it.valorVenda, clienteId, cfop,
                origem: `Descarte — lote ${lotes.find((l) => l.id === it.loteId)?.codigo || it.loteId}`,
              }));
            });

            return {
              ...prev,
              registrosDescarte: mergeByFilial(prev.registrosDescarte, items, filialId),
              produtos: produtosNext,
              clientes: clientesNext,
              vendas: [...prev.vendas, ...vendasNovas],
            };
          });
        }}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "quantidade", label: "Quantidade de aves", type: "number" },
          { key: "valorVenda", label: "Valor da venda (R$)", type: "number" },
          { key: "comprador", label: "Comprador" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "quantidade", label: "Qtd. aves", render: (r) => Number(r.quantidade || 0).toLocaleString("pt-BR") },
          { key: "valorVenda", label: "Valor", render: (r) => brl(r.valorVenda) },
          { key: "comprador", label: "Comprador" },
        ]}
      />

      <CrudBlock
        title="Postura e quebras" subtitle="Produção diária ou por período, por lote." filialId={filialId}
        items={posturas} onChange={(items) => update((prev) => ({ ...prev, registrosPostura: mergeByFilial(prev.registrosPostura, items, filialId) }))}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "ovosProduzidos", label: "Ovos produzidos", type: "number" },
          { key: "ovosQuebrados", label: "Ovos quebrados", type: "number" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "ovosProduzidos", label: "Produzidos", render: (r) => Number(r.ovosProduzidos || 0).toLocaleString("pt-BR") },
          { key: "ovosQuebrados", label: "Quebrados", render: (r) => Number(r.ovosQuebrados || 0).toLocaleString("pt-BR") },
        ]}
      />

      <CrudBlock
        title="Mortalidade" subtitle="Aves mortas por período e por lote." filialId={filialId}
        items={mortalidades} onChange={(items) => update((prev) => ({ ...prev, registrosMortalidade: mergeByFilial(prev.registrosMortalidade, items, filialId) }))}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "loteId", label: "Lote", type: "select", options: lotes.map((l) => ({ value: l.id, label: l.codigo })) },
          { key: "avesMortas", label: "Aves mortas", type: "number" },
          { key: "motivo", label: "Motivo" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "loteId", label: "Lote", render: (r) => lotes.find((l) => l.id === r.loteId)?.codigo || "—" },
          { key: "avesMortas", label: "Aves mortas", render: (r) => Number(r.avesMortas || 0).toLocaleString("pt-BR") },
          { key: "motivo", label: "Motivo" },
        ]}
      />

      <CrudBlock
        title="Esterco — armazenado e vendido" subtitle="Vendas geram uma venda de verdade, com direito a emitir NF-e. CFOP calculado automaticamente pela regra de resíduo/subproduto (cadastro de Produtos) — ou informe manualmente abaixo se seu contador orientar um código diferente." filialId={filialId}
        items={estercos} onChange={(items) => {
          update((prev) => {
            const antigos = prev.registrosEsterco.filter((e) => e.filialId === filialId);
            const novos = items.filter((it) => !antigos.some((a) => a.id === it.id));

            let produtosNext = prev.produtos;
            let clientesNext = prev.clientes;
            const vendasNovas = [];

            novos.filter((it) => it.tipo === "venda" && Number(it.valorVenda) > 0 && Number(it.quantidadeTon) > 0).forEach((it) => {
              const { produto, produtosAtualizados } = encontrarOuCriarProdutoPorNome(produtosNext, filialId, "Esterco / Adubo Orgânico", "ton", "5102", true);
              produtosNext = produtosAtualizados;
              const { clienteId, clientesAtualizados } = encontrarOuCriarClientePorNome(clientesNext, filialId, it.comprador);
              clientesNext = clientesAtualizados;
              const clienteVenda = clientesAtualizados.find((c) => c.id === clienteId);
              const cfopAuto = determinarCFOP(empresaAtual?.tipoEmpresa, filialAtual?.uf, clienteVenda?.uf, ehSim(produto.residuo));
              const cfop = it.cfopManual || cfopAuto;
              vendasNovas.push(montarVendaAutomatica({
                filialId, data: it.data, produtoId: produto.id, qtd: it.quantidadeTon, valorTotal: it.valorVenda, clienteId, cfop,
                origem: "Venda de esterco",
              }));
            });

            return {
              ...prev,
              registrosEsterco: mergeByFilial(prev.registrosEsterco, items, filialId),
              produtos: produtosNext,
              clientes: clientesNext,
              vendas: [...prev.vendas, ...vendasNovas],
            };
          });
        }}
        fields={[
          { key: "data", label: "Data", type: "date", required: true },
          { key: "tipo", label: "Tipo", type: "select", options: [{ value: "producao", label: "Produção (armazenar)" }, { value: "venda", label: "Venda (saída)" }] },
          { key: "quantidadeTon", label: "Quantidade (ton)", type: "number" },
          { key: "valorVenda", label: "Valor da venda (R$)", type: "number" },
          { key: "comprador", label: "Comprador" },
          { key: "cfopManual", label: "CFOP manual (opcional — deixe em branco p/ automático)" },
        ]}
        columns={[
          { key: "data", label: "Data" },
          { key: "tipo", label: "Tipo", render: (r) => (r.tipo === "venda" ? "Venda" : "Produção") },
          { key: "quantidadeTon", label: "Qtd. (ton)", render: (r) => Number(r.quantidadeTon || 0).toFixed(1) },
          { key: "valorVenda", label: "Valor", render: (r) => (r.tipo === "venda" ? brl(r.valorVenda) : "—") },
          { key: "comprador", label: "Comprador" },
          { key: "cfopManual", label: "CFOP", render: (r) => (r.tipo === "venda" ? (r.cfopManual || "automático") : "—") },
        ]}
      />
    </div>
  );
}

/* ---------------- Sensores / IoT ---------------- */

function SensoresIoT({ conn, db, filialId }) {
  const galpoes = db.galpoes.filter((g) => g.filialId === filialId);
  const [leituras, setLeituras] = useState(null);
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  function buscar() {
    setCarregando(true); setErro("");
    apiGetSensores(conn, filialId)
      .then((r) => setLeituras(r))
      .catch((e) => setErro(e.message || String(e)))
      .finally(() => setCarregando(false));
  }

  useEffect(() => { buscar(); }, [filialId]);

  const exemploPayload = JSON.stringify({
    apiKey: "sua-chave-aqui",
    action: "hardware",
    deviceId: "sensor-galpao-1-temp",
    filialId,
    galpaoId: galpoes[0]?.id || "<id-do-galpao>",
    tipo: "temperatura",
    valor: 27.4,
    unidade: "C",
  }, null, 2);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#EDE7F6", border: "1px solid #C9B8E8", borderRadius: 10, padding: "12px 14px", fontSize: 12.5, color: "#4A3A70" }}>
        Este módulo lê as leituras enviadas por sensores/hardware de galpão (temperatura, umidade, amônia, peso, consumo de água/ração) diretamente para o banco de dados, via o endpoint <code>action=hardware</code> do Apps Script — sem passar pelo app. Cada leitura vira uma nova linha; nada é sobrescrito.
      </div>

      <Card title="Como um dispositivo deve enviar dados" subtitle="POST para a mesma URL do Apps Script, com Content-Type: text/plain e o corpo abaixo em JSON.">
        <div style={{ fontFamily: "monospace", fontSize: 11, background: GREEN_DARK, color: "#D7E3DC", padding: 14, borderRadius: 8, overflowX: "auto", whiteSpace: "pre" }}>{exemploPayload}</div>
      </Card>

      <Card title="Últimas leituras" right={<Button variant="ghost" onClick={buscar}>{carregando ? "Atualizando…" : "Atualizar"}</Button>}>
        {erro && <div style={{ color: DANGER, fontSize: 12.5, marginBottom: 10 }}>{erro}</div>}
        <Table
          columns={[
            { key: "timestamp", label: "Data/Hora" },
            { key: "deviceId", label: "Dispositivo" },
            { key: "galpaoId", label: "Galpão", render: (r) => galpoes.find((g) => g.id === r.galpaoId)?.nome || r.galpaoId || "—" },
            { key: "tipo", label: "Tipo" },
            { key: "valor", label: "Valor", render: (r) => `${r.valor} ${r.unidade || ""}` },
          ]}
          rows={leituras || []}
          emptyText={leituras === null ? "Carregando…" : "Nenhuma leitura recebida ainda — conecte um dispositivo usando o formato acima."}
        />
      </Card>
    </div>
  );
}

/* Documento imprimível do orçamento — proposta comercial, sem valor fiscal. */

        <div style={{ fontSize: 10.5, fontWeight: 700, color: "#777" }}>CLIENTE</div>

      </div>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>

          <tr style={{ background: "#f2f2f2" }}>

                <td style={cell}>{it.qtd}</td>
                <td style={cell}>{brl(it.precoUnit)}</td>
                <td style={cell}>{brl(it.qtd * it.precoUnit)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div style={{ textAlign: "right", marginTop: 12, fontSize: 18, fontWeight: 800, color: GREEN }}>Total: {brl(orcamento.total)}</div>
      <div style={{ marginTop: 12, fontSize: 11, color: "#444", lineHeight: 1.7 }}>
        <b>Condição de pagamento:</b> {CONDICOES_PAGAMENTO.find((c) => c.value === orcamento.condicaoPagamento)?.label || "—"}<br />
        <b>Entrega:</b> {orcamento.tipoEntrega === "entrega" ? `Entrega própria (frete: ${brl(orcamento.valorFrete)})` : "Cliente retira no local"}<br />
        <b>Vendedor:</b> {vendedorNome || "—"}
      </div>
      <div style={{ marginTop: 16, fontSize: 9.5, color: "#999", textAlign: "center" }}>Este documento é uma proposta comercial e não tem valor fiscal.</div>
    </div>
  );
}

/* Lista de orçamentos — visualizar/imprimir e converter em venda (com direito a NF-e depois). */
function OrcamentosLista({ db, update, filialId }) {
  const orcamentos = db.orcamentos.filter((o) => o.filialId === filialId);
  const produtos = db.produtos.filter((p) => p.filialId === filialId);
  const clientes = db.clientes.filter((c) => c.filialId === filialId);
  const vendedores = db.vendedores.filter((v) => v.filialId === filialId);
  const empresa = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
  const filial = empresa?.filiais.find((f) => f.id === filialId);
  const [verOrcamento, setVerOrcamento] = useState(null);

  function nomeVend(id) { const v = vendedores.find((x) => x.id === id); return v ? (v.apelido || v.nomeCompleto) : "—"; }

  function converterEmVenda(orc) {
    const cliente = clientes.find((c) => c.id === orc.clienteId);
    const vendedor = vendedores.find((v) => v.id === orc.vendedorId);
    const comissaoValor = vendedor ? orc.total * (Number(vendedor.percentualComissao || 0) / 100) : 0;
    let comissaoGerenteValor = 0, gerenteComercialId = null;
    if (vendedor?.gerenteComercialId) {
      const gerente = vendedores.find((v) => v.id === vendedor.gerenteComercialId);
      if (gerente) { gerenteComercialId = gerente.id; comissaoGerenteValor = orc.total * (Number(gerente.percentualComissaoGerente || 0) / 100); }
    }
    const parcelas = gerarParcelas(orc.condicaoPagamento || "boleto_30", orc.total, todayISO());
    const itensComCfop = orc.itens.map((it) => {
      const prod = produtos.find((p) => p.id === it.produtoId);
      const cfop = determinarCFOP(empresa?.tipoEmpresa, filial?.uf, cliente?.uf, ehSim(prod?.residuo), prod?.controleTipo === "imobilizado");
      return { produtoId: it.produtoId, qtd: it.qtd, precoUnit: it.precoUnit, cfop, loteId: it.loteId || "" };
    });
    const venda = {
      id: uid(), filialId, data: todayISO(), clienteId: orc.clienteId, vendedorId: orc.vendedorId,
      itens: itensComCfop, total: orc.total, comissaoValor, gerenteComercialId, comissaoGerenteValor,
      condicaoPagamento: orc.condicaoPagamento || "boleto_30", centroCustoId: "", parcelas, nfe: null, origem: "Orçamento convertido",
    };
    const movimentos = orc.itens.map((it) => ({ id: uid(), filialId, data: todayISO(), produtoId: it.produtoId, tipo: "saida", qtd: it.qtd, motivo: "Venda (orçamento convertido)", origem: "venda:" + venda.id }));
    const freteNovo = orc.tipoEntrega === "entrega"
      ? [{ id: uid(), filialId, data: todayISO(), motoristaId: "", veiculoId: "", destino: `${cliente?.razaoSocial || "Cliente"} — ${cliente?.cidade || ""}/${cliente?.uf || ""}`, valorFrete: Number(orc.valorFrete || 0), statusPagamento: "pendente", origemVendaId: venda.id }]
      : [];
    update((prev) => ({
      ...prev,
      vendas: [...prev.vendas, venda],
      movimentacoesEstoque: [...prev.movimentacoesEstoque, ...movimentos],
      fretes: [...prev.fretes, ...freteNovo],
      orcamentos: prev.orcamentos.map((o) => (o.id === orc.id ? { ...o, status: "convertido", vendaId: venda.id } : o)),
    }));
    alert("Orçamento convertido em venda! Vá ao módulo Vendas ou Fiscal para emitir a NF-e.");
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {!orcamentos.length && <div style={{ textAlign: "center", color: MUTED, padding: 30, fontSize: 13 }}>Nenhum orçamento gerado ainda.</div>}
      {[...orcamentos].sort((a, b) => (a.data < b.data ? 1 : -1)).map((o) => {
        const cliente = clientes.find((c) => c.id === o.clienteId);
        return (
          <div key={o.id} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontWeight: 800, color: GREEN, fontSize: 14 }}>{cliente?.razaoSocial || "Cliente"}</div>
                <div style={{ fontSize: 11.5, color: MUTED }}>{o.data.split("-").reverse().join("/")} · {o.itens.length} item(ns) · {nomeVend(o.vendedorId)}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontWeight: 800, fontSize: 16, color: GREEN }}>{brl(o.total)}</div>
                <span style={{ fontSize: 10.5, fontWeight: 700, color: o.status === "convertido" ? SUCCESS : GOLD }}>{o.status === "convertido" ? "Convertido em venda" : "Em aberto"}</span>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <Button variant="ghost" onClick={() => setVerOrcamento(o)}>Ver / Imprimir</Button>
              {o.status !== "convertido" && <Button onClick={() => converterEmVenda(o)}>Converter em venda</Button>}
            </div>
          </div>
        );
      })}
      {verOrcamento && (
        <Modal title="Orçamento" onClose={() => setVerOrcamento(null)} wide>
          <OrcamentoDoc orcamento={verOrcamento} empresa={empresa} filial={filial} cliente={clientes.find((c) => c.id === verOrcamento.clienteId)} produtos={produtos} vendedorNome={nomeVend(verOrcamento.vendedorId)} />
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Button onClick={() => window.print()}>Imprimir / Salvar PDF</Button>
            <Button variant="ghost" onClick={() => setVerOrcamento(null)}>Fechar</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function ForcaDeVendas({ db, update, filialId }) {
  const produtos = db.produtos.filter((p) => p.filialId === filialId && p.controleTipo !== "almoxarifado");
  const clientes = db.clientes.filter((c) => c.filialId === filialId);
  const vendedoresAtivos = db.vendedores.filter((v) => v.filialId === filialId && v.ativo !== false && v.ativo !== "false");
  const empresa = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
  const filial = empresa?.filiais.find((f) => f.id === filialId);

  const [aba, setAba] = useState("novo"); // novo | orcamentos
  const [etapa, setEtapa] = useState("cliente"); // cliente | produtos | finalizar | concluido
  const [vendedorId, setVendedorId] = useState(vendedoresAtivos[0]?.id || "");
  const [buscaCliente, setBuscaCliente] = useState("");
  const [clienteSelecionadoId, setClienteSelecionadoId] = useState("");
  const [novoCliente, setNovoCliente] = useState({ razaoSocial: "", telefone1: "", cidade: "", uf: "" });
  const [carrinho, setCarrinho] = useState([]); // [{produtoId, qtd, precoUnit}]
  const [tipoDocumento, setTipoDocumento] = useState("venda"); // orcamento | venda
  const [condicaoPagamento, setCondicaoPagamento] = useState("vista_pix");
  const [tipoEntrega, setTipoEntrega] = useState("retira"); // retira | entrega
  const [valorFrete, setValorFrete] = useState("");
  const [resultado, setResultado] = useState(null);

  const clienteObj = clientes.find((c) => c.id === clienteSelecionadoId);
  const clientesFiltrados = buscaCliente
    ? clientes.filter((c) => c.razaoSocial.toLowerCase().includes(buscaCliente.toLowerCase()))
    : clientes.slice(0, 8);
  const configDesconto = db.configsGerenciais.find((c) => c.filialId === filialId);

  /* Escolhe o lote FEFO (o que vence primeiro) com saldo disponível para o produto,
     e aplica o desconto automático configurado se o lote estiver dentro do prazo. */
  function itemComLoteEDesconto(produto, qtd) {
    const disponiveis = lotesFEFO(db, filialId, produto.id);
    const lote = disponiveis[0]; // undefined = produto sem lote cadastrado (ex.: vendendo produção futura)
    let precoUnit = Number(produto.precoVenda) || 0;
    let descontoAplicado = false;
    if (lote && configDesconto?.descontoValidadeAtivo) {
      const dias = lote.dataValidade ? Math.round((new Date(lote.dataValidade + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000) : null;
      if (dias !== null && dias <= Number(configDesconto.descontoValidadeDias || 0)) {
        precoUnit = precoUnit * (1 - Number(configDesconto.descontoValidadePercentual || 0) / 100);
        descontoAplicado = true;
      }
    }
    return { produtoId: produto.id, qtd, precoUnit, precoOriginal: Number(produto.precoVenda) || 0, loteId: lote?.id || "", descontoAplicado };
  }

  function addAoCarrinho(produto) {
    setCarrinho((c) => {
      const existente = c.find((it) => it.produtoId === produto.id);
      if (existente) return c.map((it) => (it.produtoId === produto.id ? { ...it, qtd: it.qtd + 1 } : it));
      return [...c, itemComLoteEDesconto(produto, 1)];
    });
  }
  function alterarQtd(produtoId, delta) {
    setCarrinho((c) => c.map((it) => (it.produtoId === produtoId ? { ...it, qtd: Math.max(0, it.qtd + delta) } : it)).filter((it) => it.qtd > 0));
  }
  function definirQtd(produtoId, novaQtd) {
    const qtd = Math.max(0, Number(novaQtd) || 0);
    setCarrinho((c) => c.map((it) => (it.produtoId === produtoId ? { ...it, qtd } : it)).filter((it) => it.qtd > 0));
  }
  function trocarLote(produtoId, novoLoteId) {
    setCarrinho((c) => c.map((it) => {
      if (it.produtoId !== produtoId) return it;
      const lote = db.lotesProduto.find((l) => l.id === novoLoteId);
      let precoUnit = it.precoOriginal;
      let descontoAplicado = false;
      if (lote && configDesconto?.descontoValidadeAtivo && lote.dataValidade) {
        const dias = Math.round((new Date(lote.dataValidade + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
        if (dias <= Number(configDesconto.descontoValidadeDias || 0)) {
          precoUnit = precoUnit * (1 - Number(configDesconto.descontoValidadePercentual || 0) / 100);
          descontoAplicado = true;
        }
      }
      return { ...it, loteId: novoLoteId, precoUnit, descontoAplicado };
    }));
  }
  const totalCarrinho = carrinho.reduce((s, it) => s + it.qtd * it.precoUnit, 0);
  const qtdItensCarrinho = carrinho.reduce((s, it) => s + it.qtd, 0);

  function reiniciar() {
    setEtapa("cliente"); setClienteSelecionadoId(""); setBuscaCliente("");
    setNovoCliente({ razaoSocial: "", telefone1: "", cidade: "", uf: "" });
    setCarrinho([]); setTipoDocumento("venda"); setCondicaoPagamento("vista_pix"); setResultado(null);
    setTipoEntrega("retira"); setValorFrete("");
  }

  function concluirPedido() {
    if (!carrinho.length) { alert("Adicione ao menos um produto ao pedido."); return; }
    if (!clienteSelecionadoId && !novoCliente.razaoSocial) { alert("Informe o cliente."); return; }
    if (!vendedorId) { alert("Selecione o vendedor."); return; }

    let clienteId = clienteSelecionadoId;
    let novoClienteRegistro = null;
    let cliente = clienteObj;
    if (!clienteId) {
      novoClienteRegistro = {
        id: uid(), filialId, razaoSocial: novoCliente.razaoSocial, cpfCnpj: "", inscricaoEstadual: "",
        endereco: "", numero: "", bairro: "", cidade: novoCliente.cidade, uf: novoCliente.uf,
        telefone1: novoCliente.telefone1, telefone2: "", email1: "", email2: "", responsavel: "", anexos: [],
      };
      clienteId = novoClienteRegistro.id;
      cliente = novoClienteRegistro;
    }

    const total = totalCarrinho;

    if (tipoDocumento === "orcamento") {
      const orc = {
        id: uid(), filialId, data: todayISO(), clienteId, vendedorId,
        itens: carrinho.map((it) => ({ ...it })), total, condicaoPagamento, status: "aberto",
        tipoEntrega, valorFrete: tipoEntrega === "entrega" ? Number(valorFrete || 0) : 0,
        validadeAte: new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10),
      };
      update((prev) => ({
        ...prev,
        clientes: novoClienteRegistro ? [...prev.clientes, novoClienteRegistro] : prev.clientes,
        orcamentos: [...prev.orcamentos, orc],
      }));
      setResultado({ tipo: "orcamento", total });
      setEtapa("concluido");
      return;
    }

    const vendedor = vendedoresAtivos.find((v) => v.id === vendedorId);
    const comissaoValor = vendedor ? total * (Number(vendedor.percentualComissao || 0) / 100) : 0;
    let comissaoGerenteValor = 0, gerenteComercialId = null;
    if (vendedor?.gerenteComercialId) {
      const gerente = db.vendedores.find((v) => v.id === vendedor.gerenteComercialId);
      if (gerente) { gerenteComercialId = gerente.id; comissaoGerenteValor = total * (Number(gerente.percentualComissaoGerente || 0) / 100); }
    }
    const parcelas = gerarParcelas(condicaoPagamento, total, todayISO());
    const itensComCfop = carrinho.map((it) => {
      const prod = produtos.find((p) => p.id === it.produtoId);
      const cfop = determinarCFOP(empresa?.tipoEmpresa, filial?.uf, cliente?.uf, ehSim(prod?.residuo), prod?.controleTipo === "imobilizado");
      return { produtoId: it.produtoId, qtd: it.qtd, precoUnit: it.precoUnit, cfop, loteId: it.loteId || "" };
    });
    const venda = {
      id: uid(), filialId, data: todayISO(), clienteId, vendedorId,
      itens: itensComCfop, total, comissaoValor, gerenteComercialId, comissaoGerenteValor,
      condicaoPagamento, centroCustoId: "", parcelas, nfe: null, origem: "Força de Vendas",
    };
    const movimentos = carrinho.map((it) => ({ id: uid(), filialId, data: todayISO(), produtoId: it.produtoId, tipo: "saida", qtd: it.qtd, motivo: "Venda (Força de Vendas)", origem: "venda:" + venda.id }));
    const freteNovo = tipoEntrega === "entrega"
      ? [{ id: uid(), filialId, data: todayISO(), motoristaId: "", veiculoId: "", destino: `${cliente?.razaoSocial || "Cliente"} — ${cliente?.cidade || ""}/${cliente?.uf || ""}`, valorFrete: Number(valorFrete || 0), statusPagamento: "pendente", origemVendaId: venda.id }]
      : [];

    update((prev) => ({
      ...prev,
      clientes: novoClienteRegistro ? [...prev.clientes, novoClienteRegistro] : prev.clientes,
      vendas: [...prev.vendas, venda],
      movimentacoesEstoque: [...prev.movimentacoesEstoque, ...movimentos],
      fretes: [...prev.fretes, ...freteNovo],
    }));

    let pix = null;
    if (condicaoPagamento === "vista_pix" && empresa?.chavePix) {
      pix = gerarPayloadPix({ chave: empresa.chavePix, valor: total, nomeRecebedor: empresa.nome, cidade: filial?.cidade, txid: venda.id });
    }
    setResultado({ tipo: "venda", total, pix, condicaoPagamento });
    setEtapa("concluido");
  }

  const passos = ["cliente", "produtos", "finalizar"];
  const passoAtual = passos.indexOf(etapa);

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => setAba("novo")} style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", background: aba === "novo" ? GREEN : CARD, color: aba === "novo" ? "#fff" : GREEN, fontWeight: 800, cursor: "pointer", boxShadow: aba === "novo" ? "none" : `inset 0 0 0 1px ${BORDER}` }}>Novo pedido</button>
        <button onClick={() => setAba("orcamentos")} style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", background: aba === "orcamentos" ? GREEN : CARD, color: aba === "orcamentos" ? "#fff" : GREEN, fontWeight: 800, cursor: "pointer", boxShadow: aba === "orcamentos" ? "none" : `inset 0 0 0 1px ${BORDER}` }}>Orçamentos</button>
      </div>

      {aba === "orcamentos" ? (
        <OrcamentosLista db={db} update={update} filialId={filialId} />
      ) : (
        <>
      {etapa !== "concluido" && (
        <div style={{ display: "flex", gap: 6 }}>
          {passos.map((p, i) => (
            <div key={p} style={{ flex: 1, height: 5, borderRadius: 3, background: i <= passoAtual ? GREEN : BORDER }} />
          ))}
        </div>
      )}

      {/* ---- Etapa: vendedor + cliente ---- */}
      {etapa === "cliente" && (
        <>
          <Card title="Quem está vendendo?">
            <Select options={vendedoresAtivos.map((v) => ({ value: v.id, label: v.apelido || v.nomeCompleto }))} value={vendedorId} onChange={(e) => setVendedorId(e.target.value)} />
          </Card>
          <Card title="Cliente" subtitle="Escolha um cliente já cadastrado ou preencha os dados básicos de um novo — o cadastro é criado automaticamente.">
            <TextInput placeholder="Buscar cliente pelo nome…" value={buscaCliente} onChange={(e) => { setBuscaCliente(e.target.value); setClienteSelecionadoId(""); }} style={{ marginBottom: 10 }} />
            {!clienteSelecionadoId && buscaCliente && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12, maxHeight: 160, overflowY: "auto" }}>
                {clientesFiltrados.map((c) => (
                  <button key={c.id} onClick={() => { setClienteSelecionadoId(c.id); setBuscaCliente(c.razaoSocial); }} style={{ textAlign: "left", padding: "8px 10px", borderRadius: 8, border: `1px solid ${BORDER}`, background: CARD, cursor: "pointer", fontSize: 13 }}>
                    {c.razaoSocial} {c.cidade ? `— ${c.cidade}/${c.uf}` : ""}
                  </button>
                ))}
                {!clientesFiltrados.length && <div style={{ fontSize: 12, color: MUTED }}>Nenhum cliente encontrado — preencha os dados abaixo para cadastrar um novo.</div>}
              </div>
            )}
            {clienteSelecionadoId ? (
              <div style={{ background: "#EAF3EC", borderRadius: 8, padding: 10, fontSize: 13, fontWeight: 700, color: GREEN, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                {clienteObj?.razaoSocial}
                <button onClick={() => { setClienteSelecionadoId(""); setBuscaCliente(""); }} style={{ border: "none", background: "none", color: DANGER, cursor: "pointer", fontWeight: 700 }}>trocar</button>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div style={{ fontSize: 12, color: MUTED, fontWeight: 700 }}>OU CADASTRE UM NOVO CLIENTE:</div>
                <Field label="Nome / Razão social"><TextInput value={novoCliente.razaoSocial} onChange={(e) => setNovoCliente({ ...novoCliente, razaoSocial: e.target.value })} /></Field>
                <div style={{ display: "flex", gap: 10 }}>
                  <Field label="Telefone"><TextInput value={novoCliente.telefone1} onChange={(e) => setNovoCliente({ ...novoCliente, telefone1: e.target.value })} /></Field>
                  <Field label="Cidade"><TextInput value={novoCliente.cidade} onChange={(e) => setNovoCliente({ ...novoCliente, cidade: e.target.value })} /></Field>
                  <Field label="UF"><TextInput maxLength={2} value={novoCliente.uf} onChange={(e) => setNovoCliente({ ...novoCliente, uf: e.target.value.toUpperCase() })} style={{ width: 60 }} /></Field>
                </div>
              </div>
            )}
          </Card>
          <Button onClick={() => setEtapa("produtos")} disabled={!vendedorId || (!clienteSelecionadoId && !novoCliente.razaoSocial)} style={{ padding: "14px", fontSize: 15 }}>Continuar →</Button>
        </>
      )}

      {/* ---- Etapa: produtos ---- */}
      {etapa === "produtos" && (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {produtos.map((p) => {
              const noCarrinho = carrinho.find((it) => it.produtoId === p.id);
              return (
                <div key={p.id} style={{ background: CARD, border: `1px solid ${noCarrinho ? GREEN : BORDER}`, borderRadius: 12, overflow: "hidden" }}>
                  <div onClick={() => addAoCarrinho(p)} style={{ cursor: "pointer", width: "100%", height: 84, background: p.foto?.dataUrl ? `url(${p.foto.dataUrl}) center/cover` : BG, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {!p.foto?.dataUrl && <span style={{ fontSize: 26, opacity: 0.3 }}>📦</span>}
                  </div>
                  <div style={{ padding: 9 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: INK, minHeight: 30 }}>{p.nome}</div>
                    {noCarrinho?.descontoAplicado ? (
                      <div style={{ marginTop: 2 }}>
                        <span style={{ fontSize: 10.5, color: MUTED, textDecoration: "line-through" }}>{brl(noCarrinho.precoOriginal)}</span>
                        <span style={{ fontSize: 13.5, fontWeight: 800, color: DANGER, marginLeft: 6 }}>{brl(noCarrinho.precoUnit)}</span>
                      </div>
                    ) : (
                      <div style={{ fontSize: 13.5, fontWeight: 800, color: GREEN, marginTop: 2 }}>{brl(p.precoVenda)}</div>
                    )}
                    {noCarrinho?.loteId && (
                      <div style={{ fontSize: 9.5, color: MUTED, marginTop: 1 }}>Lote {db.lotesProduto.find((l) => l.id === noCarrinho.loteId)?.codigo || "—"} (FEFO)</div>
                    )}
                    {noCarrinho ? (
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 8, gap: 4 }}>
                        <button onClick={() => alterarQtd(p.id, -1)} style={{ width: 26, height: 26, borderRadius: 6, border: `1px solid ${BORDER}`, background: BG, cursor: "pointer", fontWeight: 800, flexShrink: 0 }}>−</button>
                        <input

                          onChange={(e) => definirQtd(p.id, e.target.value)}

                      <button onClick={() => addAoCarrinho(p)} style={{ width: "100%", marginTop: 8, padding: "6px 0", borderRadius: 6, border: "none", background: GOLD, color: GREEN_DARK, fontWeight: 800, fontSize: 12, cursor: "pointer" }}>+ Adicionar</button>

            <div style={{ position: "sticky", bottom: 10, background: GREEN, color: "#fff", borderRadius: 12, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 6px 20px rgba(0,0,0,0.25)" }}>

                const loteAtual = db.lotesProduto.find((l) => l.id === it.loteId);

                      <span style={{ fontWeight: 700, minWidth: 70, textAlign: "right" }}>{brl(it.qtd * it.precoUnit)}</span>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
                      {opcoesLote.length ? (
                        <select value={it.loteId} onChange={(e) => trocarLote(it.produtoId, e.target.value)} style={{ fontSize: 11, border: `1px solid ${BORDER}`, borderRadius: 6, padding: "2px 4px", flex: 1 }}>

                            <option key={l.id} value={l.id}>Lote {l.codigo} — vence {l.dataValidade ? l.dataValidade.split("-").reverse().join("/") : "s/ validade"} (saldo {l.saldo})</option>

                        </select>
                      ) : (
                        <span style={{ fontSize: 11, color: MUTED, fontStyle: "italic" }}>Sem lote cadastrado — vendendo produção ainda não lançada</span>

            )}

            <Button onClick={reiniciar} style={{ marginTop: 20 }}>Novo pedido</Button>
          </div>
        </Card>
      )}
        </>
      )}
    </div>
  );
}

  }

  const bruto = {
    galpoes, lotesAves, centrosCusto, produtos, lotesProduto, clientes, fornecedores, vendedores,
    funcionarios, motoristas, veiculos, formulacoes: [formulacao], producoesRacao,
    registrosPostura, registrosMortalidade, vendas, movimentacoesEstoque, compras,
    fretes, viagensEntrega, registrosEsterco,
  };
  // Marca cada registro gerado — assim dá pra remover só a demonstração depois,
  // sem risco de apagar algo que você cadastrar de verdade.
  const resultado = {};
  Object.keys(bruto).forEach((chave) => { resultado[chave] = bruto[chave].map((r) => ({ ...r, _demo: true })); });
  return resultado;
}
const COLECOES_DEMO = [
  "galpoes", "lotesAves", "centrosCusto", "produtos", "lotesProduto", "clientes", "fornecedores", "vendedores",
  "funcionarios", "motoristas", "veiculos", "formulacoes", "producoesRacao",
  "registrosPostura", "registrosMortalidade", "vendas", "movimentacoesEstoque", "compras",
  "fretes", "viagensEntrega", "registrosEsterco",
];

function CardDadosDemonstracao({ db, update, filialId }) {
  const [gerando, setGerando] = useState(false);
  const [feito, setFeito] = useState(false);
  const [removendo, setRemovendo] = useState(false);

  const temDemo = COLECOES_DEMO.some((chave) => (db[chave] || []).some((r) => r.filialId === filialId && r._demo));

  function carregar() {
    if (!window.confirm("Isso adiciona 12 meses de dados FICTÍCIOS (1 milhão de aves em 12 galpões, a todo vapor em produção, dúzia do ovo a R$5,69 com 100% vendido, 49 colaboradores na folha, vendas, compras etc.) à filial atual, só para demonstração. Os dados que já existem não são apagados. Continuar?")) return;
    setGerando(true);
    const empresaAtual = db.empresas.find((e) => e.filiais.some((f) => f.id === filialId));
    const filialAtual = empresaAtual?.filiais.find((f) => f.id === filialId);
    const dados = gerarDadosDemonstracao(filialId, empresaAtual, filialAtual);
    update((prev) => {
      const next = { ...prev };
      Object.keys(dados).forEach((chave) => { next[chave] = [...(prev[chave] || []), ...dados[chave]]; });
      return next;
    });
    setGerando(false);
    setFeito(true);
  }

  function remover() {
    if (!window.confirm("Isso remove TODOS os dados marcados como demonstração desta filial, em todos os módulos (aves, vendas, compras, funcionários etc.). Nada que você tenha cadastrado de verdade é afetado. Confirmar remoção?")) return;
    setRemovendo(true);
    update((prev) => {
      const next = { ...prev };
      COLECOES_DEMO.forEach((chave) => {
        next[chave] = (prev[chave] || []).filter((r) => !(r.filialId === filialId && r._demo));
      });
      return next;
    });
    setRemovendo(false);
    setFeito(false);
  }

  return (
    <Card title="Dados de demonstração" subtitle="Carrega 12 meses de operação fictícia a todo vapor (1 milhão de aves em 12 galpões, dúzia do ovo a R$5,69 com 100% da produção vendida, 1% de quebra, venda de esterco, 49 colaboradores na folha), com custos calibrados pra uma margem realista de avicultura de postura — não uma margem artificialmente alta. Não apaga nada do que já existe.">
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <Button onClick={carregar} disabled={gerando}>{gerando ? "Gerando…" : "Carregar dados de demonstração"}</Button>
        {temDemo && <Button variant="danger" onClick={remover} disabled={removendo}>{removendo ? "Removendo…" : "Remover dados de demonstração"}</Button>}
      </div>
      {feito && <div style={{ fontSize: 12, color: SUCCESS, marginTop: 8, fontWeight: 700 }}>Dados de demonstração carregados! Navegue pelos módulos para conferir.</div>}
      {temDemo && <div style={{ fontSize: 11.5, color: MUTED, marginTop: 8 }}>Há dados de demonstração carregados nesta filial.</div>}
    </Card>
  );
}

/* ---------------- Log de Auditoria ---------------- */

function LogAuditoria({ db, filialId }) {
  const [busca, setBusca] = useState("");
  const logs = db.logsAuditoria.filter((l) => l.filialId === filialId);
  const filtrados = (busca ? logs.filter((l) => (l.usuarioNome || "").toLowerCase().includes(busca.toLowerCase()) || (l.modulos || "").toLowerCase().includes(busca.toLowerCase())) : logs)
    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
    .slice(0, 300);

  function formatarData(ts) {
    if (!ts) return "—";
    return new Date(ts).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "medium" });
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: "#EDE7F6", border: "1px solid #C9B8E8", borderRadius: 10, padding: "10px 14px", fontSize: 12, color: "#4A3A70" }}>
        Cada lançamento no sistema (venda, compra, cadastro, edição etc.) gera automaticamente uma linha aqui, com o usuário, o local de onde acessou (por IP, aproximado) e a hora exata. Mostrando os 300 mais recentes.
      </div>
      <Card title={`Registros (${logs.length} no total)`}>
        <TextInput placeholder="Buscar por usuário ou módulo alterado…" value={busca} onChange={(e) => setBusca(e.target.value)} style={{ marginBottom: 12 }} />
        <Table
          columns={[
            { key: "timestamp", label: "Data/Hora", render: (r) => formatarData(r.timestamp) },
            { key: "usuarioNome", label: "Usuário" },
            { key: "local", label: "Local de acesso" },
            { key: "modulos", label: "O que mudou" },
          ]}
          rows={filtrados}
          emptyText="Nenhum lançamento registrado ainda."
        />
      </Card>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<AvisoftRoot />);
</script>
</body>
